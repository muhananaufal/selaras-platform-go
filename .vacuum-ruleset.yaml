# Ruleset for the public contract (api/openapi/edge-v1.yaml, generated from
# api/proto/edge by buf.gen.openapi.yaml - ADR-027).
extends: [[spectral:oas, recommended]]

rules:
  # ON. The Connect JSON mapping is lowerCamelCase (protojson), so every
  # property must be camelCase; a snake_case property would mean a field
  # the generator did not map the way clients read it.
  camel-case-properties: error

  # OFF. Connect paths are /<package>.<Service>/<Method> by the protocol's
  # specification; kebab-case would be a different protocol.
  paths-kebab-case: false

  # Downgraded to info. Examples help documentation, but their absence is not
  # a contract defect, and making it a blocker pushes people to paste
  # careless examples.
  oas3-missing-example: info
