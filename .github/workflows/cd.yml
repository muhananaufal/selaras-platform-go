name: cd

# Pipeline CD (F9-17): bangun image setiap unit, pindai, dorong bertag, lalu
# deploy chart ke overlay yang dipilih. Rollback dijelaskan di
# docs/runbook/deploy.md.
#
# Dipicu oleh tag rilis (v*) atau manual dengan tag image yang sudah ada.
# Push ke main TIDAK men-deploy apa pun: CI hijau bukan izin rilis.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag image yang sudah ada di registri (mis. v1.2.0)"
        required: true
      environment:
        description: "Overlay tujuan"
        type: choice
        options: [cloud]
        default: cloud

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/selaras

jobs:
  # Sebelas image dari satu Dockerfile (UNIT=...), dibangun berurutan per
  # runner supaya cache layer dependensi dipakai bersama; matriks membuat
  # kegagalan satu unit terlihat sendiri, bukan tersembunyi di satu log.
  build:
    name: build ${{ matrix.unit }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        unit:
          - identity-svc
          - profile-svc
          - assessment-svc
          - coaching-svc
          - chat-svc
          - nutrition-svc
          - dashboard-svc
          - llm-worker
          - edge-gateway
          - migrate
          - topics
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.unit }}
          tags: |
            type=ref,event=tag
            type=sha,format=short

      # Dibangun dan dimuat lokal dulu, dipindai, BARU didorong. Image yang
      # gagal pindai tidak pernah ada di registri.
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          load: true
          push: false
          build-args: |
            UNIT=${{ matrix.unit }}
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.unit }}
          cache-to: type=gha,scope=${{ matrix.unit }},mode=max

      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.unit }}:${{ github.ref_name }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push
        run: docker push --all-tags ${{ env.IMAGE_PREFIX }}/${{ matrix.unit }}

  # Deploy: helm upgrade --install --atomic ke overlay cloud dengan tag yang
  # baru dibangun (atau tag yang diberikan manual). --atomic membuat
  # rilis yang gagal --wait dibatalkan sendiri ke revisi sebelumnya - itu
  # rollback otomatis pertama; yang manual ada di runbook.
  deploy:
    name: deploy ${{ github.event.inputs.environment || 'cloud' }}
    needs: [build]
    if: always() && (needs.build.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'cloud' }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.2.4

      # Kubeconfig datang dari Secret lingkungan GitHub, bukan dari repositori
      # (ADR-016). Tanpa Secret ini job gagal di sini - bukan diam-diam
      # men-deploy ke klaster yang salah.
      - name: Kubeconfig
        run: |
          [ -n "${{ secrets.KUBECONFIG_B64 }}" ] || { echo "KUBECONFIG_B64 is not set for this environment" >&2; exit 1; }
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Migrations and topics
        run: |
          kubectl -n selaras delete job -l selaras/job=migrate --ignore-not-found
          kubectl -n selaras delete job topics --ignore-not-found
          sed "s|selaras/\([a-z-]*\):dev|$IMAGE_PREFIX/\1:$TAG|; s|imagePullPolicy: Never|imagePullPolicy: IfNotPresent|" \
            deploy/k8s/jobs/migrate.yaml | kubectl apply -f -
          for s in identity profile assessment coaching chat nutrition dashboard llm; do
            kubectl -n selaras label job "migrate-$s" selaras/job=migrate --overwrite >/dev/null
            kubectl -n selaras wait --for=condition=complete "job/migrate-$s" --timeout=300s
          done
          kubectl -n selaras wait --for=condition=complete job/topics --timeout=300s

      - name: Helm upgrade (atomic)
        run: |
          helm upgrade --install selaras deploy/helm/selaras -n selaras --create-namespace \
            -f deploy/helm/selaras/values-cloud.yaml \
            --set image.registry="$REGISTRY/${{ github.repository_owner }}" \
            --set image.repository=selaras \
            --set image.tag="$TAG" \
            --atomic --wait --timeout 10m
          helm -n selaras history selaras | tail -5
