name: cd

# The CD pipeline (F9-17): build the image of every unit, scan, push tagged,
# then deploy the chart to the chosen overlay. Rollback is described in
# docs/runbook/deploy.md.
#
# Triggered by a release tag (v*) or manually with an existing image tag. A
# push to main deploys NOTHING: a green CI is not a release permission.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag image yang sudah ada di registri (mis. v1.2.0)"
        required: true
      environment:
        description: "Overlay tujuan"
        type: choice
        options: [cloud]
        default: cloud
      budget_override:
        description: "Alasan deploy walau error budget habis (perbaikan reliabilitas/keamanan); kosong = patuhi freeze"
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/selaras

jobs:
  # Eleven images from one Dockerfile (UNIT=...), built in sequence per
  # runner so the dependency layer cache is shared; the matrix makes the
  # failure of one unit visible on its own, not buried in one log.
  build:
    name: build ${{ matrix.unit }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        unit:
          - identity-svc
          - profile-svc
          - assessment-svc
          - coaching-svc
          - chat-svc
          - nutrition-svc
          - dashboard-svc
          - clinic-svc
          - llm-worker
          - edge-gateway
          - migrate
          - topics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.unit }}
          tags: |
            type=ref,event=tag
            type=sha,format=short

      # Built and loaded locally first, scanned, and ONLY THEN pushed. An
      # image that fails the scan never exists in the registry.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          build-args: |
            UNIT=${{ matrix.unit }}
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.unit }}
          cache-to: type=gha,scope=${{ matrix.unit }},mode=max

      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.unit }}:${{ github.ref_name }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push
        run: docker push --all-tags ${{ env.IMAGE_PREFIX }}/${{ matrix.unit }}

      # What was pushed is described and vouched for: a CycloneDX SBOM of the
      # image and a SLSA build provenance, both signed keyless (Sigstore,
      # through the workflow's OIDC identity) and pushed next to the image.
      # The deploy job refuses an image without them
      # (deploy/supply-chain/verify.sh). No storage record: those exist only
      # for organization-owned repositories.
      - name: Image digest
        id: digest
        run: |
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_PREFIX/${{ matrix.unit }}:${{ github.ref_name }}")
          echo "digest=${ref##*@}" >> "$GITHUB_OUTPUT"
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE_PREFIX }}/${{ matrix.unit }}:${{ github.ref_name }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/${{ matrix.unit }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/${{ matrix.unit }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

  # Deploy: helm upgrade --install --atomic to the cloud overlay with the
  # freshly built tag (or the tag given manually). --atomic makes a release
  # that fails --wait roll itself back to the previous revision - that is
  # the first automatic rollback; the manual one is in the runbook.
  deploy:
    name: deploy ${{ github.event.inputs.environment || 'cloud' }}
    needs: [build]
    if: always() && (needs.build.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'cloud' }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      # The kubeconfig comes from a GitHub environment Secret, not from the
      # repository (ADR-016). Without this Secret the job fails here - rather
      # than silently deploying to the wrong cluster.
      - name: Kubeconfig
        run: |
          [ -n "${{ secrets.KUBECONFIG_B64 }}" ] || { echo "KUBECONFIG_B64 is not set for this environment" >&2; exit 1; }
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      # Every image about to run must carry a provenance and an SBOM signed
      # by THIS repository's cd.yml on a GitHub-hosted runner. An image pushed
      # by hand, by another workflow, or altered after the build is refused
      # before anything touches the cluster.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify image provenance and SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for unit in identity-svc profile-svc assessment-svc coaching-svc chat-svc nutrition-svc dashboard-svc clinic-svc llm-worker edge-gateway migrate topics; do
            bash deploy/supply-chain/verify.sh "oci://$IMAGE_PREFIX/$unit:$TAG" .github/workflows/cd.yml
          done

      # Error budget policy (docs/runbook/error-budget.md): a spent budget
      # freezes feature releases. The gate asks the cluster's Prometheus
      # through a port-forward; no Prometheus or no traffic is a warning,
      # not a block. A fix that has to ship anyway is dispatched with
      # budget_override naming the reason.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Error budget gate
        env:
          BUDGET_OVERRIDE: ${{ github.event.inputs.budget_override }}
        run: |
          go build -o bin/ ./cmd/slo-budget
          kubectl -n observability port-forward svc/prometheus 19090:9090 >/tmp/port-forward.log 2>&1 &
          pf=$!
          trap 'kill $pf 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:19090/-/ready && break; sleep 1; done
          bash deploy/slo/gate.sh http://127.0.0.1:19090

      - name: Migrations and topics
        run: |
          kubectl -n selaras delete job -l selaras/job=migrate --ignore-not-found
          kubectl -n selaras delete job topics --ignore-not-found
          sed "s|selaras/\([a-z-]*\):dev|$IMAGE_PREFIX/\1:$TAG|; s|imagePullPolicy: Never|imagePullPolicy: IfNotPresent|" \
            deploy/k8s/jobs/migrate.yaml | kubectl apply -f -
          for s in identity profile assessment coaching chat nutrition dashboard llm clinic; do
            kubectl -n selaras label job "migrate-$s" selaras/job=migrate --overwrite >/dev/null
            kubectl -n selaras wait --for=condition=complete "job/migrate-$s" --timeout=300s
          done
          kubectl -n selaras wait --for=condition=complete job/topics --timeout=300s

      - name: Helm upgrade (atomic)
        run: |
          helm upgrade --install selaras deploy/helm/selaras -n selaras --create-namespace \
            -f deploy/helm/selaras/values-cloud.yaml \
            --set image.registry="$REGISTRY/${{ github.repository_owner }}" \
            --set image.repository=selaras \
            --set image.tag="$TAG" \
            --atomic --wait --timeout 10m
          helm -n selaras history selaras | tail -5
