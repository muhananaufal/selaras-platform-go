name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

# Hak akses minimum. Job apa pun yang butuh lebih harus memintanya
# sendiri, bukan mewarisi izin tulis secara diam-diam.
permissions:
  contents: read

# Run lama pada ref yang sama dibatalkan; hanya yang terbaru yang berarti.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest

    # Postgres dan Redis sungguhan, bukan mock. Repository diuji terhadap
    # basis data karena mock hanya membuktikan mock-nya berperilaku seperti
    # yang ditulis - ia tidak tahu apa-apa tentang batasan CHECK, indeks unik
    # parsial, atau perilaku NULL, dan justru di situlah kekeliruan bersembunyi.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: selaras_admin
          POSTGRES_PASSWORD: ci-not-a-secret
          POSTGRES_DB: selaras
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U selaras_admin -d selaras"
          --health-interval 5s --health-timeout 3s --health-retries 20

      redis:
        image: redis:8.8.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

      # Mailpit menangkap surel keluar dan menyajikannya lewat HTTP, sehingga
      # test bisa membuktikan tautan resetnya benar-benar terkirim dengan
      # tokennya - bukan mengandaikannya.
      mailpit:
        image: axllent/mailpit:v1.28.2
        ports: ['1025:1025', '8025:8025']
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s --health-timeout 3s --health-retries 20

      # Broker yang sama dengan lokal, dalam mode KRaft.
      #
      # Ia ada di sini karena test integrasi Kafka MENGGAGALKAN dirinya saat
      # CI=true dan brokernya tidak ada, alih-alih melewatinya diam-diam.
      kafka:
        image: apache/kafka:4.3.1
        ports: ['9092:9092']
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s --health-timeout 5s --health-retries 20 --health-start-period 30s

    env:
      PGHOST: 127.0.0.1
      PGUSER: selaras_admin
      PGPASSWORD: ci-not-a-secret
      PGDATABASE: selaras

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - run: go vet ./...
      - run: go build ./...

      # Skema dan peran dibuat dengan skrip yang sama seperti di lokal, bukan
      # dengan salinan terpisah. Dua salinan berarti CI dan mesin pengembang
      # bisa berbeda diam-diam, dan yang ketahuan belakangan adalah yang
      # paling mahal.
      - name: Create schemas and service roles
        env:
          SVC_IDENTITY_PASSWORD: ci-not-a-secret
          SVC_PROFILE_PASSWORD: ci-not-a-secret
          SVC_ASSESSMENT_PASSWORD: ci-not-a-secret
          SVC_COACHING_PASSWORD: ci-not-a-secret
          SVC_CHAT_PASSWORD: ci-not-a-secret
          SVC_NUTRITION_PASSWORD: ci-not-a-secret
          SVC_DASHBOARD_PASSWORD: ci-not-a-secret
          SVC_LLM_PASSWORD: ci-not-a-secret
          POSTGRES_USER: selaras_admin
          POSTGRES_DB: selaras
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          # PGHOST sudah ditetapkan di tingkat job, dan psql menghormatinya.
          # Membungkus psql dengan fungsi shell akan rapuh: skripnya berjalan
          # di proses bash terpisah dan fungsi tidak ikut terbawa.
          bash deploy/compose/initdb/01-schemas.sh

      - name: Apply migrations
        env:
          SVC_IDENTITY_PASSWORD: ci-not-a-secret
          SVC_PROFILE_PASSWORD: ci-not-a-secret
          SVC_ASSESSMENT_PASSWORD: ci-not-a-secret
          SVC_LLM_PASSWORD: ci-not-a-secret
        run: |
          go run ./cmd/migrate -service identity -direction up \
            -dsn "pgx5://svc_identity:$SVC_IDENTITY_PASSWORD@127.0.0.1:5432/selaras?sslmode=disable&search_path=identity"
          go run ./cmd/migrate -service profile -direction up \
            -dsn "pgx5://svc_profile:$SVC_PROFILE_PASSWORD@127.0.0.1:5432/selaras?sslmode=disable&search_path=profile"
          go run ./cmd/migrate -service assessment -direction up \
            -dsn "pgx5://svc_assessment:$SVC_ASSESSMENT_PASSWORD@127.0.0.1:5432/selaras?sslmode=disable&search_path=assessment"
          go run ./cmd/migrate -service llm -direction up \
            -dsn "pgx5://svc_llm:$SVC_LLM_PASSWORD@127.0.0.1:5432/selaras?sslmode=disable&search_path=llm"
          for s in coaching chat nutrition dashboard; do
            go run ./cmd/migrate -service "$s" -direction up \
              -dsn "pgx5://svc_$s:ci-not-a-secret@127.0.0.1:5432/selaras?sslmode=disable&search_path=$s"
          done

      # Topic dibuat lewat alat yang sama dengan yang dipakai di lokal, bukan
      # lewat skrip terpisah. Dua salinan akan menyimpang diam-diam.
      - name: Create Kafka topics
        run: go run ./cmd/topics -brokers 127.0.0.1:9092
      # -p 1: beberapa paket test berbagi satu skema Postgres dan
      # mengosongkan tabel yang sama, jadi menjalankannya bersamaan membuat
      # keduanya saling menghapus data.
      # CI menetapkan CI=true, dan pgtest MENGGAGALKAN test integrasi yang
      # DSN-nya tidak ada alih-alih melewatinya. Test integrasi yang
      # diam-diam melewati dirinya sendiri di CI lebih buruk daripada tidak
      # ada test sama sekali: pipeline-nya hijau dan tidak ada yang diperiksa.
      - name: Test
        env:
          SVC_IDENTITY_PASSWORD: ci-not-a-secret
          SVC_PROFILE_PASSWORD: ci-not-a-secret
          SVC_ASSESSMENT_PASSWORD: ci-not-a-secret
          SVC_LLM_PASSWORD: ci-not-a-secret
          TEST_KAFKA_BROKERS: 127.0.0.1:9092
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
          TEST_SMTP_HOST: 127.0.0.1
          TEST_SMTP_PORT: "1025"
          TEST_MAILPIT_URL: http://127.0.0.1:8025
        run: |
          export TEST_DSN_IDENTITY="postgres://svc_identity:$SVC_IDENTITY_PASSWORD@127.0.0.1:5432/selaras?sslmode=disable&search_path=identity"
          export TEST_DSN_PROFILE="postgres://svc_profile:$SVC_PROFILE_PASSWORD@127.0.0.1:5432/selaras?sslmode=disable&search_path=profile"
          export TEST_DSN_ASSESSMENT="postgres://svc_assessment:$SVC_ASSESSMENT_PASSWORD@127.0.0.1:5432/selaras?sslmode=disable&search_path=assessment"
          export TEST_DSN_LLM="postgres://svc_llm:$SVC_LLM_PASSWORD@127.0.0.1:5432/selaras?sslmode=disable&search_path=llm"
          for s in coaching chat nutrition dashboard; do
            export "TEST_DSN_$(echo $s | tr a-z A-Z)=postgres://svc_$s:ci-not-a-secret@127.0.0.1:5432/selaras?sslmode=disable&search_path=$s"
          done
          # test/e2e dan test/acceptance membutuhkan stack yang menyala; job e2e
          # di bawah yang menjalankannya. Di sini keduanya dikeluarkan secara
          # EKSPLISIT, bukan dibiarkan melewati diri - dengan CI=true keduanya
          # akan gagal, dan itu memang perilaku yang diinginkan.
          go test $(go list ./... | grep -v "/test/e2e" | grep -v "/test/acceptance") -race -count=1 -p 1

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  # Kerentanan yang diketahui pada dependensi DAN jalur kode yang benar-benar
  # memanggilnya - govulncheck menyaring yang tidak terjangkau, jadi temuannya
  # layak ditindaklanjuti, bukan sekadar daftar CVE. Versi dipin karena
  # `@latest` menuntut Go yang lebih baru daripada go.mod di bawah
  # GOTOOLCHAIN=local.
  vuln:
    name: known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Scan the module
        run: govulncheck ./...

  # Aturan alert diperlakukan seperti kode: sintaksnya diperiksa, setiap
  # alert dibuktikan menyala dan diam pada deret uji (promtool test rules),
  # dan konfigurasi Alertmanager divalidasi. Image yang sama dengan yang
  # dijalankan compose/k8s, supaya versi PromQL-nya sama.
  alerts:
    name: alert rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check and unit-test the rules
        working-directory: deploy/compose/observability
        run: |
          docker run --rm -v "$PWD:/rules:ro" --entrypoint promtool prom/prometheus:v3.14.0 check rules /rules/alerts.yml
          docker run --rm -v "$PWD:/rules:ro" -w /rules --entrypoint promtool prom/prometheus:v3.14.0 test rules alerts_test.yml
      - name: Validate the Alertmanager config
        working-directory: deploy/compose/observability
        run: docker run --rm -v "$PWD:/am:ro" --entrypoint amtool prom/alertmanager:v0.34.0 check-config /am/alertmanager.yml

  # Chart Helm diperlakukan seperti kode: lint ketat untuk kedua profil nilai,
  # lalu manifest hasil render divalidasi terhadap skema Kubernetes
  # (kubeconform). CRD KEDA tidak punya skema di sana dan dilewati eksplisit.
  chart:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Lint both value profiles
        run: |
          helm lint --strict deploy/helm/selaras -f deploy/helm/selaras/values-local.yaml
          helm lint --strict deploy/helm/selaras -f deploy/helm/selaras/values-cloud.yaml
      - name: Render and validate against the Kubernetes schema
        run: |
          helm template selaras deploy/helm/selaras -n selaras -f deploy/helm/selaras/values-cloud.yaml > /tmp/rendered.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary -ignore-missing-schemas -kubernetes-version 1.33.0 < /tmp/rendered.yaml

  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: 1.72.0
          # Kontrak dikunci di B1: perubahan yang merusak konsumen harus
          # datang sebagai versi paket baru, bukan suntingan di tempat.
          breaking_against: ${{ github.event_name == 'pull_request' && format('{0}#branch={1}', github.repositoryUrl, github.base_ref) || '' }}

  openapi:
    name: rest contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install vacuum
        # Biner rilis, bukan `go install`: go.mod vacuum menuntut Go 1.25.7
        # sementara GOTOOLCHAIN=local menahan toolchain pada go.mod repo ini,
        # dan `go install` menolak dengan galat yang hanya terlihat di runner.
        run: |
          curl -sSfL -o /tmp/vacuum.tar.gz https://github.com/daveshanley/vacuum/releases/download/v0.30.1/vacuum_0.30.1_linux_x86_64.tar.gz
          tar -xzf /tmp/vacuum.tar.gz -C /tmp vacuum
          sudo install -m 0755 /tmp/vacuum /usr/local/bin/vacuum
          vacuum version
      - name: Lint the public REST contract
        run: vacuum lint -d api/openapi/edge-v1.yaml -r .vacuum-ruleset.yaml --fail-severity error

  security:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Seluruh sistem menyala di runner lewat compose - profil yang sama dengan
  # `task up:apps` - lalu suite e2e, daftar periksa aturan (D1-D12, S1-S11),
  # dan skenario k6 baca dengan ambang SLO (F9-11) dijalankan terhadapnya.
  # Kredensial dibuat di runner dan dibuang bersamanya; tidak ada yang berasal
  # dari Secret repositori (ADR-016 melarang bawaan, bukan melarang nilai
  # sekali pakai).
  e2e:
    name: e2e, acceptance, k6
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Write a throwaway .env
        run: |
          keys=$(go run ./cmd/keygen)
          {
            echo "POSTGRES_USER=selaras_admin"
            echo "POSTGRES_PASSWORD=ci-not-a-secret"
            echo "POSTGRES_DB=selaras"
            echo "POSTGRES_HOST=127.0.0.1"
            echo "POSTGRES_PORT=15432"
            echo "REPLICATION_PASSWORD=ci-not-a-secret"
            for s in IDENTITY PROFILE ASSESSMENT COACHING CHAT NUTRITION DASHBOARD LLM; do echo "SVC_${s}_PASSWORD=ci-not-a-secret"; done
            echo "KAFKA_BROKERS=127.0.0.1:19092"
            echo "REDIS_ADDR=127.0.0.1:16379"
            echo "GRAFANA_ADMIN_PASSWORD=ci-not-a-secret"
            echo "JWT_ACCESS_TTL=3600"
            echo "LLM_PROVIDER=fake"
            echo "GEMINI_API_KEY="
            echo "GEMINI_MODEL="
            echo "LOG_LEVEL=info"
            echo "OTEL_EXPORTER_OTLP_ENDPOINT="
            echo "$keys"
          } > .env
          grep -c '^JWT_' .env

      - name: Start the stack
        run: |
          docker compose --env-file .env -f deploy/compose/core.yml -f deploy/compose/apps.yml up -d --build
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:18080/readyz && break; sleep 2; done
          curl -sf http://127.0.0.1:18080/readyz

      - name: Apply migrations and topics
        run: |
          set -a; . ./.env; set +a
          for s in identity profile assessment coaching chat nutrition dashboard llm; do
            go run ./cmd/migrate -service "$s" -direction up \
              -dsn "postgres://svc_$s:ci-not-a-secret@127.0.0.1:15432/selaras?sslmode=disable&search_path=$s"
          done
          go run ./cmd/topics -brokers 127.0.0.1:19092
          docker compose --env-file .env -f deploy/compose/core.yml -f deploy/compose/apps.yml restart \
            identity-svc profile-svc assessment-svc coaching-svc chat-svc nutrition-svc dashboard-svc llm-worker
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:18080/readyz && break; sleep 2; done

      - name: e2e and acceptance
        env:
          TEST_E2E_BASE_URL: http://127.0.0.1:18080
          TEST_REDIS_URL: redis://127.0.0.1:16379/0
        run: |
          export TEST_DSN_LLM="postgres://svc_llm:ci-not-a-secret@127.0.0.1:15432/selaras?sslmode=disable&search_path=llm"
          export TEST_DSN_CHAT="postgres://svc_chat:ci-not-a-secret@127.0.0.1:15432/selaras?sslmode=disable&search_path=chat"
          go test ./test/e2e/ ./test/acceptance/ -count=1 -p 1 -timeout 20m

      - name: k6 read scenario against the SLO
        run: |
          docker run --rm --network selaras-core_default -v "$PWD/test/k6:/k6:ro" \
            -e BASE_URL=http://edge-gateway:8080 grafana/k6:1.8.1 run /k6/scenarios/read.js

      - name: Logs on failure
        if: failure()
        run: docker compose --env-file .env -f deploy/compose/core.yml -f deploy/compose/apps.yml logs --tail=100 || true
