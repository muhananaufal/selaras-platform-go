name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

# Minimum permissions. Any job that needs more has to ask for it itself,
# rather than silently inheriting write permissions.
permissions:
  contents: read

# Older runs on the same ref are cancelled; only the latest one matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest

    # A real Postgres and Redis, not mocks. The repositories are tested against
    # the database because a mock only proves that the mock behaves as written -
    # it knows nothing about CHECK constraints, partial unique indexes, or NULL
    # behaviour, and that is precisely where the mistakes hide.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: selaras_admin
          POSTGRES_PASSWORD: ci-not-a-secret
          POSTGRES_DB: selaras
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U selaras_admin -d selaras"
          --health-interval 5s --health-timeout 3s --health-retries 20

      redis:
        image: redis:8.8.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

      # Mailpit captures outgoing email and serves it over HTTP, so a test
      # can prove the reset link was really sent with its token - not assume
      # it.
      mailpit:
        image: axllent/mailpit:v1.28.2
        ports: ['1025:1025', '8025:8025']
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s --health-timeout 3s --health-retries 20

      # The same broker as locally, in KRaft mode.
      #
      # It is here because the Kafka integration tests FAIL themselves when
      # CI=true and the broker is absent, instead of silently skipping.
      kafka:
        image: apache/kafka:4.3.1
        ports: ['9092:9092']
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s --health-timeout 5s --health-retries 20 --health-start-period 30s

    env:
      PGHOST: 127.0.0.1
      PGUSER: selaras_admin
      PGPASSWORD: ci-not-a-secret
      PGDATABASE: selaras

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - run: go vet ./...
      - run: go build ./...

      # The schemas and roles are created with the same script as locally,
      # not with a separate copy. Two copies mean CI and a developer machine
      # can differ silently, and what is found out late is the most
      # expensive.
      - name: Create schemas and service roles
        env:
          SVC_IDENTITY_PASSWORD: ci-not-a-secret
          SVC_PROFILE_PASSWORD: ci-not-a-secret
          SVC_ASSESSMENT_PASSWORD: ci-not-a-secret
          SVC_COACHING_PASSWORD: ci-not-a-secret
          SVC_CHAT_PASSWORD: ci-not-a-secret
          SVC_NUTRITION_PASSWORD: ci-not-a-secret
          SVC_DASHBOARD_PASSWORD: ci-not-a-secret
          SVC_LLM_PASSWORD: ci-not-a-secret
          POSTGRES_USER: selaras_admin
          POSTGRES_DB: selaras
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          # PGHOST is already set at the job level, and psql honours it.
          # Wrapping psql in a shell function would be fragile: the script
          # runs in a separate bash process and functions do not carry over.
          bash deploy/compose/initdb/01-schemas.sh

      - name: Apply migrations
        env:
          SVC_IDENTITY_PASSWORD: ci-not-a-secret
          SVC_PROFILE_PASSWORD: ci-not-a-secret
          SVC_ASSESSMENT_PASSWORD: ci-not-a-secret
          SVC_LLM_PASSWORD: ci-not-a-secret
        run: |
          go run ./cmd/migrate -service identity -direction up \
            -dsn "pgx5://svc_identity:$SVC_IDENTITY_PASSWORD@127.0.0.1:5432/selaras?sslmode=disable&search_path=identity"
          go run ./cmd/migrate -service profile -direction up \
            -dsn "pgx5://svc_profile:$SVC_PROFILE_PASSWORD@127.0.0.1:5432/selaras?sslmode=disable&search_path=profile"
          go run ./cmd/migrate -service assessment -direction up \
            -dsn "pgx5://svc_assessment:$SVC_ASSESSMENT_PASSWORD@127.0.0.1:5432/selaras?sslmode=disable&search_path=assessment"
          go run ./cmd/migrate -service llm -direction up \
            -dsn "pgx5://svc_llm:$SVC_LLM_PASSWORD@127.0.0.1:5432/selaras?sslmode=disable&search_path=llm"
          for s in coaching chat nutrition dashboard; do
            go run ./cmd/migrate -service "$s" -direction up \
              -dsn "pgx5://svc_$s:ci-not-a-secret@127.0.0.1:5432/selaras?sslmode=disable&search_path=$s"
          done

      # The topics are created through the same tool used locally, not
      # through a separate script. Two copies would drift silently.
      - name: Create Kafka topics
        run: go run ./cmd/topics -brokers 127.0.0.1:9092
      # -p 1: several test packages share one Postgres schema and truncate the
      # same tables, so running them concurrently makes them wipe each other's
      # data. CI sets CI=true, and pgtest FAILS the integration tests whose
      # DSN is absent instead of skipping them. An integration test that
      # silently skips itself in CI is worse than no test at all: the pipeline
      # is green and nothing was checked.
      - name: Test
        env:
          SVC_IDENTITY_PASSWORD: ci-not-a-secret
          SVC_PROFILE_PASSWORD: ci-not-a-secret
          SVC_ASSESSMENT_PASSWORD: ci-not-a-secret
          SVC_LLM_PASSWORD: ci-not-a-secret
          TEST_KAFKA_BROKERS: 127.0.0.1:9092
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
          TEST_SMTP_HOST: 127.0.0.1
          TEST_SMTP_PORT: "1025"
          TEST_MAILPIT_URL: http://127.0.0.1:8025
        run: |
          export TEST_DSN_IDENTITY="postgres://svc_identity:$SVC_IDENTITY_PASSWORD@127.0.0.1:5432/selaras?sslmode=disable&search_path=identity"
          export TEST_DSN_PROFILE="postgres://svc_profile:$SVC_PROFILE_PASSWORD@127.0.0.1:5432/selaras?sslmode=disable&search_path=profile"
          export TEST_DSN_ASSESSMENT="postgres://svc_assessment:$SVC_ASSESSMENT_PASSWORD@127.0.0.1:5432/selaras?sslmode=disable&search_path=assessment"
          export TEST_DSN_LLM="postgres://svc_llm:$SVC_LLM_PASSWORD@127.0.0.1:5432/selaras?sslmode=disable&search_path=llm"
          for s in coaching chat nutrition dashboard; do
            export "TEST_DSN_$(echo $s | tr a-z A-Z)=postgres://svc_$s:ci-not-a-secret@127.0.0.1:5432/selaras?sslmode=disable&search_path=$s"
          done
          # test/e2e, test/acceptance and test/drill need a running stack; the e2e job below
          # runs them. Here all three are EXPLICITLY excluded, not left to skip
          # themselves - with CI=true they would fail, and that is precisely the
          # intended behaviour.
          # -json so every skip is visible: a green run says nothing about a
          # test that did not run (test/skips/check.sh).
          rc=0
          go test $(go list ./... | grep -v "/test/e2e" | grep -v "/test/acceptance" | grep -v "/test/drill") -race -count=1 -p 1 -json > unit-report.json || rc=$?
          jq -r 'select(.Action == "output") | .Output' unit-report.json | grep -vE '^(=== (RUN|PAUSE|CONT)|--- PASS)' || true
          bash test/skips/check.sh unit-report.json test/skips/unit.allow || rc=1
          exit "$rc"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  # Known vulnerabilities in the dependencies AND the code paths that actually
  # call them - govulncheck filters out the unreachable ones, so its findings
  # are worth acting on, not merely a list of CVEs. The version is pinned
  # because `@latest` demands a newer Go than go.mod under GOTOOLCHAIN=local.
  vuln:
    name: known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Scan the module
        run: govulncheck ./...

  # The alert rules are treated like code: their syntax is checked, every
  # alert is proven to fire and stay quiet on the test series (promtool test
  # rules), and the Alertmanager configuration is validated. The same images
  # compose/k8s run, so the PromQL version is the same.
  alerts:
    name: alert rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check and unit-test the rules
        working-directory: deploy/compose/observability
        run: |
          docker run --rm -v "$PWD:/rules:ro" --entrypoint promtool prom/prometheus:v3.14.0 check rules /rules/alerts.yml /rules/slo-rules.yml
          docker run --rm -v "$PWD:/rules:ro" -w /rules --entrypoint promtool prom/prometheus:v3.14.0 test rules alerts_test.yml
      - name: Validate the Alertmanager config
        working-directory: deploy/compose/observability
        run: docker run --rm -v "$PWD:/am:ro" --entrypoint amtool prom/alertmanager:v0.34.0 check-config /am/alertmanager.yml

  # The clinic access model (ADR-030) is tested with the official OpenFGA
  # CLI: every rule the owner set has a check, and the script first proves a
  # wrong assertion fails the test - for the assertion, not for another
  # reason.
  authz-model:
    name: authorization model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install the fga CLI
        run: go install github.com/openfga/cli/cmd/fga@v0.8.1
      - name: Test the model
        run: bash deploy/openfga/test.sh

  # Migrations are linted with squawk (the pinned image) against the rules in
  # .squawk.toml; files older than the frozen baseline are not rewritten. The
  # script first proves the gate refuses a known-unsafe fixture.
  migrations:
    name: migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint migrations newer than the frozen baseline
        run: bash migrations/lint.sh

  # The Helm chart is treated like code: strict lint for both value profiles,
  # then the rendered manifests are validated against the Kubernetes schemas
  # (kubeconform). The KEDA CRD has no schema there and is skipped explicitly.
  # Backup, restore and point-in-time recovery, against throwaway Postgres
  # containers: a failed round must leave no file under a final name, a
  # round must carry all eight schemas and all eight unit roles, restoring
  # roles may ignore only "role ... already exists", and a restore to a
  # point in time must hold what was written before it and nothing after.
  # Infrastructure as code: deploy/iac/k3d (OpenTofu) is applied to a fresh
  # k3d cluster on the runner, and test/iac/drift.test.sh proves that a plan
  # right after the apply is empty, that hand edits show up as drift, and
  # that the next apply undoes them. The wrapper of setup-opentofu is off:
  # the drift check reads plan's real exit code (0 no changes, 2 changes).
  # Mutation testing (gremlins v0.6.0) on the domain packages, whose tests
  # are pure: a package may not gain a surviving (LIVED) or an untested (NOT
  # COVERED) mutant compared with test/mutation/baseline.txt, and a run with
  # a timed-out mutant fails as inconclusive. Integration packages are left
  # out on purpose - without their database here, every test would fail and
  # every mutant would count as killed.
  mutation:
    name: mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - name: Domain packages may not gain surviving or untested mutants
        run: bash test/mutation/run.sh 4

  iac:
    name: infrastructure as code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - name: Format and validate
        working-directory: deploy/iac/k3d
        run: |
          tofu fmt -check -recursive -diff
          tofu init -input=false
          tofu validate
      - name: Install k3d (checksum verified)
        run: |
          curl -fsSLO https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
          curl -fsSLO https://github.com/k3d-io/k3d/releases/download/v5.9.0/checksums.txt
          # checksums.txt names the file _dist/k3d-linux-amd64; the hash is
          # checked against the file downloaded here.
          want=$(grep '  _dist/k3d-linux-amd64$' checksums.txt | cut -d' ' -f1)
          [ -n "$want" ] || { echo "no checksum for k3d-linux-amd64"; exit 1; }
          echo "$want  k3d-linux-amd64" | sha256sum -c -
          sudo install -m 755 k3d-linux-amd64 /usr/local/bin/k3d
          k3d version
      - name: Create the cluster from deploy/k3d/cluster.yaml
        run: bash deploy/k3d/up.sh
      - name: Apply, no drift after apply, drift detected and undone
        run: bash test/iac/drift.test.sh

  backup:
    name: backup and restore scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Backup rounds
        run: bash test/drill/backup.test.sh
      - name: Restoring roles
        run: bash test/drill/restore-globals.test.sh
      - name: Point-in-time recovery
        run: bash test/drill/pitr.test.sh
      - name: Provisioning is idempotent
        run: bash test/drill/provision.test.sh

  chart:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Lint both value profiles
        run: |
          helm lint --strict deploy/helm/selaras -f deploy/helm/selaras/values-local.yaml
          helm lint --strict deploy/helm/selaras -f deploy/helm/selaras/values-cloud.yaml
      - name: Render and validate against the Kubernetes schema
        run: |
          helm template selaras deploy/helm/selaras -n selaras -f deploy/helm/selaras/values-cloud.yaml > /tmp/rendered.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary -ignore-missing-schemas -kubernetes-version 1.33.0 < /tmp/rendered.yaml

  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: 1.72.0
          # The contracts were locked in B1: a change that breaks consumers has to
          # come as a new package version, not an in-place edit.
          #
          # breaking_against is NOT overridden: buf-action's default already compares
          # against the PR's base branch (and the previous commit on push). Two
          # earlier overrides were both red on Dependabot PRs - github.repositoryUrl
          # has the git:// form GitHub no longer serves, and .git#branch=main demands
          # a local ref a PR checkout does not create.
          #
          # PR comments are switched off: this workflow is deliberately contents: read
          # only, and buf-action fails when it tries to write a comment with that
          # permission.
          pr_comment: false

  generated:
    name: generated code is current
    runs-on: ubuntu-latest
    # Three buf templates generate from api/proto: grpc-go for the services,
    # Connect for the edge, OpenAPI for third parties. A forgotten run leaves a
    # contract and its code disagreeing without any other job noticing - it
    # happened once already (the translated proto comments). Sloth generates
    # the SLO alert rules from deploy/slo/selaras.yml the same way. This job
    # regenerates everything and fails on any difference.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: 1.72.0
          setup_only: true
      - name: Install the pinned generators
        # The versions that produced the committed code. Each module's go.mod
        # asks for at most Go 1.26.0, within this repo's toolchain, so
        # GOTOOLCHAIN=local does not refuse them.
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.21.0
          go install github.com/sudorandom/protoc-gen-connect-openapi@v0.26.0
          go install github.com/slok/sloth/cmd/sloth@v0.16.0
      - name: Regenerate and compare
        run: |
          buf generate
          buf generate --template buf.gen.edge.yaml
          buf generate --template buf.gen.openapi.yaml
          sloth generate -i deploy/slo/selaras.yml -o deploy/compose/observability/slo-rules.yml
          git diff --exit-code -- gen api/openapi deploy/compose/observability/slo-rules.yml

  openapi:
    name: public contract (OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install vacuum
        # The release binary, not `go install`: vacuum's go.mod demands Go
        # 1.25.7 while GOTOOLCHAIN=local holds the toolchain at this repo's
        # go.mod, and `go install` refuses with an error only visible on the
        # runner.
        run: |
          curl -sSfL -o /tmp/vacuum.tar.gz https://github.com/daveshanley/vacuum/releases/download/v0.30.1/vacuum_0.30.1_linux_x86_64.tar.gz
          tar -xzf /tmp/vacuum.tar.gz -C /tmp vacuum
          sudo install -m 0755 /tmp/vacuum /usr/local/bin/vacuum
          vacuum version
      - name: Lint the generated OpenAPI of the public contract
        run: vacuum lint -d api/openapi/edge-v1.yaml -r .vacuum-ruleset.yaml --fail-severity error

  security:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Supply chain: the edge-gateway binary gets a CycloneDX SBOM and a SLSA
  # build provenance, both signed keyless through Sigstore by actions/attest,
  # and then both are VERIFIED the way the CD deploy job verifies images
  # (deploy/supply-chain/verify.sh). CD only runs on a release tag, so this
  # job is where the mechanism is proven on every change - including that a
  # binary altered by one byte is refused. Skipped for forks, which get no
  # OIDC token.
  supply-chain:
    name: supply chain (SBOM, provenance)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the edge-gateway binary
        run: CGO_ENABLED=0 go build -trimpath -o dist/edge-gateway ./cmd/edge-gateway
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: dist/edge-gateway
          format: cyclonedx-json
          output-file: dist/edge-gateway.cdx.json
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false
      - name: The SBOM lists what the binary is built from
        run: bash deploy/supply-chain/check-sbom.sh dist/edge-gateway.cdx.json connectrpc.com/connect google.golang.org/grpc go.opentelemetry.io/otel
      - name: Attest the build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/edge-gateway
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/edge-gateway
          sbom-path: dist/edge-gateway.cdx.json
      - name: Verify both, and refuse a tampered binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash deploy/supply-chain/verify.sh dist/edge-gateway .github/workflows/ci.yml
          # An attestation from a different workflow of the same repository
          # must not count.
          if bash deploy/supply-chain/verify.sh dist/edge-gateway .github/workflows/cd.yml 2>/dev/null; then
            echo "::error::an attestation signed by ci.yml passed as cd.yml"; exit 1
          fi
          cp dist/edge-gateway dist/tampered
          printf '\0' >> dist/tampered
          if bash deploy/supply-chain/verify.sh dist/tampered .github/workflows/ci.yml 2>/dev/null; then
            echo "::error::a tampered binary passed verification"; exit 1
          fi
          echo "refused: other workflow, tampered binary"

  # The whole system starts on the runner through compose - the same profile
  # as `task up:apps` - and then the e2e suite, the rule checklist (D1-D12,
  # S1-S11), and the k6 read scenario with the SLO thresholds (F9-11) run
  # against it. Credentials are created on the runner and thrown away with it;
  # none come from a repository Secret (ADR-016 forbids defaults, not
  # throwaway values).
  e2e:
    name: e2e, acceptance, k6
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Write a throwaway .env
        run: |
          keys=$(go run ./cmd/keygen)
          {
            echo "POSTGRES_USER=selaras_admin"
            echo "POSTGRES_PASSWORD=ci-not-a-secret"
            echo "POSTGRES_DB=selaras"
            echo "POSTGRES_HOST=127.0.0.1"
            echo "POSTGRES_PORT=15432"
            echo "REPLICATION_PASSWORD=ci-not-a-secret"
            for s in IDENTITY PROFILE ASSESSMENT COACHING CHAT NUTRITION DASHBOARD LLM; do echo "SVC_${s}_PASSWORD=ci-not-a-secret"; done
            echo "KAFKA_BROKERS=127.0.0.1:19092"
            echo "REDIS_ADDR=127.0.0.1:16379"
            echo "GRAFANA_ADMIN_PASSWORD=ci-not-a-secret"
            echo "JWT_ACCESS_TTL=3600"
            echo "LLM_PROVIDER=fake"
            echo "GEMINI_API_KEY="
            echo "GEMINI_MODEL="
            echo "LOG_LEVEL=info"
            echo "OTEL_EXPORTER_OTLP_ENDPOINT="
            echo "$keys"
          } > .env
          grep -c '^JWT_' .env

      - name: Start the stack
        run: |
          docker compose --env-file .env -f deploy/compose/core.yml -f deploy/compose/apps.yml up -d --build
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:18080/readyz && break; sleep 2; done
          curl -sf http://127.0.0.1:18080/readyz

      - name: Apply migrations and topics
        run: |
          set -a; . ./.env; set +a
          for s in identity profile assessment coaching chat nutrition dashboard llm; do
            go run ./cmd/migrate -service "$s" -direction up \
              -dsn "postgres://svc_$s:ci-not-a-secret@127.0.0.1:15432/selaras?sslmode=disable&search_path=$s"
          done
          go run ./cmd/topics -brokers 127.0.0.1:19092
          docker compose --env-file .env -f deploy/compose/core.yml -f deploy/compose/apps.yml restart \
            identity-svc profile-svc assessment-svc coaching-svc chat-svc nutrition-svc dashboard-svc llm-worker
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:18080/readyz && break; sleep 2; done

      - name: e2e and acceptance
        env:
          TEST_E2E_BASE_URL: http://127.0.0.1:18080
          TEST_REDIS_URL: redis://127.0.0.1:16379/0
        run: |
          export TEST_DSN_LLM="postgres://svc_llm:ci-not-a-secret@127.0.0.1:15432/selaras?sslmode=disable&search_path=llm"
          export TEST_DSN_CHAT="postgres://svc_chat:ci-not-a-secret@127.0.0.1:15432/selaras?sslmode=disable&search_path=chat"
          rc=0
          # The broker-outage test stops Kafka; it runs in its own step after k6.
          go test ./test/e2e/ ./test/acceptance/ -count=1 -p 1 -timeout 20m -skip '^TestTheOutboxSurvivesABrokerOutage$' -json > e2e-report.json || rc=$?
          jq -r 'select(.Action == "output") | .Output' e2e-report.json | grep -vE '^(=== (RUN|PAUSE|CONT)|--- PASS)' || true
          bash test/skips/check.sh e2e-report.json test/skips/e2e.allow || rc=1
          exit "$rc"

      - name: k6 read scenario against the SLO
        run: |
          docker run --rm --network selaras-core_default -v "$PWD/test/k6:/k6:ro" \
            -e BASE_URL=http://edge-gateway:8080 grafana/k6:1.8.1 run /k6/scenarios/read.js

      # The two tests that disturb the stack run last, each in its own step,
      # so nothing else runs while the schema is altered or the broker is
      # down. Both used to skip themselves in CI; now they are required.
      - name: Expand/contract migration drill under live traffic
        env:
          TEST_DRILL: "1"
          TEST_E2E_BASE_URL: http://127.0.0.1:18080
        run: |
          export TEST_DSN_ASSESSMENT="postgres://svc_assessment:ci-not-a-secret@127.0.0.1:15432/selaras?sslmode=disable&search_path=assessment"
          rc=0
          go test ./test/drill/expand/ -count=1 -timeout 10m -json > drill-report.json || rc=$?
          jq -r 'select(.Action == "output") | .Output' drill-report.json | grep -vE '^(=== (RUN|PAUSE|CONT)|--- PASS)' || true
          bash test/skips/check.sh drill-report.json test/skips/none.allow || rc=1
          exit "$rc"

      - name: The outbox survives a broker outage
        env:
          TEST_E2E_DISRUPTIVE: "1"
          TEST_E2E_BASE_URL: http://127.0.0.1:18080
        run: |
          export TEST_DSN_LLM="postgres://svc_llm:ci-not-a-secret@127.0.0.1:15432/selaras?sslmode=disable&search_path=llm"
          rc=0
          go test ./test/e2e/ -run '^TestTheOutboxSurvivesABrokerOutage$' -count=1 -timeout 10m -json > outage-report.json || rc=$?
          jq -r 'select(.Action == "output") | .Output' outage-report.json | grep -vE '^(=== (RUN|PAUSE|CONT)|--- PASS)' || true
          bash test/skips/check.sh outage-report.json test/skips/none.allow || rc=1
          exit "$rc"

      - name: Logs on failure
        if: failure()
        run: docker compose --env-file .env -f deploy/compose/core.yml -f deploy/compose/apps.yml logs --tail=100 || true
