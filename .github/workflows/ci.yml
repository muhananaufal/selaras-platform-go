name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

# Hak akses minimum. Job apa pun yang butuh lebih harus memintanya
# sendiri, bukan mewarisi izin tulis secara diam-diam.
permissions:
  contents: read

# Run lama pada ref yang sama dibatalkan; hanya yang terbaru yang berarti.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race -count=1

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2

  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1.5.0
        with:
          version: 1.72.0
          # Kontrak dikunci di B1: perubahan yang merusak konsumen harus
          # datang sebagai versi paket baru, bukan suntingan di tempat.
          breaking_against: ${{ github.event_name == 'pull_request' && format('{0}#branch={1}', github.repositoryUrl, github.base_ref) || '' }}

  openapi:
    name: rest contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install vacuum
        run: go install github.com/daveshanley/vacuum@v0.30.1
      - name: Lint the public REST contract
        run: vacuum lint -d api/openapi/edge-v1.yaml -r .vacuum-ruleset.yaml --fail-severity error

  security:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
