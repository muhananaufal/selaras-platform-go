# Automated dependency updates, grouped so they do not become dozens of PRs a
# week. Every PR still goes through the full CI; actions are pinned to a SHA
# in the workflows, and Dependabot updates the SHA along with its tag comment.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /deploy/compose
    schedule:
      interval: weekly
      day: monday
    groups:
      compose-images:
        patterns: ["*"]
