version: "3"

vars:
  MODULE: github.com/muhananaufal/selaras-platform-go
  COMPOSE_CORE: deploy/compose/core.yml
  COMPOSE_APPS: deploy/compose/apps.yml
  COMPOSE_FULL: deploy/compose/full.yml
  COMPOSE_BACKUP: deploy/compose/backup.yml

  # Docker daemon hidup di dalam WSL. Perintah yang memakai bind mount
  # WAJIB dijalankan dari dalam WSL juga.
  #
  # Terbukti di B0-08: CLI Windows yang diberi path /mnt/c menerima
  # perintahnya, keluar dengan exit 0, lalu me-mount direktori KOSONG.
  # Tidak ada pesan galat. Itu kegagalan senyap - `compose up` akan
  # tampak berhasil sementara initdb tidak pernah dijalankan.
  #
  # Perintah tanpa bind mount (ps, logs, version) tetap aman dari Windows.
  WSL_DISTRO: Ubuntu
  PROJECT_WSL:
    sh: wsl -d Ubuntu -- wslpath -a '{{.ROOT_DIR}}'

tasks:
  default:
    desc: Show available tasks
    cmds: [task --list]
    silent: true

  # ---------------------------------------------------------------- quality
  fmt:
    desc: Format hand-written Go code
    # gen/ sengaja dilewati. goimports mengelompokkan ulang import di sana,
    # sementara buf generate mengembalikannya - hasilnya diff yang berayun
    # bolak-balik setiap kali salah satunya dijalankan.
    cmds:
      - gofmt -l -w cmd internal
      - goimports -local {{.MODULE}} -w cmd internal

  lint:
    desc: Run golangci-lint over the whole module
    cmds: [golangci-lint run ./...]

  vet:
    desc: Run go vet
    cmds: [go vet ./...]

  tidy:
    desc: Tidy and verify go.mod
    cmds:
      - go mod tidy
      - go mod verify

  # ---------------------------------------------------------------- contract
  proto:lint:
    desc: Lint protobuf definitions
    cmds: [buf lint]

  proto:breaking:
    desc: Detect breaking changes against develop
    cmds: ["buf breaking --against '.git#branch=develop'"]

  proto:gen:
    desc: Generate Go code from protobuf
    cmds: [buf generate]

  proto:
    desc: Lint then generate protobuf
    cmds:
      - task: proto:lint
      - task: openapi:lint
      - task: proto:gen

  openapi:lint:
    desc: Lint the public REST contract
    cmds: [vacuum lint -d api/openapi/edge-v1.yaml -r .vacuum-ruleset.yaml --fail-severity error]

  # ---------------------------------------------------------------- build
  build:
    desc: Build every unit into bin/
    cmds: [go build -o bin/ ./cmd/...]

  image:build:
    desc: Build a unit image (UNIT=edge-gateway task image:build)
    # Lewat WSL: buildx tidak tersedia pada CLI statis Windows, sementara
    # BuildKit dibutuhkan untuk cache mount pada layer dependensi.
    vars:
      UNIT: '{{.UNIT | default "edge-gateway"}}'
      VERSION: '{{.VERSION | default "dev"}}'
    cmds:
      - wsl -d {{.WSL_DISTRO}} -- bash -lc "cd {{.PROJECT_WSL}} && docker build --build-arg UNIT={{.UNIT}} --build-arg VERSION={{.VERSION}} --build-arg REVISION=$(git rev-parse --short HEAD) -t selaras/{{.UNIT}}:{{.VERSION}} ."

  image:run:
    desc: Run a built unit image locally
    vars:
      UNIT: '{{.UNIT | default "edge-gateway"}}'
    cmds:
      - docker run --rm -p 127.0.0.1:18080:8080 selaras/{{.UNIT}}:dev

  # ---------------------------------------------------------------- test
  test:
    desc: Run unit tests
    # Tanpa -race: detektor itu menuntut cgo, dan mesin Windows ini tidak
    # punya toolchain C. CI berjalan di Linux dan tetap memakai -race, jadi
    # data race tetap tertangkap sebelum merge.
    cmds: [go test ./... -count=1]

  test:race:
    desc: Run unit tests with the race detector (needs cgo)
    cmds: [go test ./... -race -count=1]

  test:e2e:
    desc: Run the end-to-end suite against the running local stack
    # Suite ini membutuhkan seluruh unit menyala (task up:apps atau up:full).
    # TEST_DSN_LLM dipakai test outbox untuk membaca tabel job worker.
    dotenv: [".env"]
    cmds:
      - >-
        TEST_E2E_BASE_URL="http://127.0.0.1:18080"
        TEST_DSN_LLM="postgres://svc_llm:$SVC_LLM_PASSWORD@127.0.0.1:$POSTGRES_PORT/$POSTGRES_DB?sslmode=disable&search_path=llm"
        go test ./test/e2e/ -count=1 -p 1 -timeout 20m

  test:integration:
    desc: Run every test against the running local stack, Postgres included
    # -p 1 menjalankan paket satu per satu. Beberapa paket test berbagi satu
    # skema Postgres dan mengosongkan tabel yang sama, jadi menjalankannya
    # bersamaan membuat keduanya saling menghapus data - kegagalan yang
    # bergantung pada penjadwalan, dan karena itu kadang lolos.
    # dotenv memuat berkas ke environment proses, tetapi nilainya TIDAK
    # tersedia untuk templating {{...}} - karena itu DSN dirakit oleh shell.
    #
    # Unit aplikasi WAJIB mati (task down:apps) saat suite ini berjalan:
    # relay outbox unit yang hidup membaca tabel yang sama dengan test relay
    # (FOR UPDATE SKIP LOCKED) dan mencuri barisnya - kegagalan yang bergantung
    # pada penjadwalan, terlihat di gerbang keluar F9. Job unit CI tidak
    # menyalakan unit; e2e dan acceptance yang membutuhkannya punya task sendiri.
    dotenv: ['.env']
    cmds:
      - >-
        if docker ps --format '{{"{{"}}.Names{{"}}"}}' | grep -qE '^selaras-(identity|profile|assessment|coaching|chat|nutrition|dashboard|llm-worker)$'; then
          echo 'application units are running; stop them first (task down:apps) - their outbox relays steal rows from the relay tests' >&2; exit 1;
        fi
      - >-
        TEST_DSN_IDENTITY="postgres://svc_identity:$SVC_IDENTITY_PASSWORD@127.0.0.1:$POSTGRES_PORT/$POSTGRES_DB?sslmode=disable&search_path=identity"
        TEST_DSN_PROFILE="postgres://svc_profile:$SVC_PROFILE_PASSWORD@127.0.0.1:$POSTGRES_PORT/$POSTGRES_DB?sslmode=disable&search_path=profile"
        TEST_DSN_ASSESSMENT="postgres://svc_assessment:$SVC_ASSESSMENT_PASSWORD@127.0.0.1:$POSTGRES_PORT/$POSTGRES_DB?sslmode=disable&search_path=assessment"
        TEST_DSN_COACHING="postgres://svc_coaching:$SVC_COACHING_PASSWORD@127.0.0.1:$POSTGRES_PORT/$POSTGRES_DB?sslmode=disable&search_path=coaching"
        TEST_DSN_CHAT="postgres://svc_chat:$SVC_CHAT_PASSWORD@127.0.0.1:$POSTGRES_PORT/$POSTGRES_DB?sslmode=disable&search_path=chat"
        TEST_DSN_NUTRITION="postgres://svc_nutrition:$SVC_NUTRITION_PASSWORD@127.0.0.1:$POSTGRES_PORT/$POSTGRES_DB?sslmode=disable&search_path=nutrition"
        TEST_DSN_DASHBOARD="postgres://svc_dashboard:$SVC_DASHBOARD_PASSWORD@127.0.0.1:$POSTGRES_PORT/$POSTGRES_DB?sslmode=disable&search_path=dashboard"
        TEST_DSN_LLM="postgres://svc_llm:$SVC_LLM_PASSWORD@127.0.0.1:$POSTGRES_PORT/$POSTGRES_DB?sslmode=disable&search_path=llm"
        TEST_KAFKA_BROKERS="127.0.0.1:19092"
        TEST_REDIS_URL="redis://127.0.0.1:16379/0"
        TEST_SMTP_HOST="127.0.0.1"
        TEST_SMTP_PORT="11025"
        TEST_MAILPIT_URL="http://127.0.0.1:18025"
        go test ./... -count=1 -p 1

  up:apps:
    desc: Start the dependencies and the application units
    cmds:
      - wsl -d {{.WSL_DISTRO}} -- bash -lc "cd {{.PROJECT_WSL}} && docker compose --env-file .env -f {{.COMPOSE_CORE}} -f {{.COMPOSE_APPS}} up -d --build"

  down:apps:
    desc: Stop the application units, leaving the dependencies running
    cmds:
      - wsl -d {{.WSL_DISTRO}} -- bash -lc "cd {{.PROJECT_WSL}} && docker compose --env-file .env -f {{.COMPOSE_CORE}} -f {{.COMPOSE_APPS}} rm -sf identity-svc profile-svc assessment-svc coaching-svc chat-svc nutrition-svc dashboard-svc llm-worker edge-gateway topics"

  keygen:
    desc: Print a matching pair of token signing and verification keys
    cmds: [go run ./cmd/keygen]

  up:
    desc: Start core dependencies (postgres, kafka, redis)
    cmds:
      - wsl -d {{.WSL_DISTRO}} -- bash -lc "cd {{.PROJECT_WSL}} && docker compose --env-file .env -f {{.COMPOSE_CORE}} up -d"

  up:full:
    desc: Start everything including the application units and the observability stack
    # OTEL_COLLECTOR_ENDPOINT diisi di sini, bukan di .env: alamat ini hanya
    # berlaku bila collectornya ikut menyala, dan profil inilah yang
    # menyalakannya. Tanpa collector, alamat yang terisi hanya menghasilkan
    # galat ekspor di setiap unit.
    cmds:
      - wsl -d {{.WSL_DISTRO}} -- bash -lc "cd {{.PROJECT_WSL}} && OTEL_COLLECTOR_ENDPOINT=http://otel-collector:4317 docker compose --env-file .env -f {{.COMPOSE_CORE}} -f {{.COMPOSE_APPS}} -f {{.COMPOSE_FULL}} -f {{.COMPOSE_BACKUP}} up -d --build"

  down:
    desc: Stop local dependencies
    cmds:
      - wsl -d {{.WSL_DISTRO}} -- bash -lc "cd {{.PROJECT_WSL}} && docker compose --env-file .env -f {{.COMPOSE_CORE}} -f {{.COMPOSE_APPS}} -f {{.COMPOSE_FULL}} down"

  logs:
    desc: Tail dependency logs
    cmds:
      - wsl -d {{.WSL_DISTRO}} -- bash -lc "cd {{.PROJECT_WSL}} && docker compose --env-file .env -f {{.COMPOSE_CORE}} logs -f --tail=100"

  ps:
    desc: List running containers
    cmds: [docker ps]

  # ---------------------------------------------------------------- security
  security:
    desc: Scan the repository for leaked secrets
    cmds: [gitleaks detect --no-banner --redact]

  # ---------------------------------------------------------------- gate
  ci:
    desc: Everything CI runs, in the same order
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: proto:lint
      - task: openapi:lint
      - task: test

  backup:now:
    desc: Take one verified Postgres backup into the backups volume (F9-30)
    cmds:
      - wsl -d {{.WSL_DISTRO}} -- bash -lc "cd {{.PROJECT_WSL}} && docker compose --env-file .env -f {{.COMPOSE_CORE}} -f {{.COMPOSE_BACKUP}} run --rm -e BACKUP_ONCE=1 backup"

  backup:list:
    desc: List the backups in the volume
    cmds:
      - docker run --rm -v selaras-core_backups:/backups alpine ls -la /backups

  # ---------------------------------------------------------------- k3d
  k3d:up:
    desc: Create the local k3d cluster from deploy/k3d/cluster.yaml (F9-04)
    cmds:
      - wsl -d {{.WSL_DISTRO}} -- bash {{.PROJECT_WSL}}/deploy/k3d/up.sh

  k3d:down:
    desc: Delete the local k3d cluster
    cmds:
      - wsl -d {{.WSL_DISTRO}} -- bash {{.PROJECT_WSL}}/deploy/k3d/down.sh

  k3d:secrets:
    desc: Create the two Secrets (infra + units) in the cluster from .env, never from the chart
    cmds:
      - wsl -d {{.WSL_DISTRO}} -- bash {{.PROJECT_WSL}}/deploy/k3d/secrets.sh

  k3d:infra:
    desc: Apply Postgres, Kafka, Redis, Mailpit, PgBouncer and the observability stack
    cmds:
      - wsl -d {{.WSL_DISTRO}} -- bash {{.PROJECT_WSL}}/deploy/k3d/infra.sh

  k3d:import:
    desc: Build every unit image and import it into the cluster
    cmds:
      - wsl -d {{.WSL_DISTRO}} -- bash {{.PROJECT_WSL}}/deploy/k3d/import.sh

  k3d:deploy:
    desc: Install or upgrade the selaras chart with values-local.yaml
    cmds:
      - wsl -d {{.WSL_DISTRO}} -- bash {{.PROJECT_WSL}}/deploy/k3d/deploy.sh

  k3d:all:
    desc: One command - cluster, secrets, infra, images, chart (F9-04)
    cmds:
      - task: k3d:up
      - task: k3d:secrets
      - task: k3d:infra
      - task: k3d:import
      - task: k3d:deploy

  partitions:
    desc: Maintain monthly partitions for every partitioned table (F9-29)
    # DSN admin yang boleh menyentuh kedelapan skema: partisi dibuat dengan
    # pemilik yang sama dengan tabel induknya, jadi peran per-service tetap
    # memilikinya setelah itu.
    dotenv: [".env"]
    cmds:
      - go run ./cmd/partitions -dsn "postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@127.0.0.1:$POSTGRES_PORT/$POSTGRES_DB?sslmode=disable" {{.CLI_ARGS}}

  k6:
    desc: "Run a k6 scenario against the local stack. Usage: task k6 -- read (or write, mixed)"
    # k6 berjalan sebagai container di jaringan compose, bukan dipasang di
    # host: satu versi yang sama untuk semua orang, dan ia memanggil gateway
    # lewat nama service - jalur yang sama dengan unit lain.
    requires:
      vars: [CLI_ARGS]
    cmds:
      - wsl -d {{.WSL_DISTRO}} -- bash -lc "cd {{.PROJECT_WSL}} && docker run --rm --network selaras-core_default -v {{.PROJECT_WSL}}/test/k6:/k6:ro -e BASE_URL=http://edge-gateway:8080 grafana/k6:1.8.1 run /k6/scenarios/{{.CLI_ARGS}}.js"

  topics:
    desc: Create the platform's Kafka topics, then read them back from the broker
    cmds:
      - go run ./cmd/topics -brokers 127.0.0.1:19092

  migrate:
    desc: 'Apply migrations for one service. Usage: task migrate -- identity'
    requires:
      vars: [CLI_ARGS]
    cmds:
      - go run ./cmd/migrate -service {{.CLI_ARGS}} -direction up

  migrate:down:
    desc: 'Roll every migration back for one service. Usage: task migrate:down -- identity'
    requires:
      vars: [CLI_ARGS]
    cmds:
      - go run ./cmd/migrate -service {{.CLI_ARGS}} -direction down
