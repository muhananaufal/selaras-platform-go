version: v2

modules:
  - path: api/proto

lint:
  use:
    - STANDARD
  except:
    # The package name already carries the version (identity.v1), so a
    # suffix on the service name is repetition without value.
    - SERVICE_SUFFIX
  enum_zero_value_suffix: _UNSPECIFIED
  rpc_allow_same_request_response: false
  rpc_allow_google_protobuf_empty_requests: false
  rpc_allow_google_protobuf_empty_responses: false

breaking:
  use:
    - FILE
  # The contracts were locked in B1. A breaking change has to go through a
  # new package version (identity.v2), not by changing v1 in place.
