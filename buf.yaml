version: v2

modules:
  - path: api/proto

lint:
  use:
    - STANDARD
  except:
    # Nama paket sudah membawa versi (identity.v1), sehingga sufiks pada
    # nama service menjadi pengulangan tanpa nilai.
    - SERVICE_SUFFIX
  enum_zero_value_suffix: _UNSPECIFIED
  rpc_allow_same_request_response: false
  rpc_allow_google_protobuf_empty_requests: false
  rpc_allow_google_protobuf_empty_responses: false

breaking:
  use:
    - FILE
  # Kontrak dikunci di B1. Breaking change wajib lewat versi paket baru
  # (identity.v2), bukan dengan mengubah v1 di tempat.
