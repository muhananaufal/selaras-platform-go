tags:
  - name: Assessment
    description: Assessment serves the caller's cardiovascular risk assessments.
  - name: Auth
    description: |-
      Auth covers sign-up, sign-in, sign-out, password reset, the social
       sign-in hand-off, and account deletion.

       Register, Login, RequestPasswordReset, ConfirmPasswordReset, and
       ExchangeSocialSession are the ONLY public procedures of the whole contract.
       Everything else requires a bearer token, and that list is enforced by an
       allowlist in the gateway, not by marking each protected procedure: a new
       procedure is protected unless someone deliberately makes it public.
  - name: Chat
    description: Chat serves the caller's conversations with the general assistant.
  - name: Clinic
    description: |-
      Clinic: clinics, their members, and a patient's consent to be read by a
       clinician (ADR-030). The acting user is always the caller of the token;
       no request names who is acting.
  - name: Coaching
    description: Coaching serves the caller's coaching programs and their threads.
  - name: Dashboard
    description: Dashboard serves the whole home page in one call.
  - name: Nutrition
    description: Nutrition serves the caller's culinary preferences and daily meal guides.
  - name: Profile
    description: Profile serves the caller's own demographic profile.
