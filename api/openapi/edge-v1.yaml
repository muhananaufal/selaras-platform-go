openapi: 3.1.0
info:
  title: Selaras Edge API
  version: "1.0.0"
  description: |
    The public edge.v1 contract, served over the Connect protocol.

    Every operation is `POST /<package>.<Service>/<Method>` with a JSON body
    and the header `Connect-Protocol-Version: 1`. Read operations also accept
    `GET` with the message in the query string. JSON field names are
    lowerCamelCase, enums are their proto names, and empty fields are omitted.

    Errors are `{code, message, details}`. Field violations arrive as a
    `google.rpc.BadRequest` detail; rate limiting as `resource_exhausted`
    (HTTP 429) with a `google.rpc.RetryInfo` detail and `Retry-After`.

    Every procedure requires a bearer token except Auth/Register,
    Auth/Login, Auth/RequestPasswordReset, Auth/ConfirmPasswordReset, and
    Auth/ExchangeSocialSession.
servers:
  - url: http://127.0.0.1:18080
    description: Local compose stack
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    assessment.v1.AssessmentInput:
      type: object
      properties:
        hasDiabetes:
          type: boolean
          title: has_diabetes
        smokingStatus:
          title: smoking_status
          $ref: '#/components/schemas/assessment.v1.SmokingStatus'
        systolicBloodPressure:
          title: systolic_blood_pressure
          $ref: '#/components/schemas/assessment.v1.ClinicalParameter'
        sbpProxy:
          title: sbp_proxy
          $ref: '#/components/schemas/assessment.v1.SbpProxy'
        totalCholesterol:
          title: total_cholesterol
          $ref: '#/components/schemas/assessment.v1.ClinicalParameter'
        totalCholesterolProxy:
          title: total_cholesterol_proxy
          $ref: '#/components/schemas/assessment.v1.TotalCholesterolProxy'
        hdlCholesterol:
          title: hdl_cholesterol
          $ref: '#/components/schemas/assessment.v1.ClinicalParameter'
        hdlProxy:
          title: hdl_proxy
          $ref: '#/components/schemas/assessment.v1.HdlProxy'
        ageAtDiabetesDiagnosis:
          type:
            - integer
            - "null"
          title: age_at_diabetes_diagnosis
          format: int32
          description: The next four fields are read only when has_diabetes is true.
        hba1c:
          title: hba1c
          $ref: '#/components/schemas/assessment.v1.ClinicalParameter'
        hba1cProxy:
          title: hba1c_proxy
          $ref: '#/components/schemas/assessment.v1.Hba1cProxy'
        serumCreatinine:
          title: serum_creatinine
          $ref: '#/components/schemas/assessment.v1.ClinicalParameter'
        serumCreatinineProxy:
          title: serum_creatinine_proxy
          $ref: '#/components/schemas/assessment.v1.SerumCreatinineProxy'
        exercise:
          title: exercise
          description: |-
            The exercise habit is used by two estimators at once, and here there is
             only ONE source for it. The legacy system read it from two different
             places with two different values, so the HbA1c deduction never applied
             (finding B12).
          $ref: '#/components/schemas/assessment.v1.ExerciseHabit'
      title: AssessmentInput
      additionalProperties: false
    assessment.v1.BodyComposition:
      type: string
      title: BodyComposition
      enum:
        - BODY_COMPOSITION_UNSPECIFIED
        - BODY_COMPOSITION_LEAN
        - BODY_COMPOSITION_AVERAGE
        - BODY_COMPOSITION_ATHLETIC
        - BODY_COMPOSITION_VERY_MUSCULAR
    assessment.v1.BodyShape:
      type: string
      title: BodyShape
      enum:
        - BODY_SHAPE_UNSPECIFIED
        - BODY_SHAPE_SLIM_OR_IDEAL
        - BODY_SHAPE_CENTRAL_OBESITY
    assessment.v1.ClinicalParameter:
      type: object
      properties:
        mode:
          title: mode
          $ref: '#/components/schemas/assessment.v1.InputMode'
        measuredValue:
          type:
            - number
            - "null"
          title: measured_value
          format: double
      title: ClinicalParameter
      additionalProperties: false
      description: |-
        Every clinical parameter has two modes. With MANUAL, the measured value
         is used; with PROXY, the value is estimated from the questionnaire.
    assessment.v1.CookingOil:
      type: string
      title: CookingOil
      enum:
        - COOKING_OIL_UNSPECIFIED
        - COOKING_OIL_PALM_OR_BULK
        - COOKING_OIL_OTHER
    assessment.v1.DiabetesControl:
      type: string
      title: DiabetesControl
      enum:
        - DIABETES_CONTROL_UNSPECIFIED
        - DIABETES_CONTROL_CONTROLLED
        - DIABETES_CONTROL_POORLY_CONTROLLED
    assessment.v1.ExerciseHabit:
      type: string
      title: ExerciseHabit
      enum:
        - EXERCISE_HABIT_UNSPECIFIED
        - EXERCISE_HABIT_RARELY
        - EXERCISE_HABIT_ROUTINE_INTENSE
    assessment.v1.ExerciseType:
      type: string
      title: ExerciseType
      enum:
        - EXERCISE_TYPE_UNSPECIFIED
        - EXERCISE_TYPE_ALMOST_NEVER
        - EXERCISE_TYPE_LIGHT_ROUTINE
        - EXERCISE_TYPE_WEIGHTS_OR_HIIT
    assessment.v1.FishIntake:
      type: string
      title: FishIntake
      enum:
        - FISH_INTAKE_UNSPECIFIED
        - FISH_INTAKE_RARELY
        - FISH_INTAKE_TWICE_WEEKLY_OR_MORE
    assessment.v1.FoamyUrine:
      type: string
      title: FoamyUrine
      enum:
        - FOAMY_URINE_UNSPECIFIED
        - FOAMY_URINE_NEVER
        - FOAMY_URINE_OFTEN
    assessment.v1.GlucoseMonitoring:
      type: string
      title: GlucoseMonitoring
      enum:
        - GLUCOSE_MONITORING_UNSPECIFIED
        - GLUCOSE_MONITORING_NEVER
        - GLUCOSE_MONITORING_USUALLY_ON_TARGET
        - GLUCOSE_MONITORING_USUALLY_ABOVE_TARGET
    assessment.v1.Hba1cProxy:
      type: object
      properties:
        glucoseMonitoring:
          title: glucose_monitoring
          $ref: '#/components/schemas/assessment.v1.GlucoseMonitoring'
        treatmentAdherence:
          title: treatment_adherence
          $ref: '#/components/schemas/assessment.v1.TreatmentAdherence'
      title: Hba1cProxy
      additionalProperties: false
    assessment.v1.HdlProxy:
      type: object
      properties:
        exerciseType:
          title: exercise_type
          $ref: '#/components/schemas/assessment.v1.ExerciseType'
        fishIntake:
          title: fish_intake
          $ref: '#/components/schemas/assessment.v1.FishIntake'
      title: HdlProxy
      additionalProperties: false
    assessment.v1.InputMode:
      type: string
      title: InputMode
      enum:
        - INPUT_MODE_UNSPECIFIED
        - INPUT_MODE_MANUAL
        - INPUT_MODE_PROXY
    assessment.v1.NsaidUse:
      type: string
      title: NsaidUse
      enum:
        - NSAID_USE_UNSPECIFIED
        - NSAID_USE_RARELY
        - NSAID_USE_OFTEN
    assessment.v1.PersonalizationStatus:
      type: string
      title: PersonalizationStatus
      enum:
        - PERSONALIZATION_STATUS_UNSPECIFIED
        - PERSONALIZATION_STATUS_NOT_REQUESTED
        - PERSONALIZATION_STATUS_PENDING
        - PERSONALIZATION_STATUS_COMPLETED
        - PERSONALIZATION_STATUS_FAILED
    assessment.v1.ResolvedClinicalValues:
      type: object
      properties:
        age:
          type: integer
          title: age
          format: int32
        sex:
          type: string
          title: sex
        riskRegion:
          type: string
          title: risk_region
        systolicBloodPressure:
          type: number
          title: systolic_blood_pressure
          format: double
        totalCholesterol:
          type: number
          title: total_cholesterol
          format: double
        hdlCholesterol:
          type: number
          title: hdl_cholesterol
          format: double
        hba1c:
          type:
            - number
            - "null"
          title: hba1c
          format: double
        serumCreatinine:
          type:
            - number
            - "null"
          title: serum_creatinine
          format: double
        egfr:
          type:
            - number
            - "null"
          title: egfr
          format: double
      title: ResolvedClinicalValues
      additionalProperties: false
      description: |-
        The clinical values that actually entered the calculator, whether
         measured or estimated. Stored as they are so an old score can still be
         explained years later.
    assessment.v1.RiskModel:
      type: string
      title: RiskModel
      enum:
        - RISK_MODEL_UNSPECIFIED
        - RISK_MODEL_SCORE2
        - RISK_MODEL_SCORE2_OP
        - RISK_MODEL_SCORE2_DIABETES
    assessment.v1.SaltHabit:
      type: string
      title: SaltHabit
      enum:
        - SALT_HABIT_UNSPECIFIED
        - SALT_HABIT_ADDS_TABLE_SALT
        - SALT_HABIT_INSTANT_FOOD
        - SALT_HABIT_SALTED_SNACKS
        - SALT_HABIT_PROCESSED_MEAT
    assessment.v1.SbpProxy:
      type: object
      properties:
        familyHypertension:
          type: boolean
          title: family_hypertension
        sleepPattern:
          title: sleep_pattern
          $ref: '#/components/schemas/assessment.v1.SleepPattern'
        saltHabits:
          type: array
          items:
            $ref: '#/components/schemas/assessment.v1.SaltHabit'
          title: salt_habits
          description: Multiple choice; the number selected determines the weight.
        stressResponse:
          title: stress_response
          $ref: '#/components/schemas/assessment.v1.StressResponse'
        bodyShape:
          title: body_shape
          $ref: '#/components/schemas/assessment.v1.BodyShape'
        exercise:
          title: exercise
          $ref: '#/components/schemas/assessment.v1.ExerciseHabit'
      title: SbpProxy
      additionalProperties: false
    assessment.v1.SerumCreatinineProxy:
      type: object
      properties:
        bodyComposition:
          title: body_composition
          $ref: '#/components/schemas/assessment.v1.BodyComposition'
        diabetesControl:
          title: diabetes_control
          $ref: '#/components/schemas/assessment.v1.DiabetesControl'
        retinopathyOrNeuropathy:
          type: boolean
          title: retinopathy_or_neuropathy
        nsaidUse:
          title: nsaid_use
          $ref: '#/components/schemas/assessment.v1.NsaidUse'
        foamyUrine:
          title: foamy_urine
          $ref: '#/components/schemas/assessment.v1.FoamyUrine'
      title: SerumCreatinineProxy
      additionalProperties: false
    assessment.v1.SleepPattern:
      type: string
      title: SleepPattern
      enum:
        - SLEEP_PATTERN_UNSPECIFIED
        - SLEEP_PATTERN_RESTFUL
        - SLEEP_PATTERN_INSOMNIA
    assessment.v1.SmokingStatus:
      type: string
      title: SmokingStatus
      enum:
        - SMOKING_STATUS_UNSPECIFIED
        - SMOKING_STATUS_CURRENT
        - SMOKING_STATUS_NOT_CURRENT
    assessment.v1.StressResponse:
      type: string
      title: StressResponse
      enum:
        - STRESS_RESPONSE_UNSPECIFIED
        - STRESS_RESPONSE_CALM
        - STRESS_RESPONSE_PALPITATIONS_AND_FLUSHING
    assessment.v1.TotalCholesterolProxy:
      type: object
      properties:
        familyHighCholesterolOrHeartAttack:
          type: boolean
          title: family_high_cholesterol_or_heart_attack
        cookingOil:
          title: cooking_oil
          $ref: '#/components/schemas/assessment.v1.CookingOil'
        exerciseType:
          title: exercise_type
          $ref: '#/components/schemas/assessment.v1.ExerciseType'
        xanthoma:
          type: boolean
          title: xanthoma
        fishIntake:
          title: fish_intake
          $ref: '#/components/schemas/assessment.v1.FishIntake'
      title: TotalCholesterolProxy
      additionalProperties: false
    assessment.v1.TreatmentAdherence:
      type: string
      title: TreatmentAdherence
      enum:
        - TREATMENT_ADHERENCE_UNSPECIFIED
        - TREATMENT_ADHERENCE_BOTH_DISCIPLINED
        - TREATMENT_ADHERENCE_MEDICATION_OK_DIET_POOR
        - TREATMENT_ADHERENCE_MEDICATION_POOR_DIET_OK
        - TREATMENT_ADHERENCE_BOTH_POOR
    chat.v1.MessageRole:
      type: string
      title: MessageRole
      enum:
        - MESSAGE_ROLE_UNSPECIFIED
        - MESSAGE_ROLE_USER
        - MESSAGE_ROLE_MODEL
    clinic.v1.AccessRecord:
      type: object
      properties:
        clinicianUserId:
          type: string
          title: clinician_user_id
        resource:
          title: resource
          $ref: '#/components/schemas/clinic.v1.Resource'
        accessedAt:
          title: accessed_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: AccessRecord
      additionalProperties: false
    clinic.v1.ClinicView:
      type: object
      properties:
        id:
          type: string
          title: id
        name:
          type: string
          title: name
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: ClinicView
      additionalProperties: false
    clinic.v1.Consent:
      type: object
      properties:
        clinicId:
          type: string
          title: clinic_id
        clinicianUserId:
          type: string
          title: clinician_user_id
        grantedAt:
          title: granted_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Consent
      additionalProperties: false
    clinic.v1.MemberRole:
      type: string
      title: MemberRole
      enum:
        - MEMBER_ROLE_UNSPECIFIED
        - MEMBER_ROLE_OWNER
        - MEMBER_ROLE_ADMIN
        - MEMBER_ROLE_CLINICIAN
    clinic.v1.Resource:
      type: string
      title: Resource
      enum:
        - RESOURCE_UNSPECIFIED
        - RESOURCE_RISK_ASSESSMENTS
        - RESOURCE_COACHING_PROGRESS
      description: |-
        The patient data a consent opens. Chat is not one of them, and never will
         be: the owner's rule is that chat is not visible to anyone.
    coaching.v1.CurriculumStatus:
      type: string
      title: CurriculumStatus
      enum:
        - CURRICULUM_STATUS_UNSPECIFIED
        - CURRICULUM_STATUS_PENDING
        - CURRICULUM_STATUS_READY
        - CURRICULUM_STATUS_FAILED
    coaching.v1.Difficulty:
      type: string
      title: Difficulty
      enum:
        - DIFFICULTY_UNSPECIFIED
        - DIFFICULTY_GENTLE
        - DIFFICULTY_STANDARD
        - DIFFICULTY_INTENSE
    coaching.v1.GraduationStatus:
      type: string
      title: GraduationStatus
      enum:
        - GRADUATION_STATUS_UNSPECIFIED
        - GRADUATION_STATUS_NOT_REQUESTED
        - GRADUATION_STATUS_PENDING
        - GRADUATION_STATUS_READY
        - GRADUATION_STATUS_FAILED
      description: |-
        The state of the graduation report.

         Four states, not two. A state derived from the presence of the report can
         only tell "there" from "not there", and both hide what the client most
         needs to know: the report is being produced, or its production failed and
         waiting longer will change nothing.
    coaching.v1.MessageRole:
      type: string
      title: MessageRole
      enum:
        - MESSAGE_ROLE_UNSPECIFIED
        - MESSAGE_ROLE_USER
        - MESSAGE_ROLE_MODEL
    coaching.v1.ProgramStatus:
      type: string
      title: ProgramStatus
      enum:
        - PROGRAM_STATUS_UNSPECIFIED
        - PROGRAM_STATUS_ACTIVE
        - PROGRAM_STATUS_PAUSED
        - PROGRAM_STATUS_COMPLETED
        - PROGRAM_STATUS_CANCELLED
    coaching.v1.TaskType:
      type: string
      title: TaskType
      enum:
        - TASK_TYPE_UNSPECIFIED
        - TASK_TYPE_MAIN_MISSION
        - TASK_TYPE_BONUS_CHALLENGE
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      const: 1
      description: The version of the Connect protocol. Always 1.
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: >-
            The fully qualified type of the detail. This gateway sends google.rpc.BadRequest (per-field violations) and google.rpc.RetryInfo (how long to wait after resource_exhausted).
        value:
          type: string
          format: byte
          description: The detail message, serialized as protobuf and base64-encoded.
        debug:
          title: Debug
          description: >-
            The detail decoded as JSON, for convenience. Which schema applies is given by `type`. Generated clients decode `value` instead.
          type: object
          additionalProperties: true
      additionalProperties: true
      description: One error detail of a Connect error.
    dashboard.v1.AssessmentSummary:
      type: object
      properties:
        slug:
          type: string
          title: slug
        assessedOn:
          type: string
          title: assessed_on
        modelUsed:
          type: string
          title: model_used
        riskPercentage:
          type: number
          title: risk_percentage
          format: double
        riskCategory:
          type: string
          title: risk_category
          description: |-
            The risk category that is COMPUTED, not made up by the model.

             The legacy system read it from the LLM report, so the dashboard of a user
             whose personalisation had not arrived showed "N/A" as their health status.
             This value comes from SCORE2, so it exists as soon as the assessment does.
      title: AssessmentSummary
      additionalProperties: false
    dashboard.v1.HealthTrend:
      type: string
      title: HealthTrend
      enum:
        - HEALTH_TREND_UNSPECIFIED
        - HEALTH_TREND_IMPROVING
        - HEALTH_TREND_STABLE
        - HEALTH_TREND_WORSENING
        - HEALTH_TREND_INSUFFICIENT_DATA
    dashboard.v1.ProgramSummary:
      type: object
      properties:
        slug:
          type: string
          title: slug
        title:
          type: string
          title: title
        status:
          type: string
          title: status
        currentDay:
          type: integer
          title: current_day
          format: int32
        totalDays:
          type: integer
          title: total_days
          format: int32
        completionPercentage:
          type: number
          title: completion_percentage
          format: double
      title: ProgramSummary
      additionalProperties: false
    dashboard.v1.RiskTrendPoint:
      type: object
      properties:
        assessedOn:
          type: string
          title: assessed_on
        riskPercentage:
          type: number
          title: risk_percentage
          format: double
      title: RiskTrendPoint
      additionalProperties: false
    edge.v1.AddMemberRequest:
      type: object
      properties:
        clinicId:
          type: string
          title: clinic_id
        memberUserId:
          type: string
          title: member_user_id
        role:
          title: role
          $ref: '#/components/schemas/clinic.v1.MemberRole'
      title: AddMemberRequest
      additionalProperties: false
    edge.v1.AddMemberResponse:
      type: object
      title: AddMemberResponse
      additionalProperties: false
    edge.v1.ChatMessage:
      type: object
      properties:
        role:
          title: role
          $ref: '#/components/schemas/chat.v1.MessageRole'
        content:
          title: content
          description: Absent when the stored content is not valid JSON.
          $ref: '#/components/schemas/google.protobuf.Value'
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: ChatMessage
      additionalProperties: false
    edge.v1.CoachingMessage:
      type: object
      properties:
        role:
          title: role
          $ref: '#/components/schemas/coaching.v1.MessageRole'
        content:
          title: content
          description: |-
            The message as stored: the user's text or the model's structured reply.
             Absent when the stored content is not valid JSON.
          $ref: '#/components/schemas/google.protobuf.Value'
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: CoachingMessage
      additionalProperties: false
    edge.v1.CoachingProgram:
      type: object
      properties:
        slug:
          type: string
          title: slug
        title:
          type: string
          title: title
        description:
          type: string
          title: description
        status:
          title: status
          $ref: '#/components/schemas/coaching.v1.ProgramStatus'
        difficulty:
          title: difficulty
          $ref: '#/components/schemas/coaching.v1.Difficulty'
        startDate:
          type: string
          title: start_date
          description: ISO-8601 dates.
        endDate:
          type: string
          title: end_date
        curriculumStatus:
          title: curriculum_status
          $ref: '#/components/schemas/coaching.v1.CurriculumStatus'
        weeks:
          type: array
          items:
            $ref: '#/components/schemas/edge.v1.CoachingWeek'
          title: weeks
        threads:
          type: array
          items:
            $ref: '#/components/schemas/edge.v1.CoachingThread'
          title: threads
        sourceAssessment:
          title: source_assessment
          $ref: '#/components/schemas/edge.v1.SourceAssessment'
        graduationReport:
          title: graduation_report
          description: Absent until the graduation report is ready.
          $ref: '#/components/schemas/google.protobuf.Value'
      title: CoachingProgram
      additionalProperties: false
    edge.v1.CoachingTask:
      type: object
      properties:
        id:
          type: string
          title: id
          description: Tasks are addressed directly by this id.
        taskDate:
          type: string
          title: task_date
          description: ISO-8601 date.
        taskType:
          title: task_type
          $ref: '#/components/schemas/coaching.v1.TaskType'
        title:
          type: string
          title: title
        description:
          type: string
          title: description
        completed:
          type: boolean
          title: completed
      title: CoachingTask
      additionalProperties: false
    edge.v1.CoachingThread:
      type: object
      properties:
        slug:
          type: string
          title: slug
        title:
          type: string
          title: title
      title: CoachingThread
      additionalProperties: false
    edge.v1.CoachingWeek:
      type: object
      properties:
        weekNumber:
          type: integer
          title: week_number
          format: int32
        title:
          type: string
          title: title
        description:
          type: string
          title: description
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/edge.v1.CoachingTask'
          title: tasks
      title: CoachingWeek
      additionalProperties: false
    edge.v1.ConfirmPasswordResetRequest:
      type: object
      properties:
        token:
          type: string
          title: token
        password:
          type: string
          title: password
        passwordConfirmation:
          type: string
          title: password_confirmation
      title: ConfirmPasswordResetRequest
      additionalProperties: false
    edge.v1.ConfirmPasswordResetResponse:
      type: object
      title: ConfirmPasswordResetResponse
      additionalProperties: false
    edge.v1.Conversation:
      type: object
      properties:
        slug:
          type: string
          title: slug
        title:
          type: string
          title: title
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updatedAt:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Conversation
      additionalProperties: false
    edge.v1.CreateClinicRequest:
      type: object
      properties:
        name:
          type: string
          title: name
      title: CreateClinicRequest
      additionalProperties: false
    edge.v1.CreateClinicResponse:
      type: object
      properties:
        clinic:
          title: clinic
          $ref: '#/components/schemas/clinic.v1.ClinicView'
      title: CreateClinicResponse
      additionalProperties: false
    edge.v1.CreateConversationRequest:
      type: object
      properties:
