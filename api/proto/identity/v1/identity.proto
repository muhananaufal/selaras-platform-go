syntax = "proto3";

package identity.v1;

import "common/v1/common.proto";

// Autentikasi dan kredensial. Data demografis tinggal di profile.v1:
// keduanya menjawab pertanyaan yang berbeda, dan user_profiles adalah hub
// yang di-FK seluruh domain sementara users hampir tidak dipakai siapa pun
// kecuali gateway (ADR-002).
service Identity {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // Dua langkah, karena sistem lama tidak punya langkah pertama sama
  // sekali: endpoint resetnya publik dan langsung mengganti kata sandi
  // siapa pun yang emailnya diketahui (temuan S1).
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  rpc ConfirmPasswordReset(ConfirmPasswordResetRequest) returns (ConfirmPasswordResetResponse);

  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
  rpc ExchangeSocialToken(ExchangeSocialTokenRequest) returns (ExchangeSocialTokenResponse);

  // Dipanggil gateway HANYA saat cache pencabutan tidak tahu, bukan di
  // setiap request. Gateway memverifikasi tanda tangan token sendiri
  // dengan kunci publik (ADR-020); yang tidak bisa ia ketahui sendiri
  // hanyalah generasi token yang sedang berlaku.
  //
  // Menggantikan VerifyToken, yang menempatkan identity-svc di jalur
  // terpanas - persis panggilan jaringan wajib yang dihapus ADR-007.
  rpc GetTokenGeneration(GetTokenGenerationRequest) returns (GetTokenGenerationResponse);
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_USER = 1;
  ROLE_ADMIN = 2;
}

message User {
  string id = 1;
  string email = 2;
  Role role = 3;
  bool email_verified = 4;
  common.v1.Timestamps timestamps = 5;
}

// Token akses berumur pendek beserta klaimnya. Klaim membawa
// user_profile_id supaya tidak ada lookup per request (ADR-007); nilainya
// diambil sekali saat penerbitan.
message TokenPair {
  string access_token = 1;
  int64 expires_in_seconds = 2;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
}

message RegisterResponse {
  User user = 1;
  TokenPair token = 2;
  common.v1.Identity identity = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

// Login mencabut seluruh token lama milik pengguna: satu sesi per
// pengguna, sesuai perilaku sistem lama yang wajib dipertahankan (D1).
message LoginResponse {
  User user = 1;
  TokenPair token = 2;
  common.v1.Identity identity = 3;
}

message LogoutRequest {
  string access_token = 1;
}

message LogoutResponse {}

message RequestPasswordResetRequest {
  string email = 1;
}

// Sengaja tidak memberi tahu apakah emailnya terdaftar. Membedakan
// keduanya mengubah endpoint ini menjadi alat enumerasi akun.
message RequestPasswordResetResponse {}

message ConfirmPasswordResetRequest {
  string token = 1;
  string new_password = 2;
}

message ConfirmPasswordResetResponse {}

// Kata sandi wajib diverifikasi sebelum penghapusan dimulai. Sistem lama
// memintanya di validasi lalu tidak pernah memeriksanya (temuan S2).
message DeleteAccountRequest {
  string user_id = 1;
  string password = 2;
}

message DeleteAccountResponse {
  string saga_id = 1;
}

// id_token adalah ID token OIDC dari penyedia, bukan access token-nya.
// Ia ditandatangani penyedia, sehingga klaim email_verified sampai ke
// identity-svc dengan tanda tangannya utuh - identity-svc tidak perlu
// mempercayai pemanggilnya soal alamat siapa yang sudah terbukti.
message ExchangeSocialTokenRequest {
  string provider = 1;
  string id_token = 2;
}

// Menautkan akun, tidak pernah menimpanya. Sistem lama memakai
// updateOrCreate berdasarkan email, sehingga login sosial menimpa kata
// sandi akun yang sudah ada (temuan S5).
message ExchangeSocialTokenResponse {
  User user = 1;
  TokenPair token = 2;
  common.v1.Identity identity = 3;
  bool account_was_linked = 4;
}

message GetTokenGenerationRequest {
  string user_id = 1;
}

message GetTokenGenerationResponse {
  int64 generation = 1;
}
