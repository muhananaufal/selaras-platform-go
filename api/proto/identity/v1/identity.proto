syntax = "proto3";

package identity.v1;

import "common/v1/common.proto";

// Authentication and credentials. Demographic data lives in profile.v1: the
// two answer different questions, and user_profiles is the hub every domain
// FKs to while users is hardly used by anyone except the gateway (ADR-002).
service Identity {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // Two steps, because the legacy system had no first step at all: its
  // reset endpoint was public and directly changed the password of anyone
  // whose email was known (finding S1).
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  rpc ConfirmPasswordReset(ConfirmPasswordResetRequest) returns (ConfirmPasswordResetResponse);

  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
  rpc ExchangeSocialToken(ExchangeSocialTokenRequest) returns (ExchangeSocialTokenResponse);

  // Called by the gateway ONLY when the revocation cache does not know, not
  // on every request. The gateway verifies the token signature itself with
  // the public key (ADR-020); the only thing it cannot know on its own is
  // the token generation currently in effect.
  //
  // Replaces VerifyToken, which put identity-svc on the hottest path -
  // exactly the mandatory network call ADR-007 removed.
  rpc GetTokenGeneration(GetTokenGenerationRequest) returns (GetTokenGenerationResponse);
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_USER = 1;
  ROLE_ADMIN = 2;
}

message User {
  string id = 1;
  string email = 2;
  Role role = 3;
  bool email_verified = 4;
  common.v1.Timestamps timestamps = 5;
}

// A short-lived access token together with its claims. The claims carry
// user_profile_id so there is no per-request lookup (ADR-007); the value is
// fetched once at issuance.
message TokenPair {
  string access_token = 1;
  int64 expires_in_seconds = 2;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
}

message RegisterResponse {
  User user = 1;
  TokenPair token = 2;
  common.v1.Identity identity = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

// Login revokes all of the user's old tokens: one session per user,
// matching the legacy behaviour that had to be kept (D1).
message LoginResponse {
  User user = 1;
  TokenPair token = 2;
  common.v1.Identity identity = 3;
}

message LogoutRequest {
  string access_token = 1;
}

message LogoutResponse {}

message RequestPasswordResetRequest {
  string email = 1;
}

// Deliberately does not say whether the email is registered. Telling the
// two apart turns this endpoint into an account enumeration tool.
message RequestPasswordResetResponse {}

message ConfirmPasswordResetRequest {
  string token = 1;
  string new_password = 2;
}

message ConfirmPasswordResetResponse {}

// The password has to be verified before deletion starts. The legacy system
// asked for it in validation and then never checked it (finding S2).
message DeleteAccountRequest {
  string user_id = 1;
  string password = 2;
}

message DeleteAccountResponse {
  string saga_id = 1;
}

// id_token is the OIDC ID token from the provider, not its access token. It
// is signed by the provider, so the email_verified claim reaches
// identity-svc with its signature intact - identity-svc need not trust its
// caller about whose address has been proven.
message ExchangeSocialTokenRequest {
  string provider = 1;
  string id_token = 2;
}

// Links accounts, never overwrites them. The legacy system used
// updateOrCreate by email, so a social login overwrote the password of an
// existing account (finding S5).
message ExchangeSocialTokenResponse {
  User user = 1;
  TokenPair token = 2;
  common.v1.Identity identity = 3;
  bool account_was_linked = 4;
}

message GetTokenGenerationRequest {
  string user_id = 1;
}

message GetTokenGenerationResponse {
  int64 generation = 1;
}
