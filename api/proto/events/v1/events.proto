syntax = "proto3";

package events.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

// The same envelope for every event crossing the broker.
//
// Delivery is at-least-once, so every consumer MUST be idempotent
// (ADR-004). event_id and idempotency_key exist so consumers can recognise
// a repeat without guessing from the payload content.
message Envelope {
  string event_id = 1;
  google.protobuf.Timestamp occurred_at = 2;

  // The identity travels in every event so consumers need not call identity
  // or profile to interpret it (ADR-007).
  common.v1.Identity identity = 3;

  // Set when this event was born from a request carrying an idempotency
  // key. Empty for system-triggered events.
  optional common.v1.IdempotencyKey idempotency_key = 4;

  // For linking the event to the trace that gave birth to it. Without it,
  // the trail of a request breaks as soon as it enters the broker.
  optional string trace_id = 5;

  // The payload schema version. Consumers refuse a version they do not know
  // instead of interpreting it arbitrarily.
  int32 schema_version = 6;

  // The W3C trace context (`traceparent`) of the transaction that wrote this
  // event.
  //
  // trace_id alone is not enough to link up: the consumer needs the parent
  // span and the sampling flag so its span becomes a child of the request
  // that gave birth to it, not a new trace that happens to share an id.
  // Filled in by the outbox writer; empty means the event was born without
  // an active trace.
  optional string trace_parent = 7;

  oneof payload {
    ProfileUpdated profile_updated = 10;
    AssessmentCompleted assessment_completed = 11;
    PersonalizationRequested personalization_requested = 12;
    PersonalizationCompleted personalization_completed = 13;
    CoachingProgramUpdated coaching_program_updated = 14;
    CurriculumRequested curriculum_requested = 15;
    CurriculumCompleted curriculum_completed = 16;
    ChatReplyRequested chat_reply_requested = 17;
    ChatReplyCompleted chat_reply_completed = 18;
    MealGuideRequested meal_guide_requested = 19;
    MealGuideCompleted meal_guide_completed = 20;
    UserDeletionRequested user_deletion_requested = 21;
    UserDeletionConfirmed user_deletion_confirmed = 22;
    LlmJobFailed llm_job_failed = 23;
  }
}

// Announced whenever the demographics change. Assessment keeps a copy so it
// need not call profile on every computation.
message ProfileUpdated {
  string user_profile_id = 1;
  optional string date_of_birth = 2;
  string sex = 3;
  optional string country_of_residence = 4;
  string language = 5;

  // user_id is REQUIRED, and the reason is the same as ADR-022 and ADR-023.
  //
  // Its consumer - the profile cache in assessment-svc - looks up by user_id,
  // because that is the identity already verified on every request. An event
  // carrying only user_profile_id would produce a cache that cannot be looked
  // up: assessment would have to call profile-svc first to translate user_id
  // into user_profile_id, and that call is precisely what this cache is meant
  // to remove.
  //
  // Added during F2-16, before anything was built on top of it.
  string user_id = 6;
}

message AssessmentCompleted {
  string assessment_id = 1;
  string slug = 2;
  double risk_percentage = 3;
  string model_used = 4;

  // user_id is REQUIRED, for the same reason as CoachingProgramUpdated below:
  // the dashboard read-model keeps one row per user and has to know whose row
  // to update.
  string user_id = 5;

  // The computed risk category, not one made up by the model.
  //
  // The dashboard shows it as the "current status". In the legacy system it was
  // read from the LLM report (`result_details.riskSummary.riskCategory`), so
  // the dashboard of a user whose personalisation had not arrived - or had
  // failed - showed "N/A". This value comes from the already computed SCORE2,
  // so it is always there as soon as the assessment is.
  string risk_category = 6;
}

message PersonalizationRequested {
  string assessment_id = 1;
  string slug = 2;
  string job_id = 3;
}

message PersonalizationCompleted {
  string assessment_id = 1;
  string job_id = 2;
  string report_json = 3;
  string prompt_version = 4;
}

message CoachingProgramUpdated {
  string program_id = 1;
  string slug = 2;
  string status = 3;

  // OPTIONAL, and that is not an oversight.
  //
  // This event is published from two places. One - when a program is
  // created, resumed, or paused - does not count tasks at all; the other is
  // published precisely because a task was marked done. Without explicit
  // presence, "not counted" and "zero percent" look the SAME on the wire,
  // and a dashboard whose program was paused would jump back to zero percent
  // from a number that was already right.
  //
  // This is another form of B16, and the lesson is the same: a proto3 zero
  // value is not "absent".
  optional double completion_percentage = 4;

  // user_id is REQUIRED, and the reason is the same as ADR-022, ADR-023, and
  // ADR-024.
  //
  // Its consumer - the dashboard read-model - keeps ONE ROW PER USER, so it has
  // to know whose row to update. An event carrying only program_id would force
  // the dashboard to call coaching-svc to translate it, and that call is
  // precisely what the read-model is meant to remove.
  string user_id = 5;

  // The program's title and progress, for display without calling anyone.
  //
  // The dashboard shows "day N of M" exactly as the legacy system did. If
  // those numbers did not come along, the dashboard would have to compute
  // them itself from the start date - and the same computation in two places
  // will drift.
  string title = 6;
  int32 current_day = 7;
  int32 total_days = 8;
}

message CurriculumRequested {
  string program_id = 1;
  string job_id = 2;
  string difficulty = 3;
  string source_assessment_slug = 4;
}

message CurriculumCompleted {
  string program_id = 1;
  string job_id = 2;
  string curriculum_json = 3;
  string prompt_version = 4;
}

message ChatReplyRequested {
  string conversation_id = 1;
  string message_id = 2;
  string job_id = 3;
  // Also used for coaching threads; empty for a general conversation.
  optional string coaching_thread_id = 4;
}

message ChatReplyCompleted {
  string job_id = 1;
  string reply_json = 2;
  string prompt_version = 3;
}

message MealGuideRequested {
  string guide_id = 1;
  string job_id = 2;

  // The full context assembled by nutrition-svc, as JSON.
  //
  // It COMES ALONG inside the event, rather than being left as a blank filled
  // in later like the other LLM requests (see F3-10). The reason is not
  // uniformity: this context holds the user's ALLERGY NOTE, and a prompt that
  // leaves without it would ask the model to suggest food to someone allergic
  // to it. Even an honest "not yet in the event" marker does not help - what
  // comes out is still food advice that looks valid.
  //
  // Its content is exactly what is stored in the generation_context column, so
  // a suggestion can always be explained again from its own row.
  string context_json = 3;
}

message MealGuideCompleted {
  string guide_id = 1;
  string job_id = 2;
  string guide_json = 3;
  string prompt_version = 4;
}

// The start of the account deletion saga. Every domain unit consumes it,
// deletes its data, then replies with a confirmation (ADR-011).
message UserDeletionRequested {
  string saga_id = 1;
  string user_id = 2;
  string user_profile_id = 3;
}

message UserDeletionConfirmed {
  string saga_id = 1;
  // The name of the confirming unit, so the saga knows who has not yet.
  string service = 2;
  bool succeeded = 3;
  optional string failure_reason = 4;
}

// Published after the last attempt failed. The original message goes to the
// dead-letter queue; this event is what makes the failure visible to the
// domain.
message LlmJobFailed {
  string job_id = 1;
  string kind = 2;
  string reason = 3;
  int32 attempts = 4;
}
