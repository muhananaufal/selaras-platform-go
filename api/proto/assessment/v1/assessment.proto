syntax = "proto3";

package assessment.v1;

import "common/v1/common.proto";

// Cardiovascular risk assessment based on SCORE2, SCORE2-OP, and
// SCORE2-Diabetes.
//
// Every proxy answer is modelled as a semantically valued enum, not an
// Indonesian string as in the legacy system. Those strings are a
// presentation detail; putting them into the contract means one typo
// silently yields a different score. The mapping from enum to legacy value
// lives in the adapter and is tested against golden vectors.
service Assessment {
  // Returns the numeric score immediately. The narrative personalisation is
  // done separately because it calls the LLM.
  rpc StartAssessment(StartAssessmentRequest) returns (StartAssessmentResponse);

  // Answers immediately: the work is handed to the outbox, not done inside
  // the request as in the legacy system.
  rpc RequestPersonalization(RequestPersonalizationRequest) returns (RequestPersonalizationResponse);

  rpc GetAssessment(GetAssessmentRequest) returns (GetAssessmentResponse);
  rpc ListAssessments(ListAssessmentsRequest) returns (ListAssessmentsResponse);

  // Maps the country of residence to its SCORE2 calibration region.
  //
  // It lives here, not in profile-svc, because risk_region is a CLINICAL
  // concept: it is part of the model calibration, not demographic data
  // (ADR-002 rule 3). profile-svc stores the country; the one that knows
  // what it means for risk is this service.
  rpc ResolveRiskRegion(ResolveRiskRegionRequest) returns (ResolveRiskRegionResponse);
}

enum InputMode {
  INPUT_MODE_UNSPECIFIED = 0;
  INPUT_MODE_MANUAL = 1;
  INPUT_MODE_PROXY = 2;
}

enum SmokingStatus {
  SMOKING_STATUS_UNSPECIFIED = 0;
  SMOKING_STATUS_CURRENT = 1;
  SMOKING_STATUS_NOT_CURRENT = 2;
}

enum ExerciseHabit {
  EXERCISE_HABIT_UNSPECIFIED = 0;
  EXERCISE_HABIT_RARELY = 1;
  EXERCISE_HABIT_ROUTINE_INTENSE = 2;
}

enum ExerciseType {
  EXERCISE_TYPE_UNSPECIFIED = 0;
  EXERCISE_TYPE_ALMOST_NEVER = 1;
  EXERCISE_TYPE_LIGHT_ROUTINE = 2;
  EXERCISE_TYPE_WEIGHTS_OR_HIIT = 3;
}

enum FishIntake {
  FISH_INTAKE_UNSPECIFIED = 0;
  FISH_INTAKE_RARELY = 1;
  FISH_INTAKE_TWICE_WEEKLY_OR_MORE = 2;
}

enum SleepPattern {
  SLEEP_PATTERN_UNSPECIFIED = 0;
  SLEEP_PATTERN_RESTFUL = 1;
  SLEEP_PATTERN_INSOMNIA = 2;
}

enum StressResponse {
  STRESS_RESPONSE_UNSPECIFIED = 0;
  STRESS_RESPONSE_CALM = 1;
  STRESS_RESPONSE_PALPITATIONS_AND_FLUSHING = 2;
}

enum BodyShape {
  BODY_SHAPE_UNSPECIFIED = 0;
  BODY_SHAPE_SLIM_OR_IDEAL = 1;
  BODY_SHAPE_CENTRAL_OBESITY = 2;
}

enum SaltHabit {
  SALT_HABIT_UNSPECIFIED = 0;
  SALT_HABIT_ADDS_TABLE_SALT = 1;
  SALT_HABIT_INSTANT_FOOD = 2;
  SALT_HABIT_SALTED_SNACKS = 3;
  SALT_HABIT_PROCESSED_MEAT = 4;
}

message SbpProxy {
  bool family_hypertension = 1;
  SleepPattern sleep_pattern = 2;
  // Multiple choice; the number selected determines the weight.
  repeated SaltHabit salt_habits = 3;
  StressResponse stress_response = 4;
  BodyShape body_shape = 5;
  ExerciseHabit exercise = 6;
}

enum CookingOil {
  COOKING_OIL_UNSPECIFIED = 0;
  COOKING_OIL_PALM_OR_BULK = 1;
  COOKING_OIL_OTHER = 2;
}

message TotalCholesterolProxy {
  bool family_high_cholesterol_or_heart_attack = 1;
  CookingOil cooking_oil = 2;
  ExerciseType exercise_type = 3;
  bool xanthoma = 4;
  FishIntake fish_intake = 5;
}

message HdlProxy {
  ExerciseType exercise_type = 1;
  FishIntake fish_intake = 2;
}

enum BodyComposition {
  BODY_COMPOSITION_UNSPECIFIED = 0;
  BODY_COMPOSITION_LEAN = 1;
  BODY_COMPOSITION_AVERAGE = 2;
  BODY_COMPOSITION_ATHLETIC = 3;
  BODY_COMPOSITION_VERY_MUSCULAR = 4;
}

enum DiabetesControl {
  DIABETES_CONTROL_UNSPECIFIED = 0;
  DIABETES_CONTROL_CONTROLLED = 1;
  DIABETES_CONTROL_POORLY_CONTROLLED = 2;
}

enum NsaidUse {
  NSAID_USE_UNSPECIFIED = 0;
  NSAID_USE_RARELY = 1;
  NSAID_USE_OFTEN = 2;
}

enum FoamyUrine {
  FOAMY_URINE_UNSPECIFIED = 0;
  FOAMY_URINE_NEVER = 1;
  FOAMY_URINE_OFTEN = 2;
}

message SerumCreatinineProxy {
  BodyComposition body_composition = 1;
  DiabetesControl diabetes_control = 2;
  bool retinopathy_or_neuropathy = 3;
  NsaidUse nsaid_use = 4;
  FoamyUrine foamy_urine = 5;
}

enum GlucoseMonitoring {
  GLUCOSE_MONITORING_UNSPECIFIED = 0;
  GLUCOSE_MONITORING_NEVER = 1;
  GLUCOSE_MONITORING_USUALLY_ON_TARGET = 2;
  GLUCOSE_MONITORING_USUALLY_ABOVE_TARGET = 3;
}

enum TreatmentAdherence {
  TREATMENT_ADHERENCE_UNSPECIFIED = 0;
  TREATMENT_ADHERENCE_BOTH_DISCIPLINED = 1;
  TREATMENT_ADHERENCE_MEDICATION_OK_DIET_POOR = 2;
  TREATMENT_ADHERENCE_MEDICATION_POOR_DIET_OK = 3;
  TREATMENT_ADHERENCE_BOTH_POOR = 4;
}

message Hba1cProxy {
  GlucoseMonitoring glucose_monitoring = 1;
  TreatmentAdherence treatment_adherence = 2;
}

// Every clinical parameter has two modes. With MANUAL, the measured value
// is used; with PROXY, the value is estimated from the questionnaire.
message ClinicalParameter {
  InputMode mode = 1;
  optional double measured_value = 2;
}

message AssessmentInput {
  bool has_diabetes = 1;
  SmokingStatus smoking_status = 2;

  ClinicalParameter systolic_blood_pressure = 3;
  SbpProxy sbp_proxy = 4;

  ClinicalParameter total_cholesterol = 5;
  TotalCholesterolProxy total_cholesterol_proxy = 6;

  ClinicalParameter hdl_cholesterol = 7;
  HdlProxy hdl_proxy = 8;

  // The next four fields are read only when has_diabetes is true.
  optional int32 age_at_diabetes_diagnosis = 9;
  ClinicalParameter hba1c = 10;
  Hba1cProxy hba1c_proxy = 11;
  ClinicalParameter serum_creatinine = 12;
  SerumCreatinineProxy serum_creatinine_proxy = 13;

  // The exercise habit is used by two estimators at once, and here there is
  // only ONE source for it. The legacy system read it from two different
  // places with two different values, so the HbA1c deduction never applied
  // (finding B12).
  ExerciseHabit exercise = 14;
}

enum RiskModel {
  RISK_MODEL_UNSPECIFIED = 0;
  RISK_MODEL_SCORE2 = 1;
  RISK_MODEL_SCORE2_OP = 2;
  RISK_MODEL_SCORE2_DIABETES = 3;
}

enum PersonalizationStatus {
  PERSONALIZATION_STATUS_UNSPECIFIED = 0;
  PERSONALIZATION_STATUS_NOT_REQUESTED = 1;
  PERSONALIZATION_STATUS_PENDING = 2;
  PERSONALIZATION_STATUS_COMPLETED = 3;
  PERSONALIZATION_STATUS_FAILED = 4;
}

// The clinical values that actually entered the calculator, whether
// measured or estimated. Stored as they are so an old score can still be
// explained years later.
message ResolvedClinicalValues {
  int32 age = 1;
  string sex = 2;
  string risk_region = 3;
  double systolic_blood_pressure = 4;
  double total_cholesterol = 5;
  double hdl_cholesterol = 6;
  optional double hba1c = 7;
  optional double serum_creatinine = 8;
  optional double egfr = 9;
}

message RiskAssessment {
  string id = 1;
  string slug = 2;
  string user_profile_id = 3;
  RiskModel model_used = 4;
  double risk_percentage = 5;
  AssessmentInput input = 6;
  ResolvedClinicalValues resolved_values = 7;
  PersonalizationStatus personalization_status = 8;
  // Laporan naratif hasil LLM. Kosong sampai personalisasi selesai.
  optional string personalized_report_json = 9;
  common.v1.Timestamps timestamps = 10;
}

// Keyed on user_id, not user_profile_id (ADR-023).
//
// This service does NOT use an identity that is merely sent along as the
// basis for authorisation: a user_profile_id trusted at face value would
// let an assessment be written to someone else's profile by anything that
// can reach the internal network. It asks profile-svc itself.
message StartAssessmentRequest {
  string user_id = 1;
  AssessmentInput input = 2;
}

message StartAssessmentResponse {
  RiskAssessment assessment = 1;
}

message RequestPersonalizationRequest {
  string slug = 1;
  string user_id = 2;
  common.v1.IdempotencyKey idempotency_key = 3;
}

// Returned immediately; the result is fetched through GetAssessment.
message RequestPersonalizationResponse {
  string job_id = 1;
  PersonalizationStatus status = 2;
}

message GetAssessmentRequest {
  string slug = 1;
  string user_id = 2;
}

message GetAssessmentResponse {
  RiskAssessment assessment = 1;
}

message ListAssessmentsRequest {
  string user_id = 1;
  common.v1.PageRequest page = 2;
}

message ListAssessmentsResponse {
  repeated RiskAssessment assessments = 1;
  common.v1.PageResponse page = 2;
}

message ResolveRiskRegionRequest {
  string country_of_residence = 1;
}

// A country not in the calibration table yields the "high" region. That is a
// conservative choice kept from the legacy system: lowering it would shift
// the risk number of every user from an unlisted country in a direction
// lower than can be proven.
message ResolveRiskRegionResponse {
  string risk_region = 1;
}
