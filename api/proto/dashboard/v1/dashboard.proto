syntax = "proto3";

package dashboard.v1;

import "common/v1/common.proto";

// The dashboard read-model.
//
// Not a CRUD service: it owns no data of its own, but projects events from
// other domains into one row per profile. In the legacy system this spot
// was held by a repository-of-repositories with a 15-minute cache and four
// manual invalidation listeners - and those four listeners are the symptom
// the read-model removes (ADR-009).
service Dashboard {
  rpc GetDashboard(GetDashboardRequest) returns (GetDashboardResponse);
}

enum HealthTrend {
  HEALTH_TREND_UNSPECIFIED = 0;
  HEALTH_TREND_IMPROVING = 1;
  HEALTH_TREND_STABLE = 2;
  HEALTH_TREND_WORSENING = 3;
  // Used when there is only one analysis so far: no direction can be
  // concluded yet.
  HEALTH_TREND_INSUFFICIENT_DATA = 4;
}

message AssessmentSummary {
  string slug = 1;
  string assessed_on = 2;
  string model_used = 3;
  double risk_percentage = 4;

  // The risk category that is COMPUTED, not made up by the model.
  //
  // The legacy system read it from the LLM report, so the dashboard of a user
  // whose personalisation had not arrived showed "N/A" as their health status.
  // This value comes from SCORE2, so it exists as soon as the assessment does.
  string risk_category = 5;
}

message ProgramSummary {
  string slug = 1;
  string title = 2;
  string status = 3;
  int32 current_day = 4;
  int32 total_days = 5;
  double completion_percentage = 6;
}

message RiskTrendPoint {
  string assessed_on = 1;
  double risk_percentage = 2;
}

message DashboardView {
  string user_id = 1;

  // Empty when the user has never run an analysis. The gateway translates
  // it into a welcome message, as the legacy behaviour did.
  repeated AssessmentSummary assessment_history = 2;
  optional AssessmentSummary latest_assessment = 3;

  // Empty when no program is running. That is a valid state.
  optional ProgramSummary program = 4;

  repeated RiskTrendPoint risk_trend = 5;
  HealthTrend health_trend = 6;
  int32 total_assessments = 7;

  // When this projection was last updated from an event. Exposed as it is
  // because the read-model is eventually consistent; hiding it makes the
  // lag look like a bug.
  common.v1.Timestamps timestamps = 8;
}

message GetDashboardRequest {
  string user_id = 1;
}

message GetDashboardResponse {
  DashboardView dashboard = 1;
}
