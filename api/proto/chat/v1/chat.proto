syntax = "proto3";

package chat.v1;

import "common/v1/common.proto";

// Conversations with the general assistant, separate from discussions
// inside a coaching program. The aggregates are indeed different: a
// conversation stands alone, while a thread always belongs to a program.
service Chat {
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  rpc CreateConversation(CreateConversationRequest) returns (CreateConversationResponse);
  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse);
  rpc UpdateConversationTitle(UpdateConversationTitleRequest) returns (UpdateConversationTitleResponse);
  rpc DeleteConversation(DeleteConversationRequest) returns (DeleteConversationResponse);

  // Answers immediately; the reply arrives through the worker.
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
}

enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_USER = 1;
  MESSAGE_ROLE_MODEL = 2;
}

message ChatMessage {
  string id = 1;
  MessageRole role = 2;
  string content_json = 3;
  common.v1.Timestamps timestamps = 4;
}

message Conversation {
  string id = 1;
  string slug = 2;

  // The owner of a conversation is the USER, not their profile (ADR-024).
  //
  // The legacy system already used user_id in ChatController; the wrong one
  // was CoachingController, which used profile->id. Together the two form
  // finding S9, and this contract initially repeated the wrong side.
  string user_id = 3;
  string title = 4;
  optional string last_message_snippet = 5;
  common.v1.Timestamps timestamps = 6;
}

message ListConversationsRequest {
  string user_id = 1;
  common.v1.PageRequest page = 2;
}

message ListConversationsResponse {
  repeated Conversation conversations = 1;
  common.v1.PageResponse page = 2;
}

message CreateConversationRequest {
  string user_id = 1;
  string message = 2;
  common.v1.IdempotencyKey idempotency_key = 3;
}

message CreateConversationResponse {
  Conversation conversation = 1;
  string job_id = 2;
}

message GetConversationRequest {
  string slug = 1;
  string user_id = 2;
  common.v1.PageRequest page = 3;
}

message GetConversationResponse {
  Conversation conversation = 1;
  repeated ChatMessage messages = 2;
  common.v1.PageResponse page = 3;
}

message UpdateConversationTitleRequest {
  string slug = 1;
  string user_id = 2;
  string title = 3;
}

message UpdateConversationTitleResponse {
  Conversation conversation = 1;
}

message DeleteConversationRequest {
  string slug = 1;
  string user_id = 2;
}

message DeleteConversationResponse {}

message SendMessageRequest {
  string conversation_slug = 1;
  string user_id = 2;
  string message = 3;
  common.v1.IdempotencyKey idempotency_key = 4;
}

message SendMessageResponse {
  ChatMessage message = 1;
  string job_id = 2;
}
