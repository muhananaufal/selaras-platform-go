syntax = "proto3";

package profile.v1;

import "common/v1/common.proto";

// The user's demographic data. Stands on its own because user_profiles is
// the hub every domain FKs to, while users is only the authentication gate
// (ADR-002).
//
// risk_region is deliberately NOT here. It is a clinical concept, not a
// demographic one: the profile stores the country, assessment maps it
// through the SCORE2 calibration table, and the gateway joins the two for
// the REST contract (ADR-002 rule 3).
service Profile {
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);

  // Called by identity-svc after registration. Best-effort: its failure
  // does not fail the registration, because a user without a profile is a
  // state that is already valid (ADR-002 rule 1).
  rpc CreateEmptyProfile(CreateEmptyProfileRequest) returns (CreateEmptyProfileResponse);

  // Used by identity-svc when issuing a token, once per login and not once
  // per request (ADR-007).
  rpc ResolveProfileId(ResolveProfileIdRequest) returns (ResolveProfileIdResponse);
}

enum Sex {
  SEX_UNSPECIFIED = 0;
  SEX_MALE = 1;
  SEX_FEMALE = 2;
}

// Every field that may be empty is marked optional and mapped as it is. The
// legacy system ran Carbon::parse(null) on a date of birth not yet filled
// in, so the age showed as 0 and the date of birth as today (finding B6).
message UserProfile {
  string id = 1;
  string user_id = 2;
  optional string first_name = 3;
  optional string last_name = 4;

  // ISO-8601 date-only format: 1990-05-17. Not a Timestamp, because a date
  // of birth has no time and no time zone.
  optional string date_of_birth = 5;

  Sex sex = 6;
  optional string country_of_residence = 7;
  string language = 8;
  common.v1.Timestamps timestamps = 9;
}

// Keyed on user_id, not user_profile_id.
//
// The caller always has user_id from the token claims, while
// user_profile_id may be empty - and it is precisely the user whose profile
// does not exist yet who needs this endpoint the most. The cost is the
// same: one through the primary key, one through a unique index.
//
// The user_profile_id claim in the token remains useful, but not for this
// service: it is used by the other units that FK user_profiles so they need
// not ask profile-svc first (ADR-007).
message GetProfileRequest {
  string user_id = 1;
}

message GetProfileResponse {
  UserProfile profile = 1;
}

// Creates the profile if it does not exist, like updateOrCreate in the
// legacy system.
//
// Without that, a user whose profile creation failed at registration could
// never have a profile - even though ADR-002 rule 1 says that state may
// happen and has to be recoverable.
message UpdateProfileRequest {
  string user_id = 1;
  optional string first_name = 2;
  optional string last_name = 3;
  optional string date_of_birth = 4;
  Sex sex = 5;
  optional string country_of_residence = 6;
  optional string language = 7;
}

message UpdateProfileResponse {
  UserProfile profile = 1;
}

message CreateEmptyProfileRequest {
  string user_id = 1;
}

message CreateEmptyProfileResponse {
  UserProfile profile = 1;
}

message ResolveProfileIdRequest {
  string user_id = 1;
}

// Empty when the profile does not exist yet. Not an error.
message ResolveProfileIdResponse {
  string user_profile_id = 1;
}
