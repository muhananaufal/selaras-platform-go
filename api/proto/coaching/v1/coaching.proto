syntax = "proto3";

package coaching.v1;

import "common/v1/common.proto";

// Coaching programs: weekly curricula, daily tasks, and discussions.
//
// The heaviest domain in the legacy system, around 1,227 lines. The rules
// that had to cross over are recorded as D2 through D5 and D12.
service Coaching {
  // Cancels the previously active program: one active program per user
  // (D2). The curriculum is generated by the LLM asynchronously, so the
  // program is born in the waiting state.
  rpc StartProgram(StartProgramRequest) returns (StartProgramResponse);

  rpc GetProgram(GetProgramRequest) returns (GetProgramResponse);

  // Only valid from ACTIVE to PAUSED and back. Other statuses are refused
  // (D4).
  rpc ToggleProgramStatus(ToggleProgramStatusRequest) returns (ToggleProgramStatusResponse);

  rpc DeleteProgram(DeleteProgramRequest) returns (DeleteProgramResponse);

  // Idempotent: marking an already completed task does not publish a second
  // event.
  rpc ToggleTaskStatus(ToggleTaskStatusRequest) returns (ToggleTaskStatusResponse);

  rpc GetGraduationReport(GetGraduationReportRequest) returns (GetGraduationReportResponse);

  rpc StartThread(StartThreadRequest) returns (StartThreadResponse);
  rpc GetThread(GetThreadRequest) returns (GetThreadResponse);
  rpc UpdateThreadTitle(UpdateThreadTitleRequest) returns (UpdateThreadTitleResponse);
  rpc DeleteThread(DeleteThreadRequest) returns (DeleteThreadResponse);

  // Answers immediately; the coach's reply arrives through the worker.
  rpc SendThreadMessage(SendThreadMessageRequest) returns (SendThreadMessageResponse);
}

enum ProgramStatus {
  PROGRAM_STATUS_UNSPECIFIED = 0;
  PROGRAM_STATUS_ACTIVE = 1;
  PROGRAM_STATUS_PAUSED = 2;
  PROGRAM_STATUS_COMPLETED = 3;
  PROGRAM_STATUS_CANCELLED = 4;
}

enum Difficulty {
  DIFFICULTY_UNSPECIFIED = 0;
  DIFFICULTY_GENTLE = 1;
  DIFFICULTY_STANDARD = 2;
  DIFFICULTY_INTENSE = 3;
}

enum CurriculumStatus {
  CURRICULUM_STATUS_UNSPECIFIED = 0;
  CURRICULUM_STATUS_PENDING = 1;
  CURRICULUM_STATUS_READY = 2;
  CURRICULUM_STATUS_FAILED = 3;
}

// The state of the graduation report.
//
// Four states, not two. A state derived from the presence of the report can
// only tell "there" from "not there", and both hide what the client most
// needs to know: the report is being produced, or its production failed and
// waiting longer will change nothing.
enum GraduationStatus {
  GRADUATION_STATUS_UNSPECIFIED = 0;
  GRADUATION_STATUS_NOT_REQUESTED = 1;
  GRADUATION_STATUS_PENDING = 2;
  GRADUATION_STATUS_READY = 3;
  GRADUATION_STATUS_FAILED = 4;
}

enum TaskType {
  TASK_TYPE_UNSPECIFIED = 0;
  TASK_TYPE_MAIN_MISSION = 1;
  TASK_TYPE_BONUS_CHALLENGE = 2;
}

enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_USER = 1;
  MESSAGE_ROLE_MODEL = 2;
}

message CoachingTask {
  string id = 1;
  string task_date = 2;
  TaskType task_type = 3;
  string title = 4;
  string description = 5;
  bool completed = 6;
}

message CoachingWeek {
  string id = 1;
  int32 week_number = 2;
  string title = 3;
  string description = 4;
  repeated CoachingTask tasks = 5;
}

message CoachingThread {
  string id = 1;
  string slug = 2;
  string title = 3;
  common.v1.Timestamps timestamps = 4;
}

message CoachingMessage {
  string id = 1;
  MessageRole role = 2;
  string content_json = 3;
  common.v1.Timestamps timestamps = 4;
}

// The reference to the assessment is SOFT. A cross-service foreign key
// cannot be enforced by the database, so uniqueness is guarded here and the
// data is copied from the event (ADR-004).
message SourceAssessment {
  string assessment_id = 1;
  string slug = 2;
  double risk_percentage = 3;
  string model_used = 4;
}

message CoachingProgram {
  string id = 1;
  string slug = 2;

  // The owner of a program is the USER, not their profile (ADR-024).
  //
  // This contract initially used user_profile_id, and that was wrong for two
  // reasons. First, ADR-002 rule 2 allows a profile not yet filled in - a
  // program keyed on the profile id would lock out users who are explicitly
  // allowed to exist. Second, the profile id has to be translated first from
  // the already verified identity, and that translation is a call that adds
  // nothing (ADR-023).
  //
  // The legacy system used profile->id in CoachingController and user_id in
  // ChatController - two identity patterns for one question, and that is
  // half of finding S9.
  string user_id = 3;
  SourceAssessment source_assessment = 4;
  string title = 5;
  string description = 6;
  ProgramStatus status = 7;
  Difficulty difficulty = 8;
  string start_date = 9;
  // The single source of truth for the end of the program. The legacy
  // system computed it from created_at plus 28 days while storing this
  // column without using it (finding B5).
  string end_date = 10;
  CurriculumStatus curriculum_status = 11;
  repeated CoachingWeek weeks = 12;
  repeated CoachingThread threads = 13;
  optional string graduation_report_json = 14;
  common.v1.Timestamps timestamps = 15;
}

message StartProgramRequest {
  string user_id = 1;
  string risk_assessment_slug = 2;
  Difficulty difficulty = 3;
  common.v1.IdempotencyKey idempotency_key = 4;
}

message StartProgramResponse {
  // job_id points at the curriculum generation job.
  //
  // It exists because StartProgram answers BEFORE the curriculum is ready:
  // the program is returned in the pending state, and the client uses this
  // id to ask about its progress.
  string job_id = 2;

  CoachingProgram program = 1;
}

message GetProgramRequest {
  string slug = 1;
  string user_id = 2;
}

message GetProgramResponse {
  CoachingProgram program = 1;
}

message ToggleProgramStatusRequest {
  string slug = 1;
  string user_id = 2;
}

message ToggleProgramStatusResponse {
  CoachingProgram program = 1;
}

message DeleteProgramRequest {
  string slug = 1;
  string user_id = 2;
}

message DeleteProgramResponse {}

message ToggleTaskStatusRequest {
  string task_id = 1;
  string user_id = 2;
}

message ToggleTaskStatusResponse {
  CoachingTask task = 1;
}

message GetGraduationReportRequest {
  string slug = 1;
  string user_id = 2;
}

message GetGraduationReportResponse {
  // Empty while the report does not exist yet. The status below is what
  // tells "not requested" apart from "being produced" and from "failed".
  string report_json = 1;

  GraduationStatus status = 2;
}

message StartThreadRequest {
  string program_slug = 1;
  string user_id = 2;
  string message = 3;
  // When empty, the title is taken from the first 45 characters of the
  // message (D12).
  optional string title = 4;
  common.v1.IdempotencyKey idempotency_key = 5;
}

message StartThreadResponse {
  CoachingThread thread = 1;
  string job_id = 2;
}

message GetThreadRequest {
  string slug = 1;
  string user_id = 2;
  common.v1.PageRequest page = 3;
}

message GetThreadResponse {
  CoachingThread thread = 1;
  repeated CoachingMessage messages = 2;
  common.v1.PageResponse page = 3;
}

message UpdateThreadTitleRequest {
  string slug = 1;
  string user_id = 2;
  string title = 3;
}

message UpdateThreadTitleResponse {
  CoachingThread thread = 1;
}

message DeleteThreadRequest {
  string slug = 1;
  string user_id = 2;
}

message DeleteThreadResponse {}

message SendThreadMessageRequest {
  string thread_slug = 1;
  string user_id = 2;
  string message = 3;
  common.v1.IdempotencyKey idempotency_key = 4;
}

message SendThreadMessageResponse {
  CoachingMessage message = 1;
  string job_id = 2;
}
