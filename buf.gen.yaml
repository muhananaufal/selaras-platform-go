version: v2

# The public contract (api/proto/edge) is excluded here: it is generated by
# buf.gen.edge.yaml as Connect code only (ADR-027).
inputs:
  - directory: api/proto
    exclude_paths:
      - api/proto/edge

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/muhananaufal/selaras-platform-go/gen

plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen
    opt:
      - paths=source_relative
      - require_unimplemented_servers=true
