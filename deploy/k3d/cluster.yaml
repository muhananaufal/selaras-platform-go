# The local k3d cluster (F9-04). One command: task k3d:up
#
# One server node, no agents: this machine has four logical processors and
# an 8 GB WSL ceiling, and a second node would only double the k3s overhead
# without adding CPU. The consequence is stated in ADR-014 rule 4: what is
# proven here is the autoscaling mechanism, not its capacity.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: selaras
servers: 1
agents: 0
image: rancher/k3s:v1.36.4-k3s1
# The API server is published ONLY on the host loopback with a fixed port.
# Without this, k3d (which sees DOCKER_HOST tcp:// in WSL) writes the
# kubeconfig to kubernetes.docker.internal:6443 while the port is random -
# and waits forever. It happened here.
kubeAPI:
  host: "127.0.0.1"
  hostIP: "127.0.0.1"
  hostPort: "26443"
ports:
  # The edge-gateway NodePort (values-local.yaml) -> host, loopback only.
  - port: 127.0.0.1:28080:30080
    nodeFilters: [server:0]
  # Grafana in the cluster, loopback only.
  - port: 127.0.0.1:23000:30300
    nodeFilters: [server:0]
options:
  k3s:
    extraArgs:
      # Traefik and ServiceLB are not used: the gateway is reached through a
      # NodePort and there is no Ingress in the local environment. Both only
      # consume memory more useful to KEDA and metrics-server.
      - arg: --disable=traefik
        nodeFilters: [server:0]
      - arg: --disable=servicelb
        nodeFilters: [server:0]
      # WSL2 on this machine runs cgroup v1 for Docker, and kubelet 1.36
      # refuses cgroup v1 unless explicitly asked. This is the WRONG decision
      # for production and the right one for this laptop; stated in the
      # closing RFC as a limit of the local environment.
      - arg: --kubelet-arg=fail-cgroupv1=false
        nodeFilters: [server:0]
      # /proc/sys/net/netfilter/nf_conntrack_max is read-only in WSL2;
      # kube-proxy is asked not to set it instead of failing.
      - arg: --kube-proxy-arg=conntrack-max-per-core=0
        nodeFilters: [server:0]
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
