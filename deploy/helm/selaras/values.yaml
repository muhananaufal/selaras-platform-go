# SHARED values for the selaras chart (F9-01, F9-02).
#
# The difference between local and cloud is only VALUES (values-local.yaml,
# values-cloud.yaml), not separate templates (ADR-010). This file holds what
# is the same in both environments: the unit catalogue, ports, probes, and
# resource shapes - the numbers taken from the compose measurements
# (docs/performance-report.md, docs/finops.md), not left blank (F9-03).
#
# There are no credentials here, in values-*.yaml, or in the templates
# (ADR-016). Every secret is read from one Secret created OUTSIDE the chart
# (secrets.existingSecret); the keys each unit needs are named in `secretEnv`
# so a missing one fails at start rather than being silently empty.

image:
  registry: "" # empty = a local image imported into k3d
  repository: selaras   # <registry>/<repository>/<unit>:<tag>
  tag: dev
  pullPolicy: IfNotPresent

secrets:
  existingSecret: selaras-secrets

# The same variables for every unit. Host names follow the Service names in
# the same namespace.
env:
  KAFKA_BROKERS: kafka:9092
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  REDIS_URL: redis://redis:6379/0

# The gateway rate limits. Production uses the code defaults (5 and 10 per
# minute); local raises them so the e2e suite can run
# (docs/runbook/rate-limits.md).
rateLimit:
  authRequests: ""
  llmRequests: ""

# Network limits (templates/networkpolicy.yaml): ingress is denied for every
# unit, then opened only along the *_GRPC_TARGET graph above and the probe
# port from the observability namespace. Egress is open, for reasons given
# in the template. Requires a CNI that enforces NetworkPolicy (k3s: yes,
# through its built-in controller).
networkPolicy:
  enabled: true
  observabilityNamespace: observability

# One pod may leave at any time; with three replicas, two keep serving.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

units:
  identity-svc:
    grpcPort: 9101
    healthPort: 9102
    env:
      IDENTITY_GRPC_ADDR: ":9101"
      IDENTITY_HEALTH_ADDR: ":9102"
      PROFILE_GRPC_TARGET: profile-svc:9201
      JWT_ACCESS_TTL: "3600"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: no-reply.local
      FRONTEND_URL: http://localhost:3000
      # argon2id 64 MiB x two concurrent derivations, on top of a base RSS of
      # ~30 MiB and the GC's working room. 192 MiB was OOM-killed twice while
      # the e2e suite registered accounts back to back on k3d (the cgroup
      # counts the full RSS, not the Go heap); 320 MiB leaves room, and
      # GOMEMLIMIT makes the GC work well before the ceiling.
      GOMEMLIMIT: 256MiB
    secretEnv: [IDENTITY_DATABASE_DSN, JWT_SIGNING_KEY]
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 320Mi }
    autoscaling: { enabled: true, minReplicas: 1, maxReplicas: 3, targetCPUUtilizationPercentage: 60 }

  profile-svc:
    grpcPort: 9201
    healthPort: 9202
    env:
      PROFILE_GRPC_ADDR: ":9201"
      PROFILE_HEALTH_ADDR: ":9202"
    secretEnv: [PROFILE_DATABASE_DSN, JWT_VERIFY_KEY]
    resources:
      requests: { cpu: 25m, memory: 32Mi }
      limits: { memory: 128Mi }
    autoscaling: { enabled: true, minReplicas: 1, maxReplicas: 3, targetCPUUtilizationPercentage: 60 }

  assessment-svc:
    grpcPort: 9301
    healthPort: 9302
    env:
      ASSESSMENT_GRPC_ADDR: ":9301"
      ASSESSMENT_HEALTH_ADDR: ":9302"
      PROFILE_GRPC_TARGET: profile-svc:9201
    secretEnv: [ASSESSMENT_DATABASE_DSN, JWT_VERIFY_KEY]
    resources:
      requests: { cpu: 50m, memory: 48Mi }
      limits: { memory: 160Mi }
    autoscaling: { enabled: true, minReplicas: 1, maxReplicas: 3, targetCPUUtilizationPercentage: 60 }

  coaching-svc:
    grpcPort: 9401
    healthPort: 9403
    env:
      COACHING_GRPC_ADDR: ":9401"
      COACHING_HEALTH_ADDR: ":9403"
    secretEnv: [COACHING_DATABASE_DSN, JWT_VERIFY_KEY]
    resources:
      requests: { cpu: 25m, memory: 32Mi }
      limits: { memory: 160Mi }
    autoscaling: { enabled: true, minReplicas: 1, maxReplicas: 3, targetCPUUtilizationPercentage: 60 }

  chat-svc:
    grpcPort: 9501
    healthPort: 9503
    env:
      CHAT_GRPC_ADDR: ":9501"
      CHAT_HEALTH_ADDR: ":9503"
    secretEnv: [CHAT_DATABASE_DSN, JWT_VERIFY_KEY]
    resources:
      requests: { cpu: 25m, memory: 32Mi }
      limits: { memory: 160Mi }
    autoscaling: { enabled: true, minReplicas: 1, maxReplicas: 3, targetCPUUtilizationPercentage: 60 }

  nutrition-svc:
    grpcPort: 9601
    healthPort: 9603
    env:
      NUTRITION_GRPC_ADDR: ":9601"
      NUTRITION_HEALTH_ADDR: ":9603"
      NUTRITION_TIMEZONE: Asia/Jakarta
    secretEnv: [NUTRITION_DATABASE_DSN, JWT_VERIFY_KEY]
    resources:
      requests: { cpu: 25m, memory: 32Mi }
      limits: { memory: 160Mi }
    autoscaling: { enabled: true, minReplicas: 1, maxReplicas: 3, targetCPUUtilizationPercentage: 60 }

  dashboard-svc:
    grpcPort: 9701
    healthPort: 9703
    env:
      DASHBOARD_GRPC_ADDR: ":9701"
      DASHBOARD_HEALTH_ADDR: ":9703"
    secretEnv: [DASHBOARD_DATABASE_DSN, JWT_VERIFY_KEY]
    resources:
      requests: { cpu: 25m, memory: 32Mi }
      limits: { memory: 160Mi }
    autoscaling: { enabled: true, minReplicas: 1, maxReplicas: 3, targetCPUUtilizationPercentage: 60 }

  llm-worker:
    # No gRPC port: it is a consumer. healthPort serves /metrics and the
    # probes.
    healthPort: 9402
    env:
      METRICS_ADDR: ":9402"
      LLM_PROVIDER: fake
      LLM_TIMEOUT: "120"
    secretEnv: [LLM_POSTGRES_DSN, GEMINI_API_KEY, GEMINI_MODEL]
    resources:
      requests: { cpu: 25m, memory: 32Mi }
      limits: { memory: 160Mi }
    # Scaled by KEDA on lag (F9-22), not by the CPU HPA (ADR-014).
    autoscaling: { enabled: false }
    keda:
      enabled: true
      # maxReplicaCount does NOT exceed the llm.jobs partition count (ADR-014 rule
      # 1).
      maxReplicaCount: 12
      minReplicaCount: 0
      # KEDA reads the lag directly from the broker for this group and topic -
      # a source that still exists when the worker is at 0 replicas (see
      # scaledobject.yaml).
      consumerGroup: llm-worker
      topic: llm.jobs
      lagThreshold: "5"
      pollingInterval: 10
      cooldownPeriod: 60

  edge-gateway:
    httpPort: 8080
    healthPort: 8081
    env:
      EDGE_HTTP_ADDR: ":8080"
      EDGE_ADMIN_ADDR: ":8081"
      IDENTITY_GRPC_TARGET: identity-svc:9101
      PROFILE_GRPC_TARGET: profile-svc:9201
      ASSESSMENT_GRPC_TARGET: assessment-svc:9301
      COACHING_GRPC_TARGET: coaching-svc:9401
      CHAT_GRPC_TARGET: chat-svc:9501
      NUTRITION_GRPC_TARGET: nutrition-svc:9601
      DASHBOARD_GRPC_TARGET: dashboard-svc:9701
    secretEnv: [JWT_VERIFY_KEY]
    resources:
      requests: { cpu: 50m, memory: 32Mi }
      limits: { memory: 128Mi }
    autoscaling: { enabled: true, minReplicas: 1, maxReplicas: 4, targetCPUUtilizationPercentage: 60 }
    service:
      type: ClusterIP
