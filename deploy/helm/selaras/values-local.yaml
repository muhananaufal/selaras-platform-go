# LOCAL values (k3d, single node) - only what differs from values.yaml
# (ADR-010).
#
# The k3d limit is stated openly (ADR-014 rule 4, F9-25): on one node, extra
# replicas share the same host CPU. What is proven here is that the autoscaling
# MECHANISM works, not that capacity grows.

image:
  registry: "" # the image is imported straight into the k3d node (task k3d:import)
  tag: dev
  pullPolicy: Never # if the image is not imported yet, fail now - do not pull from a registry that does not exist

# The e2e suite registers dozens of accounts from one address within seconds
# (docs/runbook/rate-limits.md). Raised, not switched off.
rateLimit:
  authRequests: "500"
  llmRequests: "500"

units:
  edge-gateway:
    service:
      # NodePort so k3d can map it to the host (deploy/k3d/cluster.yaml).
      type: NodePort
      nodePort: 30080
  llm-worker:
    env:
      METRICS_ADDR: ":9402"
      LLM_PROVIDER: fake
      LLM_TIMEOUT: "120"
