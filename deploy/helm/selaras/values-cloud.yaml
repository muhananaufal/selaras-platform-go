# Nilai CLOUD - hanya yang berbeda dari values.yaml (ADR-010).
#
# Belum pernah dijalankan di klaster cloud sungguhan; yang ada di sini adalah
# apa yang HARUS berbeda menurut rancangan, dan dinyatakan begitu supaya tidak
# dibaca sebagai konfigurasi yang sudah teruji. Registri, domain, dan kelas
# storage adalah keputusan per akun cloud, bukan milik chart ini.

image:
  registry: ghcr.io/muhananaufal   # dorong dari pipeline CD (F9-17)
  tag: ""                          # WAJIB diisi CD dengan tag image yang dibangunnya; kosong = gagal
  pullPolicy: IfNotPresent

# Batas laju memakai bawaan kode: 5 dan 10 per menit (docs/runbook/rate-limits.md).
rateLimit:
  authRequests: ""
  llmRequests: ""

units:
  edge-gateway:
    service:
      type: ClusterIP   # di belakang Ingress/LoadBalancer milik penyedia
    autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 6, targetCPUUtilizationPercentage: 60 }
  identity-svc:
    autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 4, targetCPUUtilizationPercentage: 60 }
  llm-worker:
    env:
      METRICS_ADDR: ":9402"
      LLM_PROVIDER: gemini
      LLM_TIMEOUT: "120"
    keda:
      enabled: true
      maxReplicaCount: 12      # = jumlah partisi llm.jobs (ADR-014 aturan 1)
      minReplicaCount: 1       # bukan nol: cold-start job pertama tidak layak untuk pengguna sungguhan (F9-23)
      lagThreshold: "5"
      pollingInterval: 10
      cooldownPeriod: 120
