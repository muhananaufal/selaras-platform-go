# CLOUD values - only what differs from values.yaml (ADR-010).
#
# Never yet run on a real cloud cluster; what is here is what MUST differ by
# design, and it is stated as such so it is not read as tested configuration.
# The registry, domain, and storage class are per-cloud-account decisions, not
# this chart's.

image:
  registry: ghcr.io/muhananaufal # pushed from the CD pipeline (F9-17)
  tag: "" # MUST be set by CD to the image tag it built; empty = fail
  pullPolicy: IfNotPresent

# Rate limits use the code defaults: 5 and 10 per minute
# (docs/runbook/rate-limits.md).
rateLimit:
  authRequests: ""
  llmRequests: ""

units:
  edge-gateway:
    service:
      type: ClusterIP # behind the provider's Ingress/LoadBalancer
    autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 6, targetCPUUtilizationPercentage: 60 }
  identity-svc:
    autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 4, targetCPUUtilizationPercentage: 60 }
  llm-worker:
    env:
      METRICS_ADDR: ":9402"
      LLM_PROVIDER: gemini
      LLM_TIMEOUT: "120"
    keda:
      enabled: true
      maxReplicaCount: 12      # = jumlah partisi llm.jobs (ADR-014 aturan 1)
      minReplicaCount: 1 # not zero: the first job's cold start is not acceptable for real users (F9-23)
      lagThreshold: "5"
      pollingInterval: 10
      cooldownPeriod: 120
