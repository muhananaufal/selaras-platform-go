{{- range $unit, $u := .Values.units }}
{{- $ctx := dict "root" $ "unit" $unit }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $unit }}
  labels:
    {{- include "selaras.labels" $ctx | nindent 4 }}
spec:
  {{- if not (and $u.autoscaling $u.autoscaling.enabled) }}
  {{- if not (and $u.keda $u.keda.enabled) }}
  replicas: {{ $u.replicas | default 1 }}
  {{- end }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "selaras.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "selaras.labels" $ctx | nindent 8 }}
      annotations:
        # Prometheus finds /metrics through this annotation
        # (deploy/k8s/observability).
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $u.healthPort | quote }}
        prometheus.io/path: /metrics
    spec:
      # Distroless, no shell, non-root: nothing can exec into it, and that is
      # exactly what is wanted.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 20
      # Replicas are spread across nodes when there is more than one; on
      # single-node k3d this has no effect (ScheduleAnyway), in the cloud it
      # keeps two replicas of the same unit from sharing a node that dies
      # together.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "selaras.selector" $ctx | nindent 14 }}
      containers:
        - name: {{ $unit }}
          image: {{ include "selaras.image" $ctx | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            {{- if $u.grpcPort }}
            - name: grpc
              containerPort: {{ $u.grpcPort }}
            {{- end }}
            {{- if $u.httpPort }}
            - name: http
              containerPort: {{ $u.httpPort }}
            {{- end }}
            - name: health
              containerPort: {{ $u.healthPort }}
          env:
            {{- range $k, $v := $.Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $k, $v := $u.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if eq $unit "edge-gateway" }}
            {{- with $.Values.rateLimit.authRequests }}
            - name: RATE_LIMIT_AUTH_REQUESTS
              value: {{ . | quote }}
            {{- end }}
            {{- with $.Values.rateLimit.llmRequests }}
            - name: RATE_LIMIT_LLM_REQUESTS
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- range $key := $u.secretEnv }}
            # Secrets are read from a Secret created outside the chart
            # (ADR-016). A missing key makes the pod fail to start - rather
            # than run with an empty value.
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.existingSecret }}
                  key: {{ $key }}
            {{- end }}
          # Three probes, three different questions (F9-03): startup waits
          # for the process to finish connecting to its dependencies;
          # readiness controls traffic; liveness only answers "is the
          # process still alive".
          startupProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml $u.resources | nindent 12 }}
{{- end }}
