{{- range $unit, $u := .Values.units }}
{{- if and $u.keda $u.keda.enabled }}
{{- $ctx := dict "root" $ "unit" $unit }}
---
# A KEDA ScaledObject based on consumer lag for llm-worker (F9-22, ADR-014).
#
# CPU is a poor proxy for work dominated by waiting for Gemini's answer: a
# worker 500 jobs behind can have low CPU. The right signal is LAG.
#
# KEDA reads the lag DIRECTLY from the broker (the kafka scaler), NOT from
# F3-15's kafka_consumer_lag metric. The two are the same number; the source
# differs, and the difference decides everything for scale-to-zero: the F3-15
# metric is published by the worker, so with the worker at 0 replicas the
# metric does not exist and nothing can wake it. That really happened when the
# e2e suite ran on k3d (F9-23): the ScaledObject's "triggers are not active"
# forever, chat replies never came. The broker knows the lag even when not a
# single consumer is alive.
#
# maxReplicaCount does NOT exceed the llm.jobs partition count (ADR-014 rule
# 1): a 13th consumer on a 12-partition topic sits idle - scaling that looks
# like it works while adding nothing. allowIdleConsumers=false makes KEDA
# enforce that too.
#
# minReplicaCount 0 = scale-to-zero when the queue is empty (F9-23). The price
# is the cold start of the first job, and that number is MEASURED in
# docs/performance-report.md (ADR-014 rule 5) - not ignored.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $unit }}
  labels:
    {{- include "selaras.labels" $ctx | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ $unit }}
  minReplicaCount: {{ $u.keda.minReplicaCount }}
  maxReplicaCount: {{ $u.keda.maxReplicaCount }}
  pollingInterval: {{ $u.keda.pollingInterval }}
  cooldownPeriod: {{ $u.keda.cooldownPeriod }}
  triggers:
    - type: kafka
      metadata:
        # The FULL name, not "kafka:9092" as the units use: KEDA lives in the
        # keda namespace, and short names do not translate across namespaces.
        # The broker announces this full name too (deploy/k8s/infra/kafka.yaml),
        # otherwise a client outside the selaras namespace is directed to an
        # address it cannot find.
        bootstrapServers: {{ printf "kafka.%s.svc.cluster.local:9092" $.Release.Namespace | quote }}
        consumerGroup: {{ $u.keda.consumerGroup | quote }}
        topic: {{ $u.keda.topic | quote }}
        # One replica per lagThreshold waiting jobs; one waiting job is
        # enough to wake the worker from zero.
        lagThreshold: {{ $u.keda.lagThreshold | quote }}
        activationLagThreshold: "0"
        allowIdleConsumers: "false"
        # A group that has never committed (a new worker) is counted from
        # the end of the topic, not from the start of the history - old lag
        # is not new work.
        offsetResetPolicy: latest
{{- end }}
{{- end }}
