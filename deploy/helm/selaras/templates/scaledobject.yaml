{{- range $unit, $u := .Values.units }}
{{- if and $u.keda $u.keda.enabled }}
{{- $ctx := dict "root" $ "unit" $unit }}
---
# KEDA ScaledObject berbasis lag konsumen untuk llm-worker (F9-22, ADR-014).
#
# CPU adalah proksi yang buruk untuk pekerjaan yang didominasi menunggu
# jawaban Gemini: worker yang tertinggal 500 job bisa punya CPU rendah. Sinyal
# yang benar adalah LAG.
#
# Lag dibaca KEDA LANGSUNG dari broker (scaler kafka), BUKAN dari metrik
# kafka_consumer_lag milik F3-15. Keduanya angka yang sama; sumbernya yang
# berbeda, dan perbedaannya menentukan segalanya untuk scale-to-zero: metrik
# F3-15 diterbitkan oleh worker, jadi saat worker 0 replika metriknya tidak
# ada dan tidak ada yang bisa membangunkannya. Itu benar-benar terjadi saat
# suite e2e dijalankan di k3d (F9-23): ScaledObject "triggers are not
# active" selamanya, balasan chat tidak pernah datang. Broker tahu lag-nya
# sekalipun tidak ada satu pun konsumen yang hidup.
#
# maxReplicaCount TIDAK melebihi jumlah partisi llm.jobs (ADR-014 aturan 1):
# konsumen ke-13 pada topic 12 partisi menganggur - scaling yang terlihat
# bekerja padahal tidak menambah apa pun. allowIdleConsumers=false membuat
# KEDA menegakkannya juga.
#
# minReplicaCount 0 = scale-to-zero saat antrean kosong (F9-23). Harganya
# adalah cold-start job pertama, dan angkanya DIUKUR di docs/performance-
# report.md (ADR-014 aturan 5) - bukan diabaikan.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $unit }}
  labels:
    {{- include "selaras.labels" $ctx | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ $unit }}
  minReplicaCount: {{ $u.keda.minReplicaCount }}
  maxReplicaCount: {{ $u.keda.maxReplicaCount }}
  pollingInterval: {{ $u.keda.pollingInterval }}
  cooldownPeriod: {{ $u.keda.cooldownPeriod }}
  triggers:
    - type: kafka
      metadata:
        # Nama LENGKAP, bukan "kafka:9092" seperti yang dipakai unit: KEDA hidup
        # di namespace keda, dan nama pendek tidak diterjemahkan lintas
        # namespace. Broker juga mengumumkan nama lengkap ini
        # (deploy/k8s/infra/kafka.yaml), kalau tidak klien di luar namespace
        # selaras dialihkan ke alamat yang tidak bisa ia temukan.
        bootstrapServers: {{ printf "kafka.%s.svc.cluster.local:9092" $.Release.Namespace | quote }}
        consumerGroup: {{ $u.keda.consumerGroup | quote }}
        topic: {{ $u.keda.topic | quote }}
        # Satu replika per lagThreshold job yang menunggu; satu job yang
        # menunggu sudah cukup untuk membangunkan worker dari nol.
        lagThreshold: {{ $u.keda.lagThreshold | quote }}
        activationLagThreshold: "0"
        allowIdleConsumers: "false"
        # Group yang belum pernah komit (worker baru) dihitung dari akhir
        # topic, bukan dari awal riwayat - lag lama bukan pekerjaan baru.
        offsetResetPolicy: latest
{{- end }}
{{- end }}
