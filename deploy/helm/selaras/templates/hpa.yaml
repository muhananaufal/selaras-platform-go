{{- range $unit, $u := .Values.units }}
{{- if and $u.autoscaling $u.autoscaling.enabled }}
{{- $ctx := dict "root" $ "unit" $unit }}
---
# CPU-based HPA for the HTTP/gRPC units (ADR-014 option c, HPA section).
#
# The threshold is NOT an arbitrary round number (ADR-014 rule 2): it is
# derived from the measurements in docs/performance-report.md - CPU per
# request and the point where p95 starts exceeding the SLO. The numbers live
# in values-*.yaml so an environment with different machines can re-measure
# without touching the template.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $unit }}
  labels:
    {{- include "selaras.labels" $ctx | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $unit }}
  minReplicas: {{ $u.autoscaling.minReplicas }}
  maxReplicas: {{ $u.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $u.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    # Up fast, down slow: bursts are the real shape of the load (E4), while
    # scaling down too fast throws replicas away right before the next wave.
    # Scaling down is limited to one replica per minute so the F9-24 graph
    # shows "up and back down" as a decision, not jitter.
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
{{- end }}
{{- end }}
