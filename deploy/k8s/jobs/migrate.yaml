# Job migrasi per skema dan Job pembuat topic (F9-04).
#
# Satu Job per service, memakai image `migrate` yang dibangun dari Dockerfile
# yang sama (UNIT=migrate) dan DSN LANGSUNG ke Postgres dari Secret
# selaras-secrets (MIGRATE_DSN_<SVC>) - bukan lewat PgBouncer, karena
# golang-migrate memegang advisory lock tingkat sesi.
#
# Job bersifat sekali jalan; `kubectl apply` ulang setelah ada migrasi baru
# menuntut Job lama dihapus dulu (deploy/k3d/infra.sh melakukannya).
apiVersion: batch/v1
kind: Job
metadata: { name: migrate-identity, namespace: selaras }
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: selaras/migrate:dev
          imagePullPolicy: Never
          args: ["-service", "identity", "-direction", "up"]
          env:
            - name: MIGRATE_DSN
              valueFrom: { secretKeyRef: { name: selaras-secrets, key: MIGRATE_DSN_IDENTITY } }
---
