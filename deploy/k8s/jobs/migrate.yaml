# The migration Job per schema and the topic-creating Job (F9-04).
#
# One Job per service, using the `migrate` image built from the same
# Dockerfile (UNIT=migrate) and a DSN STRAIGHT to Postgres from the
# selaras-secrets Secret (MIGRATE_DSN_<SVC>) - not through PgBouncer, because
# golang-migrate holds a session-level advisory lock.
#
# Jobs are run-once; re-running `kubectl apply` after a new migration
# requires the old Job to be deleted first (deploy/k3d/infra.sh does that).
apiVersion: batch/v1
kind: Job
metadata: { name: migrate-identity, namespace: selaras }
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: selaras/migrate:dev
          imagePullPolicy: Never
          args: ["-service", "identity", "-direction", "up"]
          env:
            - name: MIGRATE_DSN
              valueFrom: { secretKeyRef: { name: selaras-secrets, key: MIGRATE_DSN_IDENTITY } }
---
