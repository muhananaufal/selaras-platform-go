# The Kafka topics with the partition counts fixed in F3-01 (cmd/topics).
apiVersion: batch/v1
kind: Job
metadata: { name: topics, namespace: selaras }
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: topics
          image: selaras/topics:dev
          imagePullPolicy: Never
          args: ["-brokers", "kafka:9092"]
