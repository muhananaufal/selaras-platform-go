# Postgres for the local cluster (F9-04). One instance, a schema per service
# (ADR-006) - the SAME initdb as compose: the postgres-initdb ConfigMap is
# created from deploy/compose/initdb/01-schemas.sh by task k3d:infra, so
# there is only one source for the schema isolation rules.
#
# Credentials from the selaras-infra Secret created outside this manifest
# (task k3d:secrets, reading .env). No defaults (ADR-016).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: selaras
spec:
  clusterIP: None
  selector: { app: postgres }
  ports:
    - name: pg
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: selaras
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          envFrom:
            - secretRef:
                name: selaras-infra
          ports:
            - name: pg
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: initdb
          configMap:
            name: postgres-initdb
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
