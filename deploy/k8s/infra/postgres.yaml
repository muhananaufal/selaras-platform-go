# Postgres untuk klaster lokal (F9-04). Satu instance, skema per service
# (ADR-006) - initdb yang SAMA dengan compose: ConfigMap postgres-initdb
# dibuat dari deploy/compose/initdb/01-schemas.sh oleh task k3d:infra, supaya
# hanya ada satu sumber untuk aturan isolasi skema.
#
# Kredensial dari Secret selaras-infra yang dibuat di luar manifest ini
# (task k3d:secrets, membaca .env). Tidak ada nilai bawaan (ADR-016).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: selaras
spec:
  clusterIP: None
  selector: { app: postgres }
  ports:
    - name: pg
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: selaras
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          envFrom:
            - secretRef:
                name: selaras-infra
          ports:
            - name: pg
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: initdb
          configMap:
            name: postgres-initdb
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
