# The clinic access model (ADR-030), tested with the official CLI:
#   fga model test --tests deploy/openfga/model.fga.yaml
# Every rule the owner set on 2026-09-25 has a check here. The model has no
# relation for chat at all, so no tuple can ever open it.
name: clinic access
model_file: ./model.fga
tuples:
  - {user: "user:clinic_owner", relation: owner, object: "clinic:heartcare"}
  - {user: "user:clinic_admin", relation: admin, object: "clinic:heartcare"}
  - {user: "user:dr_rina", relation: clinician, object: "clinic:heartcare"}
  - {user: "user:dr_budi", relation: clinician, object: "clinic:heartcare"}
  # dr_sari consented to by the patient, but a clinician of another clinic -
  # the one she left heartcare for.
  - {user: "user:dr_sari", relation: clinician, object: "clinic:elsewhere"}
  - {user: "clinic:heartcare", relation: care_clinic, object: "patient:ani"}
  - {user: "user:dr_rina", relation: consented_clinician, object: "patient:ani"}
  - {user: "user:dr_sari", relation: consented_clinician, object: "patient:ani"}
  - {user: "user:clinic_admin", relation: consented_clinician, object: "patient:ani"}
tests:
  - name: a clinician the patient consented to reads what the owner allowed
    check:
      - user: user:dr_rina
        object: patient:ani
        assertions:
          can_view_assessments: true
          can_view_coaching_progress: true
  - name: consent is per clinician
    check:
      - user: user:dr_budi
        object: patient:ani
        assertions:
          can_view_assessments: false
          can_view_coaching_progress: false
  - name: consent without membership of the care clinic is not enough
    check:
      - user: user:dr_sari
        object: patient:ani
        assertions:
          can_view_assessments: false
          can_view_coaching_progress: false
  - name: running the clinic is not treating the patient
    check:
      - user: user:clinic_admin
        object: patient:ani
        assertions:
          can_view_assessments: false
      - user: user:clinic_owner
        object: patient:ani
        assertions:
          can_view_assessments: false
      - user: user:clinic_owner
        object: clinic:heartcare
        assertions:
          admin: true
  - name: consent for one patient opens no other
    check:
      - user: user:dr_rina
        object: patient:someone_else
        assertions:
          can_view_assessments: false
