# The observability layer. Used TOGETHER with core.yml, not instead of it:
#   task up:full  (core.yml + apps.yml + full.yml, with the collector address filled in)
#
# Split off because WSL has a memory ceiling and most day-to-day work does not
# need it (R4). Each component's configuration was filled in during phase F9;
# what is pinned here is the versions and memory limits.
name: selaras-core

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    container_name: selaras-otel
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "127.0.0.1:14317:4317"   # OTLP gRPC
      - "127.0.0.1:14318:4318"   # OTLP HTTP
    deploy:
      resources:
        limits:
          memory: 256M

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: selaras-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:19090:9090"
    deploy:
      resources:
        limits:
          memory: 512M

  # Firing alerts are sent as email to Mailpit (http://127.0.0.1:18025). The
  # rules are in observability/alerts.yml, tested by promtool in CI and through
  # `task alerts:test`; proof of live alerts is in docs/observability.md.
  alertmanager:
    image: prom/alertmanager:v0.34.0
    container_name: selaras-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:19093:9093"
    deploy:
      resources:
        limits:
          memory: 64M

  tempo:
    image: grafana/tempo:3.0.3
    container_name: selaras-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    deploy:
      resources:
        limits:
          memory: 384M

  loki:
    image: grafana/loki:3.7.7
    container_name: selaras-loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    deploy:
      resources:
        limits:
          memory: 384M

  alloy:
    image: grafana/alloy:v1.19.2
    container_name: selaras-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      # The daemon socket, read-only: Alloy reads container logs through the
      # Docker API. This means Alloy can see ALL containers on this daemon,
      # and that is why its configuration filters down to this project only.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [loki]
    deploy:
      resources:
        limits:
          memory: 192M

  grafana:
    image: grafana/grafana:13.2.1
    container_name: selaras-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/ds.yaml:ro
      - ./observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/selaras.yaml:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:13000:3000"
    depends_on: [prometheus, tempo, loki]
    deploy:
      resources:
        limits:
          memory: 384M

volumes:
  prometheus-data:
  alloy-data:
  tempo-data:
  loki-data:
  grafana-data:
