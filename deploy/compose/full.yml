# Lapisan observability. Dipakai BERSAMA core.yml, bukan menggantikannya:
#   task up:full  (core.yml + apps.yml + full.yml, dengan alamat collector diisi)
#
# Dipisah karena WSL punya plafon memori dan sebagian besar pekerjaan
# sehari-hari tidak membutuhkannya (R4). Konfigurasi tiap komponen diisi
# pada fase F9; di sini yang dikunci adalah versi dan batas memorinya.
name: selaras-core

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    container_name: selaras-otel
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "127.0.0.1:14317:4317"   # OTLP gRPC
      - "127.0.0.1:14318:4318"   # OTLP HTTP
    deploy:
      resources:
        limits:
          memory: 256M

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: selaras-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:19090:9090"
    deploy:
      resources:
        limits:
          memory: 512M

  tempo:
    image: grafana/tempo:3.0.3
    container_name: selaras-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    deploy:
      resources:
        limits:
          memory: 384M

  loki:
    image: grafana/loki:3.7.7
    container_name: selaras-loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    deploy:
      resources:
        limits:
          memory: 384M

  alloy:
    image: grafana/alloy:v1.19.2
    container_name: selaras-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      # Socket daemon, hanya baca: Alloy membaca log container lewat API
      # Docker. Ini berarti Alloy bisa melihat SEMUA container di daemon ini,
      # dan itulah alasan konfigurasinya menyaring ke proyek ini saja.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [loki]
    deploy:
      resources:
        limits:
          memory: 192M

  grafana:
    image: grafana/grafana:13.2.1
    container_name: selaras-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/ds.yaml:ro
      - ./observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/selaras.yaml:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:13000:3000"
    depends_on: [prometheus, tempo, loki]
    deploy:
      resources:
        limits:
          memory: 384M

volumes:
  prometheus-data:
  alloy-data:
  tempo-data:
  loki-data:
  grafana-data:
