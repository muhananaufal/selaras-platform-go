# The minimum dependencies for day-to-day development. This profile
# deliberately leaves out the observability stack: most work does not need
# it, and WSL has a memory ceiling. Every host port is shifted +10000 from
# its default. This machine already runs another project's postgres on 5432;
# grabbing default ports is the easiest way to make two projects kill each
# other.
name: selaras-core

services:
  postgres:
    image: postgres:18.6-alpine
    # The Docker daemon in WSL on this machine occasionally restarts, and
    # without this policy the local dependencies die silently in the middle
    # of a test.
    restart: unless-stopped
    container_name: selaras-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-selaras}
      # initdb creates one role per service; without this the script refuses
      # to run.
      SVC_IDENTITY_PASSWORD: ${SVC_IDENTITY_PASSWORD:?set SVC_IDENTITY_PASSWORD}
      SVC_PROFILE_PASSWORD: ${SVC_PROFILE_PASSWORD:?set SVC_PROFILE_PASSWORD}
      SVC_ASSESSMENT_PASSWORD: ${SVC_ASSESSMENT_PASSWORD:?set SVC_ASSESSMENT_PASSWORD}
      SVC_COACHING_PASSWORD: ${SVC_COACHING_PASSWORD:?set SVC_COACHING_PASSWORD}
      SVC_CHAT_PASSWORD: ${SVC_CHAT_PASSWORD:?set SVC_CHAT_PASSWORD}
      SVC_NUTRITION_PASSWORD: ${SVC_NUTRITION_PASSWORD:?set SVC_NUTRITION_PASSWORD}
      SVC_DASHBOARD_PASSWORD: ${SVC_DASHBOARD_PASSWORD:?set SVC_DASHBOARD_PASSWORD}
      SVC_LLM_PASSWORD: ${SVC_LLM_PASSWORD:?set SVC_LLM_PASSWORD}
      # The replication role for the read replica (initdb/02-replication.sh,
      # F9-32).
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?set REPLICATION_PASSWORD}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  postgres-replica:
    # A read replica through streaming replication (F9-32). Only
    # dashboard-svc reads from it (DASHBOARD_READ_DSN); writes still go to
    # the primary, and the replica refuses writes. Its replication lag is
    # measured in docs/db-connections.md.
    image: postgres:18.6-alpine
    restart: unless-stopped
    container_name: selaras-postgres-replica
    entrypoint: ["/bin/bash", "/replica-entrypoint.sh"]
    environment:
      PRIMARY_HOST: postgres
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?set REPLICATION_PASSWORD}
      # Read by the image entrypoint only during initdb - which never happens
      # on a replica (its data is a copy of the primary) - but it refuses to
      # start without it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - postgres-replica-data:/var/lib/postgresql
      - ./replica/entrypoint.sh:/replica-entrypoint.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replicator -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M

  pgbouncer:
    # PgBouncer in front of Postgres, transaction mode (F9-27).
    #
    # Nine units x a pool of 10 x replicas while the HPA is active exceeds
    # Postgres's max_connections=100 long before the load matters - the
    # numbers are in docs/db-connections.md. PgBouncer gives every (role,
    # database) a small server pool and lets clients open as many as they
    # like.
    #
    # The per-service roles and schema isolation (ADR-006) REMAIN: clients
    # connect as svc_<schema> and PgBouncer verifies the password through an
    # auth_query to Postgres using auth_user - there is no second password
    # list that could drift.
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped
    container_name: selaras-pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: "*"
      DB_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      AUTH_TYPE: scram-sha-256
      AUTH_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 8
      # search_path is sent by pgx as a startup parameter; PgBouncer refuses
      # ones it does not know. Ignored here, and that is safe: every svc_*
      # role has a default search_path from initdb (ALTER ROLE ... SET).
      IGNORE_STARTUP_PARAMETERS: search_path
      # pgx uses prepared statements; transaction mode only supports them when
      # PgBouncer tracks them itself (1.21+).
      MAX_PREPARED_STATEMENTS: 200
      # The admin console (SHOW POOLS, SHOW STATS) for the F9-26/27
      # measurements.
      STATS_USERS: ${POSTGRES_USER:?set POSTGRES_USER}
    ports:
      - "127.0.0.1:16432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $$AUTH_USER"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 64M

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    container_name: selaras-kafka
    environment:
      # KRaft mode: one process, no ZooKeeper. Kafka 4.x no longer supports
      # ZooKeeper at all.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two client-facing listeners, and that is necessary.
      #
      # Kafka answers every connection with the address the client has to use
      # next, not the address it just used to connect. With one listener
      # announcing "kafka:9092", a client on the host connects successfully to
      # the mapped port and is then directed to a name it cannot resolve - and
      # fails after appearing to succeed.
      KAFKA_LISTENERS: PLAINTEXT://:9092,HOST://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://127.0.0.1:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The heap is kept low: WSL is capped at 8GB for ALL of Docker.
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      # Without this the apache/kafka image writes its logs to /tmp inside the
      # container, not to the kafka-data volume: a container that is recreated
      # (not merely restarted) loses every topic. Found on k3d (F9-04).
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:8.8.2-alpine
    restart: unless-stopped
    container_name: selaras-redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 192M

  # Mailpit captures every outgoing email and serves it over HTTP.
  #
  # It exists so the password reset flow can be REALLY run on one's own
  # machine, not assumed to work. A flow whose token is never sent is a flow
  # that silently does not work, and the only way to know is to look at the
  # email.
  mailpit:
    image: axllent/mailpit:v1.28.2
    restart: unless-stopped
    container_name: selaras-mailpit
    ports:
      - "127.0.0.1:11025:1025"
      - "127.0.0.1:18025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres-data:
  postgres-replica-data:
  kafka-data:
