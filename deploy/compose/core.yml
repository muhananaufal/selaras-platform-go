# Dependensi minimum untuk pengembangan sehari-hari.
# Profil ini sengaja tidak memuat stack observability: sebagian besar
# pekerjaan tidak membutuhkannya, dan WSL punya plafon memori.
# Seluruh port host digeser +10000 dari nilai bawaannya. Mesin ini sudah
# menjalankan postgres di 5432 milik proyek lain; merebut port default
# adalah cara termudah membuat dua proyek saling mematikan.
name: selaras-core

services:
  postgres:
    image: postgres:18.6-alpine
    # Daemon Docker di WSL pada mesin ini sesekali dimulai ulang, dan tanpa
    # kebijakan ini dependensi lokal mati diam-diam di tengah test.
    restart: unless-stopped
    container_name: selaras-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-selaras}
      # initdb membuat satu role per service; tanpa ini script menolak jalan.
      SVC_IDENTITY_PASSWORD: ${SVC_IDENTITY_PASSWORD:?set SVC_IDENTITY_PASSWORD}
      SVC_PROFILE_PASSWORD: ${SVC_PROFILE_PASSWORD:?set SVC_PROFILE_PASSWORD}
      SVC_ASSESSMENT_PASSWORD: ${SVC_ASSESSMENT_PASSWORD:?set SVC_ASSESSMENT_PASSWORD}
      SVC_COACHING_PASSWORD: ${SVC_COACHING_PASSWORD:?set SVC_COACHING_PASSWORD}
      SVC_CHAT_PASSWORD: ${SVC_CHAT_PASSWORD:?set SVC_CHAT_PASSWORD}
      SVC_NUTRITION_PASSWORD: ${SVC_NUTRITION_PASSWORD:?set SVC_NUTRITION_PASSWORD}
      SVC_DASHBOARD_PASSWORD: ${SVC_DASHBOARD_PASSWORD:?set SVC_DASHBOARD_PASSWORD}
      SVC_LLM_PASSWORD: ${SVC_LLM_PASSWORD:?set SVC_LLM_PASSWORD}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    container_name: selaras-kafka
    environment:
      # Mode KRaft: satu proses, tanpa ZooKeeper. Kafka 4.x tidak lagi
      # mendukung ZooKeeper sama sekali.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Heap ditahan rendah: WSL dibatasi 8GB untuk SELURUH Docker.
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:19092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:8.8.2-alpine
    restart: unless-stopped
    container_name: selaras-redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 192M

  # Mailpit menangkap seluruh surel keluar dan menyajikannya lewat HTTP.
  #
  # Ia ada supaya alur reset kata sandi bisa BENAR-BENAR dijalankan di mesin
  # sendiri, bukan diandaikan bekerja. Alur yang tokennya tidak pernah
  # terkirim adalah alur yang diam-diam tidak bekerja, dan satu-satunya cara
  # mengetahuinya adalah dengan melihat surelnya.
  mailpit:
    image: axllent/mailpit:v1.28.2
    restart: unless-stopped
    container_name: selaras-mailpit
    ports:
      - "127.0.0.1:11025:1025"
      - "127.0.0.1:18025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres-data:
  kafka-data:
