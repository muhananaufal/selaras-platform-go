# pgBackRest configuration (version 2.58.0; every option below was checked
# with `pgbackrest help <command> <option>` of that version).
#
# The database user is not set here: it is the stack's superuser, passed as
# PGBACKREST_PG1_USER, because pgBackRest otherwise connects as "postgres",
# a role this cluster does not have.

[global]
# One repository on a volume of its own. A second repository off this
# machine (object storage) is what turns "disk lost" into a recoverable
# event; it needs an account, so it is not configured here.
repo1-path=/var/lib/pgbackrest
# Two full backups are kept, and the WAL needed to recover to any point
# after the older one. With a weekly full backup that is about two weeks.
repo1-retention-full=2
# Start the backup with an immediate checkpoint, not at the next scheduled one.
start-fast=y
log-level-console=info
log-level-file=off

[selaras]
pg1-path=/var/lib/postgresql/18/docker
