# Scheduled Postgres backup (F9-30). Used TOGETHER with core.yml:
#   docker compose -f core.yml -f backup.yml up -d
#
# Separate from core.yml because its lifecycle differs: it may be absent on a
# developer machine whose data is thrown away every day, and MUST be present
# wherever the data matters. Its image is the SAME as the server's so pg_dump
# matches.
name: selaras-core

services:
  backup:
    image: postgres:18.6-alpine
    restart: unless-stopped
    container_name: selaras-backup
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-selaras}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-21600}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      # A volume separate from the Postgres data. A backup living on the
      # same disk as its data answers "deleted by mistake", not "disk died";
      # an external location (a bucket) is the next step, and is recorded in
      # docs/runbook/backup.md as NOT yet there.
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  backups:
