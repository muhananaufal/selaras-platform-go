# Unit aplikasi. Dipakai BERSAMA core.yml, bukan menggantikannya:
#   docker compose -f core.yml -f apps.yml up -d
#
# Dipisah dari core.yml karena keduanya punya siklus hidup yang berbeda:
# dependensi menyala sekali dan dibiarkan, sementara unit aplikasi dibangun
# ulang setiap kali kodenya berubah.
name: selaras-core

services:
  identity-svc:
    build:
      context: ../..
      args:
        UNIT: identity-svc
    restart: unless-stopped
    container_name: selaras-identity
    environment:
      # Nama host berasal dari jaringan compose, bukan localhost: di dalam
      # container, localhost adalah container itu sendiri.
      IDENTITY_DATABASE_DSN: >-
        postgres://svc_identity:${SVC_IDENTITY_PASSWORD:?set SVC_IDENTITY_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}?sslmode=disable&search_path=identity
      REDIS_URL: redis://redis:6379/0
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-3600}
      PROFILE_GRPC_TARGET: profile-svc:9201
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

      # Mailpit di dalam jaringan compose. Alur reset karena itu bisa
      # BENAR-BENAR dijalankan di mesin sendiri, dan surelnya dibaca di
      # http://127.0.0.1:18025.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply.local}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

      IDENTITY_GRPC_ADDR: ":9101"
      IDENTITY_HEALTH_ADDR: ":9102"
    ports:
      - "127.0.0.1:19101:9101"
      - "127.0.0.1:19102:9102"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      # Image-nya distroless dan tidak punya shell, curl, atau wget. Probe
      # HTTP dikerjakan dari luar oleh siapa pun yang memerlukannya; di sini
      # yang bisa diperiksa hanyalah apakah prosesnya masih hidup, dan itu
      # sudah dilakukan Docker sendiri.
      disable: true
    deploy:
      resources:
        limits:
          memory: 192M

  profile-svc:
    build:
      context: ../..
      args:
        UNIT: profile-svc
    restart: unless-stopped
    container_name: selaras-profile
    environment:
      PROFILE_DATABASE_DSN: >-
        postgres://svc_profile:${SVC_PROFILE_PASSWORD:?set SVC_PROFILE_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}?sslmode=disable&search_path=profile
      PROFILE_GRPC_ADDR: ":9201"
      # Tanpa ini, event profile.updated menumpuk di outbox tanpa terkirim,
      # dan cache di assessment-svc tidak pernah terisi (F2-16).
      KAFKA_BROKERS: kafka:9092
      PROFILE_HEALTH_ADDR: ":9202"
    ports:
      - "127.0.0.1:19201:9201"
      - "127.0.0.1:19202:9202"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 128M

  assessment-svc:
    build:
      context: ../..
      args:
        UNIT: assessment-svc
    restart: unless-stopped
    container_name: selaras-assessment
    environment:
      ASSESSMENT_DATABASE_DSN: >-
        postgres://svc_assessment:${SVC_ASSESSMENT_PASSWORD:?set SVC_ASSESSMENT_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}?sslmode=disable&search_path=assessment
      PROFILE_GRPC_TARGET: profile-svc:9201
      ASSESSMENT_GRPC_ADDR: ":9301"
      ASSESSMENT_HEALTH_ADDR: ":9302"
      # Tanpa ini, permintaan personalisasi DITOLAK alih-alih diterima lalu
      # hilang - lihat startEventing di cmd/assessment-svc.
      KAFKA_BROKERS: kafka:9092
    ports:
      - "127.0.0.1:19301:9301"
      - "127.0.0.1:19302:9302"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 160M

  chat-svc:
    build:
      context: ../..
      args:
        UNIT: chat-svc
    restart: unless-stopped
    container_name: selaras-chat
    environment:
      CHAT_DATABASE_DSN: >-
        postgres://svc_chat:${SVC_CHAT_PASSWORD:?set SVC_CHAT_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}?sslmode=disable&search_path=chat
      CHAT_GRPC_ADDR: ":9501"
      CHAT_HEALTH_ADDR: ":9503"
      KAFKA_BROKERS: kafka:9092
    ports:
      - "127.0.0.1:19501:9501"
      - "127.0.0.1:19503:9503"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 160M

  nutrition-svc:
    build:
      context: ../..
      args:
        UNIT: nutrition-svc
    restart: unless-stopped
    container_name: selaras-nutrition
    environment:
      NUTRITION_DATABASE_DSN: >-
        postgres://svc_nutrition:${SVC_NUTRITION_PASSWORD:?set SVC_NUTRITION_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}?sslmode=disable&search_path=nutrition
      NUTRITION_GRPC_ADDR: ":9601"
      NUTRITION_HEALTH_ADDR: ":9603"
      KAFKA_BROKERS: kafka:9092
    ports:
      - "127.0.0.1:19601:9601"
      - "127.0.0.1:19603:9603"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 160M

  coaching-svc:
    build:
      context: ../..
      args:
        UNIT: coaching-svc
    restart: unless-stopped
    container_name: selaras-coaching
    environment:
      COACHING_DATABASE_DSN: >-
        postgres://svc_coaching:${SVC_COACHING_PASSWORD:?set SVC_COACHING_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}?sslmode=disable&search_path=coaching
      COACHING_GRPC_ADDR: ":9401"
      COACHING_HEALTH_ADDR: ":9403"
      KAFKA_BROKERS: kafka:9092
    ports:
      - "127.0.0.1:19401:9401"
      - "127.0.0.1:19403:9403"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 160M

  llm-worker:
    build:
      context: ../..
      args:
        UNIT: llm-worker
    restart: unless-stopped
    container_name: selaras-llm-worker
    environment:
      LLM_POSTGRES_DSN: >-
        postgres://svc_llm:${SVC_LLM_PASSWORD:?set SVC_LLM_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}?sslmode=disable&search_path=llm
      KAFKA_BROKERS: kafka:9092
      # Mode fake HARUS diminta eksplisit. Nilai bawaan yang jatuh ke fake
      # berarti ada keadaan di mana pengguna dijawab teks yang dibuat-buat
      # tanpa ada yang tahu - lihat buildProvider di cmd/llm-worker.
      LLM_PROVIDER: ${LLM_PROVIDER:?set LLM_PROVIDER to gemini or fake}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      METRICS_ADDR: ":9402"
    ports:
      - "127.0.0.1:19402:9402"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 160M

  edge-gateway:
    build:
      context: ../..
      args:
        UNIT: edge-gateway
    restart: unless-stopped
    container_name: selaras-edge
    environment:
      # Gateway memegang kunci PUBLIK saja. Itu inti ADR-020: ia bisa
      # memverifikasi token dan tidak bisa menerbitkan satu pun.
      JWT_VERIFY_KEY: ${JWT_VERIFY_KEY:?set JWT_VERIFY_KEY}
      IDENTITY_GRPC_TARGET: identity-svc:9101
      PROFILE_GRPC_TARGET: profile-svc:9201
      REDIS_URL: redis://redis:6379/0
      COACHING_GRPC_TARGET: coaching-svc:9401
      CHAT_GRPC_TARGET: chat-svc:9501
      NUTRITION_GRPC_TARGET: nutrition-svc:9601
      # Kosong berarti masuk lewat penyedia sosial tidak dipasang, dan
      # rutenya tidak ada. Terisi sebagian menggagalkan start-up.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      ASSESSMENT_GRPC_TARGET: assessment-svc:9301
      EDGE_HTTP_ADDR: ":8080"
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      redis:
        condition: service_healthy
      # Tidak menunggu identity-svc dan profile-svc siap: koneksi gRPC
      # dibuka malas, dan gateway yang menolak menyala karena tetangganya
      # belum siap akan membuat urutan start-up menjadi rantai yang rapuh.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 128M
