# The application units. Used TOGETHER with core.yml, not instead of it:
#   docker compose -f core.yml -f apps.yml up -d
#
# Split from core.yml because the two have different lifecycles: the
# dependencies are started once and left alone, while the application units
# are rebuilt every time their code changes.
name: selaras-core

services:
  identity-svc:
    build:
      context: ../..
      args:
        UNIT: identity-svc
    restart: unless-stopped
    container_name: selaras-identity
    environment:
      # Host names come from the compose network, not localhost: inside a
      # container, localhost is the container itself. Every unit connects
      # through PgBouncer (F9-27), not directly to Postgres: the connection
      # numbers are in docs/db-connections.md. The search_path in the DSN is
      # ignored by PgBouncer; what applies is the role default from initdb.
      IDENTITY_DATABASE_DSN: >-
        postgres://svc_identity:${SVC_IDENTITY_PASSWORD:?set SVC_IDENTITY_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:?set POSTGRES_DB}?sslmode=disable&search_path=identity
      REDIS_URL: redis://redis:6379/0
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-3600}
      PROFILE_GRPC_TARGET: profile-svc:9201
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      KAFKA_BROKERS: kafka:9092

      # Mailpit inside the compose network. The reset flow can therefore be
      # REALLY run on one's own machine, and the email is read at
      # http://127.0.0.1:18025.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply.local}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

      IDENTITY_GRPC_ADDR: ":9101"
      IDENTITY_HEALTH_ADDR: ":9102"

      # argon2id holds 64 MiB per derivation and the hasher caps it at two
      # concurrent (crypto.DefaultMaxConcurrent). GOMEMLIMIT makes the Go GC
      # return memory before hitting the container ceiling, not after:
      # without it the RSS stuck to the ceiling throughout k6 (F9-10).
      GOMEMLIMIT: 256MiB

      # The OTLP collector address. EMPTY means traces are not sent - and
      # that is stated in the log at start, not a silent failure. Filled in
      # by `task up:full`, which also starts the collector; without a
      # collector, a filled-in address only produces an export error every
      # few seconds in every unit.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_COLLECTOR_ENDPOINT:-}
    ports:
      - "127.0.0.1:19101:9101"
      - "127.0.0.1:19102:9102"
    depends_on:
      pgbouncer:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      kafka:
        condition: service_healthy
      topics:
        condition: service_completed_successfully
    healthcheck:
      # The image is distroless and has no shell, curl, or wget. HTTP probes
      # are done from outside by whoever needs them; the only thing
      # checkable here is whether the process is still alive, and Docker
      # already does that itself.
      disable: true
    deploy:
      resources:
        limits:
          memory: 320M

  profile-svc:
    build:
      context: ../..
      args:
        UNIT: profile-svc
    restart: unless-stopped
    container_name: selaras-profile
    environment:
      PROFILE_DATABASE_DSN: >-
        postgres://svc_profile:${SVC_PROFILE_PASSWORD:?set SVC_PROFILE_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:?set POSTGRES_DB}?sslmode=disable&search_path=profile
      PROFILE_GRPC_ADDR: ":9201"
      # Without this, profile.updated events pile up in the outbox unsent,
      # and the cache in assessment-svc never fills (F2-16).
      KAFKA_BROKERS: kafka:9092
      # The token public key: every service verifies for itself who is
      # asking (ADR-026), rather than trusting the user_id the gateway
      # sends.
      JWT_VERIFY_KEY: ${JWT_VERIFY_KEY:?set JWT_VERIFY_KEY}
      PROFILE_HEALTH_ADDR: ":9202"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_COLLECTOR_ENDPOINT:-}
    ports:
      - "127.0.0.1:19201:9201"
      - "127.0.0.1:19202:9202"
    depends_on:
      pgbouncer:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      topics:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 128M

  assessment-svc:
    build:
      context: ../..
      args:
        UNIT: assessment-svc
    restart: unless-stopped
    container_name: selaras-assessment
    environment:
      ASSESSMENT_DATABASE_DSN: >-
        postgres://svc_assessment:${SVC_ASSESSMENT_PASSWORD:?set SVC_ASSESSMENT_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:?set POSTGRES_DB}?sslmode=disable&search_path=assessment
      PROFILE_GRPC_TARGET: profile-svc:9201
      ASSESSMENT_GRPC_ADDR: ":9301"
      ASSESSMENT_HEALTH_ADDR: ":9302"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_COLLECTOR_ENDPOINT:-}
      # Without this, personalisation requests are REFUSED instead of
      # accepted and then lost - see startEventing in cmd/assessment-svc.
      KAFKA_BROKERS: kafka:9092
      # The token public key: every service verifies for itself who is
      # asking (ADR-026), rather than trusting the user_id the gateway
      # sends.
      JWT_VERIFY_KEY: ${JWT_VERIFY_KEY:?set JWT_VERIFY_KEY}
    ports:
      - "127.0.0.1:19301:9301"
      - "127.0.0.1:19302:9302"
    depends_on:
      pgbouncer:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      topics:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 160M

  chat-svc:
    build:
      context: ../..
      args:
        UNIT: chat-svc
    restart: unless-stopped
    container_name: selaras-chat
    environment:
      CHAT_DATABASE_DSN: >-
        postgres://svc_chat:${SVC_CHAT_PASSWORD:?set SVC_CHAT_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:?set POSTGRES_DB}?sslmode=disable&search_path=chat
      CHAT_GRPC_ADDR: ":9501"
      CHAT_HEALTH_ADDR: ":9503"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_COLLECTOR_ENDPOINT:-}
      KAFKA_BROKERS: kafka:9092
      # The token public key: every service verifies for itself who is
      # asking (ADR-026), rather than trusting the user_id the gateway
      # sends.
      JWT_VERIFY_KEY: ${JWT_VERIFY_KEY:?set JWT_VERIFY_KEY}
    ports:
      - "127.0.0.1:19501:9501"
      - "127.0.0.1:19503:9503"
    depends_on:
      pgbouncer:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      topics:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 160M

  nutrition-svc:
    build:
      context: ../..
      args:
        UNIT: nutrition-svc
    restart: unless-stopped
    container_name: selaras-nutrition
    environment:
      NUTRITION_DATABASE_DSN: >-
        postgres://svc_nutrition:${SVC_NUTRITION_PASSWORD:?set SVC_NUTRITION_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:?set POSTGRES_DB}?sslmode=disable&search_path=nutrition
      NUTRITION_GRPC_ADDR: ":9601"
      NUTRITION_HEALTH_ADDR: ":9603"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_COLLECTOR_ENDPOINT:-}
      KAFKA_BROKERS: kafka:9092
      # The token public key: every service verifies for itself who is
      # asking (ADR-026), rather than trusting the user_id the gateway
      # sends.
      JWT_VERIFY_KEY: ${JWT_VERIFY_KEY:?set JWT_VERIFY_KEY}
    ports:
      - "127.0.0.1:19601:9601"
      - "127.0.0.1:19603:9603"
    depends_on:
      pgbouncer:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      topics:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 160M

  dashboard-svc:
    build:
      context: ../..
      args:
        UNIT: dashboard-svc
    restart: unless-stopped
    container_name: selaras-dashboard
    environment:
      DASHBOARD_DATABASE_DSN: >-
        postgres://svc_dashboard:${SVC_DASHBOARD_PASSWORD:?set SVC_DASHBOARD_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:?set POSTGRES_DB}?sslmode=disable&search_path=dashboard
      DASHBOARD_GRPC_ADDR: ":9701"
      DASHBOARD_HEALTH_ADDR: ":9703"
      # The read replica (F9-32): straight to the replica, not through
      # PgBouncer - its read pool is small and there is one replica.
      DASHBOARD_READ_DSN: >-
        postgres://svc_dashboard:${SVC_DASHBOARD_PASSWORD:?set SVC_DASHBOARD_PASSWORD}@postgres-replica:5432/${POSTGRES_DB:?set POSTGRES_DB}?sslmode=disable&search_path=dashboard
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_COLLECTOR_ENDPOINT:-}
      KAFKA_BROKERS: kafka:9092
      # The token public key: every service verifies for itself who is
      # asking (ADR-026), rather than trusting the user_id the gateway
      # sends.
      JWT_VERIFY_KEY: ${JWT_VERIFY_KEY:?set JWT_VERIFY_KEY}
    ports:
      - "127.0.0.1:19701:9701"
      - "127.0.0.1:19703:9703"
    depends_on:
      pgbouncer:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      topics:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 160M

  coaching-svc:
    build:
      context: ../..
      args:
        UNIT: coaching-svc
    restart: unless-stopped
    container_name: selaras-coaching
    environment:
      COACHING_DATABASE_DSN: >-
        postgres://svc_coaching:${SVC_COACHING_PASSWORD:?set SVC_COACHING_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:?set POSTGRES_DB}?sslmode=disable&search_path=coaching
      COACHING_GRPC_ADDR: ":9401"
      COACHING_HEALTH_ADDR: ":9403"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_COLLECTOR_ENDPOINT:-}
      KAFKA_BROKERS: kafka:9092
      # The token public key: every service verifies for itself who is
      # asking (ADR-026), rather than trusting the user_id the gateway
      # sends.
      JWT_VERIFY_KEY: ${JWT_VERIFY_KEY:?set JWT_VERIFY_KEY}
    ports:
      - "127.0.0.1:19401:9401"
      - "127.0.0.1:19403:9403"
    depends_on:
      pgbouncer:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      topics:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 160M

  llm-worker:
    build:
      context: ../..
      args:
        UNIT: llm-worker
    restart: unless-stopped
    container_name: selaras-llm-worker
    environment:
      LLM_POSTGRES_DSN: >-
        postgres://svc_llm:${SVC_LLM_PASSWORD:?set SVC_LLM_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:?set POSTGRES_DB}?sslmode=disable&search_path=llm
      KAFKA_BROKERS: kafka:9092
      # The fake mode MUST be requested explicitly. A default that falls
      # back to fake means there is a state in which users are answered with
      # made-up text without anyone knowing - see buildProvider in
      # cmd/llm-worker.
      LLM_PROVIDER: ${LLM_PROVIDER:?set LLM_PROVIDER to gemini or fake}
      # The fake provider's fault for chaos F9-14 (slow=<duration>, flaky=<n>,
      # error). Empty means no fault; set by test/chaos/llm.sh.
      LLM_FAKE_FAULT: ${LLM_FAKE_FAULT:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      METRICS_ADDR: ":9402"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_COLLECTOR_ENDPOINT:-}
    ports:
      - "127.0.0.1:19402:9402"
    depends_on:
      pgbouncer:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      topics:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 160M

  edge-gateway:
    build:
      context: ../..
      args:
        UNIT: edge-gateway
    restart: unless-stopped
    container_name: selaras-edge
    environment:
      # The gateway holds the PUBLIC key only. That is the core of ADR-020:
      # it can verify tokens and cannot issue a single one.
      JWT_VERIFY_KEY: ${JWT_VERIFY_KEY:?set JWT_VERIFY_KEY}
      IDENTITY_GRPC_TARGET: identity-svc:9101
      PROFILE_GRPC_TARGET: profile-svc:9201
      REDIS_URL: redis://redis:6379/0
      COACHING_GRPC_TARGET: coaching-svc:9401
      CHAT_GRPC_TARGET: chat-svc:9501
      NUTRITION_GRPC_TARGET: nutrition-svc:9601
      DASHBOARD_GRPC_TARGET: dashboard-svc:9701
      # Empty means sign-in through a social provider is not mounted, and
      # the routes do not exist. Partially filled fails start-up.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      ASSESSMENT_GRPC_TARGET: assessment-svc:9301
      EDGE_HTTP_ADDR: ":8080"
      # Metrics and probes on a port separate from the public API.
      EDGE_ADMIN_ADDR: ":8081"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_COLLECTOR_ENDPOINT:-}

      # Rate limits are RAISED in the development environment, not switched off.
      #
      # The production limit - five login attempts per minute per IP - makes the
      # end-to-end test suite impossible to run: it registers dozens of accounts
      # from one address within seconds, and that is precisely the shape
      # production wants to refuse.
      #
      # Only the numbers are raised; every request still passes through the
      # path, so the limiter itself stays tested here.
      RATE_LIMIT_AUTH_REQUESTS: ${RATE_LIMIT_AUTH_REQUESTS:-500}
      RATE_LIMIT_LLM_REQUESTS: ${RATE_LIMIT_LLM_REQUESTS:-500}
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:18081:8081"
    depends_on:
      redis:
        condition: service_healthy
      # Does not wait for identity-svc and profile-svc to be ready: gRPC
      # connections are opened lazily, and a gateway that refuses to start
      # because its neighbours are not ready would turn the start-up order
      # into a fragile chain.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 128M

  # The Kafka topics are created BEFORE any unit starts - the counterpart of
  # the `topics` Job on k3d (deploy/k3d/infra.sh), which until now had no
  # twin in compose. What taught it: the B23 fix (KAFKA_LOG_DIRS) made the
  # Kafka container be recreated with an empty volume, every topic vanished,
  # and every outbox relay failed with UNKNOWN_TOPIC_OR_PARTITION until `task
  # topics` was run by hand. cmd/topics is idempotent, so it is safe to run
  # on every `up`; the units wait for it to FINISH, not merely to start.
  topics:
    build:
      context: ../..
      args:
        UNIT: topics
    restart: "no"
    container_name: selaras-topics
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
