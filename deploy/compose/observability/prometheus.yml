# Prometheus scrapes metrics from every unit's probe/admin port.
#
# Static targets, not discovery: in compose, the service name is the host
# name, and the unit list is fixed. In the cluster, this list is replaced by
# a ServiceMonitor (F9-06, k8s side).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: selaras
    static_configs:
      - targets: ["edge-gateway:8081"]
        labels: { unit: edge-gateway }
      - targets: ["identity-svc:9102"]
        labels: { unit: identity-svc }
      - targets: ["profile-svc:9202"]
        labels: { unit: profile-svc }
      - targets: ["assessment-svc:9302"]
        labels: { unit: assessment-svc }
      - targets: ["coaching-svc:9403"]
        labels: { unit: coaching-svc }
      - targets: ["chat-svc:9503"]
        labels: { unit: chat-svc }
      - targets: ["nutrition-svc:9603"]
        labels: { unit: nutrition-svc }
      - targets: ["dashboard-svc:9703"]
        labels: { unit: dashboard-svc }
      - targets: ["llm-worker:9402"]
        labels: { unit: llm-worker }

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

# The alert rules (alerts.yml) and where alerts are sent. The rules are
# tested by promtool in CI; the receiver is Mailpit (alertmanager.yml), so a
# firing alert is really seen, not assumed.
rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
