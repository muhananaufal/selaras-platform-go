# Grafana Tempo - trace storage, single-process mode, local file backend.
#
# Block retention uses the Tempo 3 default (336 hours, block_retention in
# the compaction block). The top-level `compactor` block from Tempo 2 NO
# LONGER EXISTS in 3.x - the container refuses to start with "field
# compactor not found", and that happened here. The volume is small for a
# development environment, so the default is enough; what matters is that it
# is stated, not assumed.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
