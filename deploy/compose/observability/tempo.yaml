# Grafana Tempo - penyimpanan trace, mode satu proses, backend berkas lokal.
#
# Retensi blok memakai bawaan Tempo 3 (336 jam, block_retention di blok
# compaction). Blok `compactor` tingkat atas dari Tempo 2 SUDAH TIDAK ADA di
# 3.x - container menolak start dengan "field compactor not found", dan itu
# terjadi di sini. Volume-nya kecil untuk lingkungan pengembangan, jadi
# bawaannya cukup; yang penting adalah ia dinyatakan, bukan diasumsikan.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
