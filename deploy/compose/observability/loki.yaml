# Grafana Loki - log storage, single-process mode, local file backend.
#
# 7-day retention, pruned by the compactor. Logs are sent by Alloy from the
# Docker daemon (see alloy.alloy), so the units know NOTHING about Loki:
# they write JSON to stdout and stop there.

auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  # Alloy sends the whole container log history when it first starts, and
  # the default 4 MB/second refuses it as "rate limit exceeded". Raised so
  # the initial backlog gets in rather than lost.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
