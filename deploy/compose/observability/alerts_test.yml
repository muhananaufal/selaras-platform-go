# Unit tests for the alert rules (promtool test rules). Every alert is
# proven to FIRE on a violating series and STAY QUIET on a healthy one; a
# rule whose syntax alone is checked proves nothing.
#
# slo-rules.yml is generated by Sloth from deploy/slo/selaras.yml; these
# tests pin what the generated burn-rate alerts do, so a spec change that
# silently weakens paging fails here.
rule_files:
  - alerts.yml
  - slo-rules.yml

evaluation_interval: 1m

tests:
  # --- Availability: 20 % 5xx for an hour burns the 1 % budget 20 times
  # over - page (14.4x on 5m and 1h) and ticket (3x on 2h and 1d).
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="selaras",unit="edge-gateway",http_route="/edge.v1.Auth/GetMe",http_response_status_code="200"}'
        values: '0+800x90'
      - series: 'http_server_request_duration_seconds_count{job="selaras",unit="edge-gateway",http_route="/edge.v1.Auth/GetMe",http_response_status_code="503"}'
        values: '0+200x90'
    alert_rule_test:
      - eval_time: 65m
        alertname: SelarasAvailabilitySLOBurn
        exp_alerts:
          - exp_labels:
              severity: page
              sloth_severity: page
              sloth_id: edge-gateway-requests-availability
              sloth_service: edge-gateway
              sloth_slo: requests-availability
              owner: selaras
              tier: "1"
            exp_annotations:
              summary: "Edge 5xx ratio is burning the 99 % availability error budget"
              runbook: "docs/runbook/error-budget.md"
              title: "(page) edge-gateway requests-availability SLO error budget burn rate is too fast."
          - exp_labels: &availability_ticket
              severity: ticket
              sloth_severity: ticket
              sloth_id: edge-gateway-requests-availability
              sloth_service: edge-gateway
              sloth_slo: requests-availability
              owner: selaras
              tier: "1"
            exp_annotations: &availability_ticket_annotations
              summary: "Edge 5xx ratio is burning the 99 % availability error budget"
              runbook: "docs/runbook/error-budget.md"
              title: "(ticket) edge-gateway requests-availability SLO error budget burn rate is too fast."

  # 0.5 % 5xx is inside the budget: nothing fires.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="selaras",unit="edge-gateway",http_route="/edge.v1.Auth/GetMe",http_response_status_code="200"}'
        values: '0+995x90'
      - series: 'http_server_request_duration_seconds_count{job="selaras",unit="edge-gateway",http_route="/edge.v1.Auth/GetMe",http_response_status_code="503"}'
        values: '0+5x90'
    alert_rule_test:
      - eval_time: 65m
        alertname: SelarasAvailabilitySLOBurn
        exp_alerts: []

  # --- Slow burn: 4 % 5xx for seven hours is under the 6x page threshold
  # but over 3x on 2h and 1d - a ticket, not a page.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="selaras",unit="edge-gateway",http_route="/edge.v1.Auth/GetMe",http_response_status_code="200"}'
        values: '0+960x420'
      - series: 'http_server_request_duration_seconds_count{job="selaras",unit="edge-gateway",http_route="/edge.v1.Auth/GetMe",http_response_status_code="503"}'
        values: '0+40x420'
    alert_rule_test:
      - eval_time: 7h
        alertname: SelarasAvailabilitySLOBurn
        exp_alerts:
          - exp_labels: *availability_ticket
            exp_annotations: *availability_ticket_annotations

  # --- Latency: every GetMe answered in the 50-100 ms bucket for an hour
  # spends the 5 % budget 20 times over - page and ticket.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="selaras",unit="edge-gateway",http_route="/edge.v1.Auth/GetMe",http_response_status_code="200"}'
        values: '0+100x90'
      - series: 'http_server_request_duration_seconds_bucket{job="selaras",unit="edge-gateway",http_route="/edge.v1.Auth/GetMe",http_response_status_code="200",le="0.05"}'
        values: '0+0x90'
    alert_rule_test:
      - eval_time: 65m
        alertname: SelarasLatencySLOBurn
        exp_alerts:
          - exp_labels:
              severity: page
              sloth_severity: page
              sloth_id: edge-gateway-requests-latency
              sloth_service: edge-gateway
              sloth_slo: requests-latency
              owner: selaras
              tier: "1"
            exp_annotations:
              summary: "Edge requests slower than 50 ms are burning the latency error budget"
              runbook: "docs/runbook/error-budget.md"
              title: "(page) edge-gateway requests-latency SLO error budget burn rate is too fast."
          - exp_labels:
              severity: ticket
              sloth_severity: ticket
              sloth_id: edge-gateway-requests-latency
              sloth_service: edge-gateway
              sloth_slo: requests-latency
              owner: selaras
              tier: "1"
            exp_annotations:
              summary: "Edge requests slower than 50 ms are burning the latency error budget"
              runbook: "docs/runbook/error-budget.md"
              title: "(ticket) edge-gateway requests-latency SLO error budget burn rate is too fast."

  # Every GetMe within 50 ms: quiet.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="selaras",unit="edge-gateway",http_route="/edge.v1.Auth/GetMe",http_response_status_code="200"}'
        values: '0+100x90'
      - series: 'http_server_request_duration_seconds_bucket{job="selaras",unit="edge-gateway",http_route="/edge.v1.Auth/GetMe",http_response_status_code="200",le="0.05"}'
        values: '0+100x90'
    alert_rule_test:
      - eval_time: 65m
        alertname: SelarasLatencySLOBurn
        exp_alerts: []

  # A Watch* stream lives for seconds by design; fast GetMe calls next to
  # slow streams must not burn the latency budget.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="selaras",unit="edge-gateway",http_route="/edge.v1.Auth/GetMe",http_response_status_code="200"}'
        values: '0+100x90'
      - series: 'http_server_request_duration_seconds_bucket{job="selaras",unit="edge-gateway",http_route="/edge.v1.Auth/GetMe",http_response_status_code="200",le="0.05"}'
        values: '0+100x90'
      - series: 'http_server_request_duration_seconds_count{job="selaras",unit="edge-gateway",http_route="/edge.v1.Chat/WatchConversation",http_response_status_code="200"}'
        values: '0+100x90'
      - series: 'http_server_request_duration_seconds_bucket{job="selaras",unit="edge-gateway",http_route="/edge.v1.Chat/WatchConversation",http_response_status_code="200",le="0.05"}'
        values: '0+0x90'
    alert_rule_test:
      - eval_time: 65m
        alertname: SelarasLatencySLOBurn
        exp_alerts: []

  # --- Slow registration does NOT burn the latency budget (it is
  # excluded), but fires the registration alert when p95 > 1.5 s.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="selaras",unit="edge-gateway",http_route="/edge.v1.Auth/Register",http_response_status_code="200"}'
        values: '0+10x90'
      - series: 'http_server_request_duration_seconds_bucket{job="selaras",unit="edge-gateway",http_route="/edge.v1.Auth/Register",le="0.05"}'
        values: '0+0x90'
      - series: 'http_server_request_duration_seconds_bucket{job="selaras",unit="edge-gateway",http_route="/edge.v1.Auth/Register",le="1"}'
        values: '0+0x90'
      - series: 'http_server_request_duration_seconds_bucket{job="selaras",unit="edge-gateway",http_route="/edge.v1.Auth/Register",le="2.5"}'
        values: '0+10x90'
      - series: 'http_server_request_duration_seconds_bucket{job="selaras",unit="edge-gateway",http_route="/edge.v1.Auth/Register",le="+Inf"}'
        values: '0+10x90'
    alert_rule_test:
      - eval_time: 65m
        alertname: SelarasLatencySLOBurn
        exp_alerts: []
      - eval_time: 16m
        alertname: SelarasRegisterLatencyAboveSLO
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations:
              summary: "Registration p95 above 1.5 s"
              description: "The argon2id hasher is capped at two concurrent derivations (identity-svc); a queue behind it means identity-svc needs replicas, not CPU."

  # --- A unit down for 2 minutes fires the page naming the unit.
  - interval: 1m
    input_series:
      - series: 'up{job="selaras",unit="coaching-svc"}'
        values: '1 1 0 0 0 0'
      - series: 'up{job="selaras",unit="edge-gateway"}'
        values: '1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 5m
        alertname: SelarasUnitDown
        exp_alerts:
          - exp_labels: { severity: page, job: selaras, unit: coaching-svc }
            exp_annotations:
              summary: "Unit coaching-svc could not be scraped for 2 minutes"
              description: "Runbook: docs/runbook/coaching-svc.md. On compose: docker compose ps; on the cluster: kubectl -n selaras get pods."

  # --- LLM: one dead job fires immediately; 30 minutes parked with nothing
  # finishing fires; parking interleaved with finished jobs does not.
  - interval: 1m
    input_series:
      - series: 'llm_jobs_total{job="selaras",unit="llm-worker",outcome="dead"}'
        values: '0 0 0 1 1 1'
    alert_rule_test:
      - eval_time: 5m
        alertname: SelarasLLMJobsDying
        exp_alerts:
          - exp_labels: { severity: ticket, job: selaras, unit: llm-worker, outcome: dead }
            exp_annotations:
              summary: "1 LLM job(s) dead within 15 minutes"
              description: "SELECT id, kind, last_error FROM llm.llm_jobs WHERE status='dead' ORDER BY updated_at DESC; runbook docs/runbook/llm-worker.md symptom 2."

  - interval: 1m
    input_series:
      - series: 'llm_jobs_total{job="selaras",unit="llm-worker",outcome="parked"}'
        values: '0+1x70'
      - series: 'llm_jobs_total{job="selaras",unit="llm-worker",outcome="completed"}'
        values: '5+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: SelarasLLMQueueParked
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations:
              summary: "LLM worker parked for 30 minutes without a single job finishing"
              description: "The provider quota is exhausted and not recovering; the quota name is in the worker log (`quota ...`). Jobs are waiting, not dead."

  - interval: 1m
    input_series:
      - series: 'llm_jobs_total{job="selaras",unit="llm-worker",outcome="parked"}'
        values: '0+1x70'
      - series: 'llm_jobs_total{job="selaras",unit="llm-worker",outcome="completed"}'
        values: '0+1x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: SelarasLLMQueueParked
        exp_alerts: []

  # --- An llm.jobs backlog growing for 15 minutes fires the ticket; a large
  # flat backlog does not (the worker is catching up, not falling behind).
  - interval: 1m
    input_series:
      - series: 'kafka_consumer_lag{job="selaras",unit="llm-worker",topic="llm.jobs",partition="0"}'
        values: '50+10x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: SelarasLLMBacklogGrowing
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations:
              summary: "Backlog llm.jobs 450 and still growing"
              description: "Compare with the worker replicas (max 12, docs/topics.md) and llm_job_duration_seconds; runbook docs/runbook/llm-worker.md symptom 3."
  - interval: 1m
    input_series:
      - series: 'kafka_consumer_lag{job="selaras",unit="llm-worker",topic="llm.jobs",partition="0"}'
        values: '400+0x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: SelarasLLMBacklogGrowing
        exp_alerts: []

  # --- The error budget survives an idle window. Ten minutes with no
  # traffic make every 5m ratio 0/0 = NaN; an average of those ratios (Sloth's
  # default 30d rule) stays NaN for the whole period, and the release gate
  # (cmd/slo-budget) could never decide. Counted from the raw events, the
  # hour of clean traffic that follows leaves the whole budget.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="selaras",unit="edge-gateway",http_route="/edge.v1.Auth/GetMe",http_response_status_code="200"}'
        values: '0x10 0+100x60'
      - series: 'http_server_request_duration_seconds_count{job="selaras",unit="edge-gateway",http_route="/edge.v1.Auth/GetMe",http_response_status_code="503"}'
        values: '0x70'
    promql_expr_test:
      - eval_time: 70m
        expr: slo:period_error_budget_remaining:ratio{sloth_slo="requests-availability"}
        exp_samples:
          - labels: 'slo:period_error_budget_remaining:ratio{owner="selaras",sloth_id="edge-gateway-requests-availability",sloth_service="edge-gateway",sloth_slo="requests-availability",sloth_window="30d",tier="1"}'
            value: 1
