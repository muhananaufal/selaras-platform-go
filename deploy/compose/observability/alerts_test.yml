# Unit tests for the alert rules (promtool test rules). Every alert is
# proven to FIRE on a violating series and STAY QUIET on a healthy one; a
# rule whose syntax alone is checked proves nothing.
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # --- Availability: 20 % 5xx for one hour fires the page (14.4 x the 1 % budget); 0.5 % does
  # not.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="selaras",unit="edge-gateway",http_route="/api/v1/me",http_response_status_code="200"}'
        values: '0+800x90'
      - series: 'http_server_request_duration_seconds_count{job="selaras",unit="edge-gateway",http_route="/api/v1/me",http_response_status_code="503"}'
        values: '0+200x90'
    alert_rule_test:
      - eval_time: 65m
        alertname: SelarasErrorBudgetBurningFast
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations:
              summary: "5xx above 14.4 times the error budget (99 % SLO)"
              description: "5xx ratio 5m=20%; the month's budget is spent in two days at this rate. See docs/runbook/edge-gateway.md."

  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="selaras",unit="edge-gateway",http_route="/api/v1/me",http_response_status_code="200"}'
        values: '0+995x90'
      - series: 'http_server_request_duration_seconds_count{job="selaras",unit="edge-gateway",http_route="/api/v1/me",http_response_status_code="503"}'
        values: '0+5x90'
    alert_rule_test:
      - eval_time: 65m
        alertname: SelarasErrorBudgetBurningFast
        exp_alerts: []

  # --- Latency: every request in the 100 ms bucket (p95 ~ 100 ms) for 15
  # minutes fires the ticket; every request in the 10 ms bucket does not.
  # The buckets follow the OpenTelemetry defaults (0.005, 0.01, 0.025, 0.05,
  # 0.1, ...).
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_bucket{job="selaras",unit="edge-gateway",http_route="/api/v1/me",le="0.05"}'
        values: '0+0x20'
      - series: 'http_server_request_duration_seconds_bucket{job="selaras",unit="edge-gateway",http_route="/api/v1/me",le="0.1"}'
        values: '0+100x20'
      - series: 'http_server_request_duration_seconds_bucket{job="selaras",unit="edge-gateway",http_route="/api/v1/me",le="+Inf"}'
        values: '0+100x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: SelarasLatencyAboveSLO
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations:
              summary: "HTTP p95 above the 50 ms SLO for 10 minutes"
              description: "p95=97.5ms. A one-order regression is usually a query without an index or a gRPC call that became two; compare with docs/performance-report.md."

  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_bucket{job="selaras",unit="edge-gateway",http_route="/api/v1/me",le="0.01"}'
        values: '0+100x20'
      - series: 'http_server_request_duration_seconds_bucket{job="selaras",unit="edge-gateway",http_route="/api/v1/me",le="0.05"}'
        values: '0+100x20'
      - series: 'http_server_request_duration_seconds_bucket{job="selaras",unit="edge-gateway",http_route="/api/v1/me",le="+Inf"}'
        values: '0+100x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: SelarasLatencyAboveSLO
        exp_alerts: []

  # --- Slow registration does NOT fire the general latency alert (it is
  # excluded), but fires the registration alert when > 1.5 s.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_bucket{job="selaras",unit="edge-gateway",http_route="/api/v1/register",le="1"}'
        values: '0+0x20'
      - series: 'http_server_request_duration_seconds_bucket{job="selaras",unit="edge-gateway",http_route="/api/v1/register",le="2.5"}'
        values: '0+10x20'
      - series: 'http_server_request_duration_seconds_bucket{job="selaras",unit="edge-gateway",http_route="/api/v1/register",le="+Inf"}'
        values: '0+10x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: SelarasLatencyAboveSLO
        exp_alerts: []
      - eval_time: 16m
        alertname: SelarasRegisterLatencyAboveSLO
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations:
              summary: "Registration p95 above 1.5 s"
              description: "The argon2id hasher is capped at two concurrent derivations (identity-svc); a queue behind it means identity-svc needs replicas, not CPU."

  # --- A unit down for 2 minutes fires the page naming the unit.
  - interval: 1m
    input_series:
      - series: 'up{job="selaras",unit="coaching-svc"}'
        values: '1 1 0 0 0 0'
      - series: 'up{job="selaras",unit="edge-gateway"}'
        values: '1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 5m
        alertname: SelarasUnitDown
        exp_alerts:
          - exp_labels: { severity: page, job: selaras, unit: coaching-svc }
            exp_annotations:
              summary: "Unit coaching-svc could not be scraped for 2 minutes"
              description: "Runbook: docs/runbook/coaching-svc.md. On compose: docker compose ps; on the cluster: kubectl -n selaras get pods."

  # --- LLM: one dead job fires immediately; 30 minutes parked with nothing
  # finishing fires; parking interleaved with finished jobs does not.
  - interval: 1m
    input_series:
      - series: 'llm_jobs_total{job="selaras",unit="llm-worker",outcome="dead"}'
        values: '0 0 0 1 1 1'
    alert_rule_test:
      - eval_time: 5m
        alertname: SelarasLLMJobsDying
        exp_alerts:
          - exp_labels: { severity: ticket, job: selaras, unit: llm-worker, outcome: dead }
            exp_annotations:
              summary: "1 LLM job(s) dead within 15 minutes"
              description: "SELECT id, kind, last_error FROM llm.llm_jobs WHERE status='dead' ORDER BY updated_at DESC; runbook docs/runbook/llm-worker.md symptom 2."

  - interval: 1m
    input_series:
      - series: 'llm_jobs_total{job="selaras",unit="llm-worker",outcome="parked"}'
        values: '0+1x70'
      - series: 'llm_jobs_total{job="selaras",unit="llm-worker",outcome="completed"}'
        values: '5+0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: SelarasLLMQueueParked
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations:
              summary: "LLM worker parked for 30 minutes without a single job finishing"
              description: "The provider quota is exhausted and not recovering; the quota name is in the worker log (`quota ...`). Jobs are waiting, not dead."

  - interval: 1m
    input_series:
      - series: 'llm_jobs_total{job="selaras",unit="llm-worker",outcome="parked"}'
        values: '0+1x70'
      - series: 'llm_jobs_total{job="selaras",unit="llm-worker",outcome="completed"}'
        values: '0+1x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: SelarasLLMQueueParked
        exp_alerts: []

  # --- Slow burn: 8 % errors for seven hours fires the ticket (not the
  # page), and 0.5 % does not.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="selaras",unit="edge-gateway",http_route="/api/v1/me",http_response_status_code="200"}'
        values: '0+920x420'
      - series: 'http_server_request_duration_seconds_count{job="selaras",unit="edge-gateway",http_route="/api/v1/me",http_response_status_code="503"}'
        values: '0+80x420'
    alert_rule_test:
      - eval_time: 7h
        alertname: SelarasErrorBudgetBurningSlowly
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations:
              summary: "5xx above 6 times the error budget for six hours"
              description: "5xx ratio 30m=8%; the month's budget is spent in five days at this rate."
      - eval_time: 7h
        alertname: SelarasErrorBudgetBurningFast
        exp_alerts: []

  # --- An llm.jobs backlog growing for 15 minutes fires the ticket; a large
  # flat backlog does not (the worker is catching up, not falling behind).
  - interval: 1m
    input_series:
      - series: 'kafka_consumer_lag{job="selaras",unit="llm-worker",topic="llm.jobs",partition="0"}'
        values: '50+10x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: SelarasLLMBacklogGrowing
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations:
              summary: "Backlog llm.jobs 450 and still growing"
              description: "Compare with the worker replicas (max 12, docs/topics.md) and llm_job_duration_seconds; runbook docs/runbook/llm-worker.md symptom 3."
  - interval: 1m
    input_series:
      - series: 'kafka_consumer_lag{job="selaras",unit="llm-worker",topic="llm.jobs",partition="0"}'
        values: '400+0x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: SelarasLLMBacklogGrowing
        exp_alerts: []
