# The OpenTelemetry Collector - one entry point for traces from nine units.
#
# The units do NOT send directly to Tempo, and that is deliberate: the units
# know only one address, so replacing the trace backend - or adding a second
# one - touches not a single unit.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # memory_limiter in front of batch: a collector running out of memory drops
  # data in an orderly way, rather than being OOM-killed along with its whole
  # queue.
  memory_limiter:
    check_interval: 1s
    limit_mib: 180
    spike_limit_mib: 40
  batch:
    timeout: 2s
    send_batch_size: 512

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  telemetry:
    metrics:
      level: basic
      # The collector's internal metrics are opened to the compose network
      # so Prometheus can scrape them; the default listens only on the
      # container's localhost, and that target showed "down" - it happened
      # here.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
