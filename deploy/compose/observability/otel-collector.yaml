# OpenTelemetry Collector - satu pintu masuk untuk trace dari sembilan unit.
#
# Unit TIDAK mengirim langsung ke Tempo, dan itu disengaja: alamat yang
# diketahui unit hanya satu, sehingga mengganti backend trace - atau
# menambahkan yang kedua - tidak menyentuh satu pun unit.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # memory_limiter di depan batch: collector yang kehabisan memori menjatuhkan
  # data dengan tertib, bukan di-OOM-kill bersama seluruh antreannya.
  memory_limiter:
    check_interval: 1s
    limit_mib: 180
    spike_limit_mib: 40
  batch:
    timeout: 2s
    send_batch_size: 512

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  telemetry:
    metrics:
      level: basic
      # Metrik internal collector dibuka ke jaringan compose supaya
      # Prometheus bisa menariknya; bawaannya hanya mendengar di localhost
      # container, dan target itu terlihat "down" - itu terjadi di sini.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
