# Prometheus alert rules - derived from the SLOs, not made up.
#
# The availability and latency SLOs (failures < 1 %, 95 % of requests within
# 50 ms - the numbers k6 enforces in test/k6/lib/slo.js) are NOT written
# here: they live in deploy/slo/selaras.yml and Sloth generates their
# multi-window burn-rate alerts into slo-rules.yml. This file keeps the
# rules no error budget describes - registration latency, a unit down, dead
# jobs, a parked queue - each stating its own reason.
#
# Every rule has a unit test in alerts_test.yml (promtool test rules) run in
# CI; a rule never proven to fire is a rule that does not exist. This file
# is used as-is by compose (full.yml) and copied into the ConfigMap in
# deploy/k8s/observability/stack.yaml.
groups:
  - name: selaras-latency
    rules:
      # Registration is excluded from the latency SLO because argon2id
      # really takes ~375 ms; its own ceiling is 1.5 s at p95.
      - alert: SelarasRegisterLatencyAboveSLO
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_request_duration_seconds_bucket{http_route="/edge.v1.Auth/Register"}[5m]))
          ) > 1.5
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "Registration p95 above 1.5 s"
          description: "The argon2id hasher is capped at two concurrent derivations (identity-svc); a queue behind it means identity-svc needs replicas, not CPU."

  - name: selaras-units
    rules:
      # `up` is the only signal that needs no traffic: a unit that dies at
      # three in the morning with no users is still seen.
      - alert: SelarasUnitDown
        expr: up{job=~"selaras|kubernetes-pods"} == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "Unit {{ $labels.unit }} could not be scraped for 2 minutes"
          description: "Runbook: docs/runbook/{{ $labels.unit }}.md. On compose: docker compose ps; on the cluster: kubectl -n selaras get pods."

  - name: selaras-llm
    rules:
      # A dead job is a user's lost work; since ADR-025 quota NO LONGER
      # kills jobs, so every `dead` means a genuinely problematic prompt or
      # answer worth a look.
      - alert: SelarasLLMJobsDying
        expr: increase(llm_jobs_total{outcome="dead"}[15m]) > 0
        for: 0m
        labels: { severity: ticket }
        annotations:
          summary: "{{ $value | humanize }} LLM job(s) dead within 15 minutes"
          description: "SELECT id, kind, last_error FROM llm.llm_jobs WHERE status='dead' ORDER BY updated_at DESC; runbook docs/runbook/llm-worker.md symptom 2."
      # A queue parked continuously means the daily quota, not the
      # per-minute one (ADR-025): there is nothing the worker can do, only a
      # human can raise the billing tier.
      - alert: SelarasLLMQueueParked
        expr: |
          sum(increase(llm_jobs_total{outcome="parked"}[30m])) > 0
            and
          sum(increase(llm_jobs_total{outcome="completed"}[30m])) == 0
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: "LLM worker parked for 30 minutes without a single job finishing"
          description: "The provider quota is exhausted and not recovering; the quota name is in the worker log (`quota ...`). Jobs are waiting, not dead."
      # Lag growing while the worker is alive: the provider's throughput is
      # lower than the request rate. KEDA adds replicas up to 12 (the
      # partition count); above that only the provider quota decides.
      - alert: SelarasLLMBacklogGrowing
        expr: sum(kafka_consumer_lag) > 100 and delta(sum(kafka_consumer_lag)[15m:1m]) > 0
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: "Backlog llm.jobs {{ $value | humanize }} and still growing"
          description: "Compare with the worker replicas (max 12, docs/topics.md) and llm_job_duration_seconds; runbook docs/runbook/llm-worker.md symptom 3."
