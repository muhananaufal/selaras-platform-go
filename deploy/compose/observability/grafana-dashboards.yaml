# The Grafana dashboard provider from files. The dashboards themselves are
# in deploy/grafana/dashboards/ - outside the compose directory, because the
# same files are reused by the ConfigMap in the cluster.

apiVersion: 1

providers:
  - name: selaras
    folder: Selaras
    type: file
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
