# Alertmanager for the local environment: its receiver is EMAIL TO MAILPIT.
#
# Not an empty receiver. An alert that never reaches anywhere cannot be
# proven to work; with Mailpit, every firing alert shows up at
# http://127.0.0.1:18025 like a password reset email - and the chaos that
# kills one unit (test/chaos/service.sh) can be required to produce one
# email. In the cluster, the receiver is replaced through a ConfigMap
# (deploy/k8s/observability/stack.yaml) without changing the rules.
global:
  smtp_smarthost: mailpit:1025
  smtp_from: alerts@selaras.local
  smtp_require_tls: false
  resolve_timeout: 5m

route:
  receiver: mailpit
  group_by: [alertname, unit]
  # Pages are sent immediately and repeated hourly while still firing;
  # tickets are batched for five minutes so one incident becomes one email.
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  routes:
    - matchers: [severity = page]
      group_wait: 10s
      repeat_interval: 1h
    - matchers: [severity = ticket]
      group_wait: 5m
      repeat_interval: 12h

receivers:
  - name: mailpit
    email_configs:
      - to: oncall@selaras.local
        send_resolved: true
